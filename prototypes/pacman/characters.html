			name: "C · Герои с глазами",
			note: "Он — решительный, с тяжёлой бровью, под энерджайзером огненный гребень; она — лавандовая с большими глазами, пузырьками и крылышками феи.",
			pac: heroPac,
			ms: { draw(ctx, s) {
				const { r, t } = s;
				const p = s.power;
				for (let i = 0; i < 7; i++) {
					const at = along(s.trail, r * (.9 + i * .6));
					if (!at) break;
					const k = 1 - i / 7;
					const rr = r * (.12 + .16 * jitter(i + 3));
					const y = at.y - (t * .8 + i * .3) % 1 * r * .6;
					ctx.strokeStyle = `rgba(255,255,255,${.8 * k})`;
					ctx.fillStyle = `rgba(200,190,255,${.25 * k})`;
					ctx.lineWidth = Math.max(1, r * .05);
					ctx.beginPath();
					ctx.arc(at.x + Math.sin(t * 3 + i) * r * .25, y, rr, 0, 7);
					ctx.fill();
					ctx.stroke();
					if (p > .3 && i % 2 === 0) {
						ctx.fillStyle = `rgba(255,250,210,${p * k})`;
						star4(ctx, at.x, at.y + r * .35, r * .15);
						ctx.fill();
					}
				}
				inFrame(ctx, s, () => {
					const R = r * .94 * (1 + .06 * p);
					const half = mouthAngle(s.mouth, .48);
					if (p > .01) {
						ctx.save();
						const flap = .35 * Math.sin(t * 22);
						for (const [rot, size] of [[-2.2 + flap, 1], [-2.75 - flap, .75]]) {
							ctx.save();
							ctx.translate(-R * .35, -R * .35);
							ctx.rotate(rot);
							ctx.beginPath();
							ctx.ellipse(R * .75 * size, 0, R * .75 * size, R * .36 * size, 0, 0, 7);
							ctx.strokeStyle = `rgba(58,36,112,${p})`;
							ctx.lineWidth = R * .12;
							ctx.stroke();
							ctx.fillStyle = `rgba(200,235,255,${.8 * p})`;
							ctx.fill();
							ctx.strokeStyle = `rgba(255,255,255,${.95 * p})`;
							ctx.lineWidth = R * .04;
							ctx.stroke();
							ctx.restore();
						}
						ctx.restore();
					}
					body(ctx, R, half, "#3a2470", R * .18, bodyFill(ctx, R, LILAC, FAIRY, p));
					glossSpot(ctx, -R * .48, -R * .2, R * .2, R * .12, -.9, .7);
					ctx.fillStyle = "rgba(255,120,170,0.55)";
					ctx.beginPath();
					ctx.ellipse(R * 0, -R * .12, R * .15, R * .09, 0, 0, 7);
					ctx.fill();
					ctx.fillStyle = "#ffffff";
					ctx.strokeStyle = "#3a2470";
					ctx.lineWidth = R * .06;
					ctx.beginPath();
					ctx.ellipse(R * .1, -R * .44, R * .19, R * .23, 0, 0, 7);
					ctx.fill();
					ctx.stroke();
					const iris = ctx.createRadialGradient(R * .15, -R * .45, 0, R * .15, -R * .42, R * .15);
					iris.addColorStop(0, "#8a5cff");
					iris.addColorStop(1, "#2a1260");
					ctx.fillStyle = iris;
					ctx.beginPath();
					ctx.arc(R * .15, -R * .42, R * .14, 0, 7);
					ctx.fill();
					ctx.fillStyle = "#ffffff";
					ctx.beginPath();
					ctx.arc(R * .2, -R * .49, R * .055, 0, 7);
					ctx.fill();
					ctx.beginPath();
					ctx.arc(R * .11, -R * .35, R * .028, 0, 7);
					ctx.fill();
					ctx.strokeStyle = "#3a2470";
					ctx.lineWidth = R * .055;
					ctx.lineCap = "round";
					ctx.beginPath();
					for (const [x0, y0, x1, y1] of [
						[
							-.05,
							-.6,
							-.17,
							-.73
						],
						[
							.04,
							-.66,
							-.01,
							-.81
						],
						[
							.14,
							-.67,
							.15,
							-.82
						]
					]) {
						ctx.moveTo(R * x0, R * y0);
						ctx.lineTo(R * x1, R * y1);
					}
					ctx.stroke();
					endingFlash(ctx, s, R, half);
					bow(ctx, -R * .34, -R * .86, R * (.44 + .04 * p), -.35, "#ff5fa2", "#3a2470", "rgba(255,255,255,0.8)", true);
				});
			} }
		}
	];
	//#endregion
	//#region prototypes/pacman/characters/main.ts
	var $ = (id) => document.getElementById(id);
	var view = $("view");
	var ctx = view.getContext("2d");
	var D = Math.min(window.devicePixelRatio || 1, 2);
	/** Corridor loops in GRID_01 (tile corners, clockwise from the bottom-left). */
	var PAC_LOOP = [
		[13, 5],
		[22, 5],
		[22, 2],
		[13, 2]
	];
	var MS_LOOP = [
		[2, 5],
		[11, 5],
		[11, 2],
		[2, 2]
	];
	var SPEED = 5.2;
	var POWER_TIME = 6;
	var POWER_ENDING = 1.6;
	var POWER_EASE = .35;
	var concept = 0;
	var season = "summer";
	var world;
	var night = false;
	var stopped = false;
	var vw = 0;
	var vh = 0;
	var powerTimer = 0;
	var power = 0;
	function perimeter(loop) {
		let p = 0;
		for (let i = 0; i < loop.length; i++) {
			const [ax, ay] = loop[i];
			const [bx, by] = loop[(i + 1) % loop.length];
			p += Math.abs(bx - ax) + Math.abs(by - ay);
		}
		return p;
	}
	/** Tile-centre position and heading at a distance along the loop. */
	function onLoop(loop, d) {
		const per = perimeter(loop);
		let rest = (d % per + per) % per;
		for (let i = 0; i < loop.length; i++) {
			const [ax, ay] = loop[i];
			const [bx, by] = loop[(i + 1) % loop.length];
			const len = Math.abs(bx - ax) + Math.abs(by - ay);
			if (rest <= len) {
				const u = rest / len;
				return {
					x: ax + (bx - ax) * u + .5,
					y: ay + (by - ay) * u + .5,
					angle: Math.atan2(by - ay, bx - ax)
				};
			}
			rest -= len;
		}
		return {
			x: loop[0][0] + .5,
			y: loop[0][1] + .5,
			angle: 0
		};
	}
	var runners = [{
		loop: PAC_LOOP,
		along: 0,
		flip: 1,
		trail: [],
		art: () => CONCEPTS[concept].pac
	}, {
		loop: MS_LOOP,
		along: 7,
		flip: 1,
		trail: [],
		art: () => CONCEPTS[concept].ms
	}];
	function buildWorld() {
		world = new MeadowWorld(GRID_01, meadowThemeFor(season));
		world.resize(vw, vh, D);
		world.setMood(0, night ? 1 : 0);
		for (let i = 0; i < 80; i++) world.update(.1);
		for (const r of runners) r.trail = [];
		for (const b of document.querySelectorAll("[data-season]")) b.setAttribute("aria-pressed", String(b.dataset.season === season));
	}
	function layout() {
		vw = window.innerWidth;
		vh = window.innerHeight;
		view.width = Math.round(vw * D);
		view.height = Math.round(vh * D);
		view.style.width = `${vw}px`;
		view.style.height = `${vh}px`;
		buildWorld();
	}
	function selectConcept(i) {
		concept = i;
		for (const b of document.querySelectorAll("[data-concept]")) b.setAttribute("aria-pressed", String(Number(b.dataset.concept) === concept));
		$("note").textContent = `${CONCEPTS[concept].name} — ${CONCEPTS[concept].note}`;
	}
	for (const b of document.querySelectorAll("[data-concept]")) b.addEventListener("click", () => selectConcept(Number(b.dataset.concept)));
	for (const b of document.querySelectorAll("[data-season]")) b.addEventListener("click", () => {
		season = b.dataset.season;
		buildWorld();
	});
	$("night").addEventListener("click", () => {
		night = !night;
		$("night").setAttribute("aria-pressed", String(night));
		world.setMood(0, night ? 1 : 0);
	});
	$("power").addEventListener("click", () => {
		powerTimer = POWER_TIME;
	});
	$("stop").addEventListener("click", () => {
		stopped = !stopped;
		$("stop").setAttribute("aria-pressed", String(stopped));
	});
	/** The arcade chomp: open and shut while moving, half open when standing. */
	var chomp = (t, moving) => moving ? Math.abs(Math.sin(t * 13)) : .35;
	/** A trail for an actor standing in place: a gentle wave behind it, newest first. */
	function waveTrail(x, y, r, t) {
		return Array.from({ length: 22 }, (_, i) => ({
			x: x - i * r * .32,
			y: y + Math.sin(t * 4 - i * .35) * r * .22 * Math.min(1, i / 4)
		}));
	}
	var time = 0;
	var last = performance.now();
	function frame(now) {
		const dt = Math.min(.1, (now - last) / 1e3);
		last = now;
		time += dt;
		powerTimer = Math.max(0, powerTimer - dt);
		const target = powerTimer > 0 ? 1 : 0;
		power += Math.sign(target - power) * Math.min(Math.abs(target - power), dt / POWER_EASE);
		const ending = powerTimer > 0 && powerTimer < POWER_ENDING ? 1 : 0;
		world.update(dt);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.globalAlpha = 1;
		ctx.globalCompositeOperation = "source-over";
		world.drawWorld(ctx);
		world.drawMood(ctx);
		world.drawFood(ctx, () => true);
		const L = world.layout;
		const S = L.tileSize;
		for (const runner of runners) {
			if (!stopped) runner.along += SPEED * dt;
			const p = onLoop(runner.loop, runner.along);
			if (Math.abs(Math.cos(p.angle)) > .5) runner.flip = Math.cos(p.angle) > 0 ? 1 : -1;
			const x = L.offsetX + p.x * S;
			const y = L.offsetY + p.y * S;
			const head = runner.trail[0];
			if (!head || Math.hypot(head.x - x, head.y - y) > S * .12) {
				runner.trail.unshift({
					x,
					y
				});
				if (runner.trail.length > 26) runner.trail.length = 26;
			} else runner.trail[0] = {
				x,
				y
			};
			const state = {
				x,
				y,
				r: S * .44,
				angle: p.angle,
				flip: runner.flip,
				mouth: chomp(time, !stopped),
				power,
				ending,
				t: time,
				trail: runner.trail
			};
			runner.art().draw(ctx, state);
		}
		world.drawOverlay(ctx);
		const srcW = 23 * S;
		const srcH = 6 * S;
		const boxW = Math.min(vw - 36, srcW * 2.6, (vh - 400) / srcH * srcW);
		const boxH = boxW / srcW * srcH;
		const sx = (L.offsetX + 1 * S) * D;
		const sy = (L.offsetY + 1 * S) * D;
		const px = (vw - boxW) / 2;
		const py = vh - boxH - 74;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(view, sx, sy, srcW * D, srcH * D, px * D, py * D, boxW * D, boxH * D);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.strokeStyle = "rgba(255,255,255,.9)";
		ctx.lineWidth = 2;
		ctx.strokeRect(px, py, boxW, boxH);
		const cell = Math.min(230, (vw - 36) / 4);
		const stripW = cell * 4;
		const stripX = (vw - stripW) / 2;
		const stripY = 14;
		ctx.fillStyle = "#0a0c14";
		ctx.fillRect(stripX, stripY, stripW, cell * .8 + 24);
		const c = CONCEPTS[concept];
		[
			[
				c.pac,
				0,
				"PAC-MAN"
			],
			[
				c.pac,
				1,
				"PAC-MAN · ЭНЕРДЖАЙЗЕР"
			],
			[
				c.ms,
				0,
				"MS. PAC-MAN"
			],
			[
				c.ms,
				1,
				"MS. PAC-MAN · ЭНЕРДЖАЙЗЕР"
			]
		].forEach(([art, pw, label], i) => {
			const r = cell * .17;
			const x = stripX + cell * (i + .62);
			const y = stripY + cell * .42;
			ctx.save();
			ctx.beginPath();
			ctx.rect(stripX + cell * i, stripY, cell, cell * .8 + 24);
			ctx.clip();
			art.draw(ctx, {
				x,
				y,
				r,
				angle: 0,
				flip: 1,
				mouth: chomp(time, true),
				power: pw,
				ending: 0,
				t: time,
				trail: waveTrail(x, y, r, time)
			});
			ctx.restore();
			ctx.fillStyle = "rgba(200,212,224,.75)";
			ctx.font = "11px \"Courier New\", monospace";
			ctx.textAlign = "center";
			ctx.fillText(label, stripX + cell * (i + .5), stripY + cell * .8 + 16);
		});
		$("note").style.top = `${stripY + cell * .8 + 30}px`;
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	selectConcept(0);
	requestAnimationFrame(frame);
	//#endregion
})();

    </script>
  </body>
