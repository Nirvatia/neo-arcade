	/** The farthest visible pixel (alpha > 10) from the tile centre over a few seconds, in tiles. */
	function reach(item) {
		const T = 100;
		const c = document.createElement("canvas");
		c.width = c.height = 400;
		const x = c.getContext("2d", { willReadFrequently: true });
		const mid = 200;
		let far = 0;
		for (let t = 0; t < 6; t += .2) {
			x.clearRect(0, 0, c.width, c.height);
			item.draw(x, mid, mid, T, t);
			const d = x.getImageData(0, 0, c.width, c.height).data;
			for (let py = 0; py < c.height; py++) for (let px = 0; px < c.width; px++) if (d[(py * c.width + px) * 4 + 3] > 10) far = Math.max(far, Math.abs(px + .5 - mid), Math.abs(py + .5 - mid));
		}
		return far / T;
	}
	var REACH = ITEMS.map(reach);
	var time = 0;
	var last = performance.now();
	function frame(now) {
		const dt = Math.min(.1, (now - last) / 1e3);
		last = now;
		time += dt;
		world.update(dt);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.globalAlpha = 1;
		ctx.globalCompositeOperation = "source-over";
		world.drawWorld(ctx, () => false);
		world.drawMood(ctx);
		const L = world.layout;
		const S = L.tileSize;
		const hidden = blink && Math.floor(time * 4) % 2 === 0;
		ITEMS.forEach((item, i) => {
			const [tx, ty] = SPOTS[i];
			ctx.save();
			ctx.globalAlpha = hidden ? .45 : 1;
			item.draw(ctx, L.offsetX + (tx + .5) * S, L.offsetY + (ty + .5) * S, S, time);
			ctx.restore();
		});
		world.drawOverlay(ctx);
		if (grid) {
			ctx.strokeStyle = "rgba(255,255,255,.35)";
			ctx.lineWidth = 1 / D;
			ctx.beginPath();
			for (let c = 12; c <= 24; c++) {
				ctx.moveTo(L.offsetX + c * S, L.offsetY + S);
				ctx.lineTo(L.offsetX + c * S, L.offsetY + 7 * S);
			}
			for (let r = 1; r <= 7; r++) {
				ctx.moveTo(L.offsetX + 12 * S, L.offsetY + r * S);
				ctx.lineTo(L.offsetX + 24 * S, L.offsetY + r * S);
			}
			ctx.stroke();
		}
		const srcW = 12 * S;
		const srcH = 6 * S;
		const boxW = Math.min(vw - 36, srcW * ZOOM, (vh - 300) / srcH * srcW);
		const boxH = boxW / srcW * srcH;
		const sx = (L.offsetX + 12 * S) * D;
		const sy = (L.offsetY + 1 * S) * D;
		const px = (vw - boxW) / 2;
		const py = vh - boxH - 90;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(view, sx, sy, srcW * D, srcH * D, px * D, py * D, boxW * D, boxH * D);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.strokeStyle = "rgba(255,255,255,.9)";
		ctx.lineWidth = 2;
		ctx.strokeRect(px, py, boxW, boxH);
		const cell = Math.min(150, (vw - 36) / ITEMS.length);
		const stripW = cell * ITEMS.length;
		const stripX = (vw - stripW) / 2;
		const stripY = 14;
		ctx.fillStyle = "#06080e";
		ctx.fillRect(stripX, stripY, stripW, cell + 36);
		ITEMS.forEach((item, i) => {
			item.draw(ctx, stripX + cell * (i + .5), stripY + cell / 2 + 4, cell * .62, time);
			ctx.fillStyle = "rgba(200,212,224,.75)";
			ctx.font = "11px \"Courier New\", monospace";
			ctx.textAlign = "center";
			ctx.fillText(item.name.toUpperCase(), stripX + cell * (i + .5), stripY + cell + 14);
			ctx.fillStyle = REACH[i] > .5 ? "#ff6a5a" : "#7be0a0";
			ctx.fillText(`${REACH[i].toFixed(2)} tile`, stripX + cell * (i + .5), stripY + cell + 28);
		});
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	requestAnimationFrame(frame);
	//#endregion
})();

    </script>
  </body>
