		buildWorld();
	}
	for (const b of document.querySelectorAll("[data-season]")) b.addEventListener("click", () => {
		season = b.dataset.season;
		buildWorld();
	});
	$("night").addEventListener("click", () => {
		night = !night;
		$("night").setAttribute("aria-pressed", String(night));
		world.setMood(night ? 1 : 0, night ? 1 : 0);
	});
	$("solve").addEventListener("click", () => {
		if (scene.solved) return;
		scene.solved = true;
		for (const kind of [
			"BLINKY",
			"PINKY",
			"INKY",
			"CLYDE"
		]) scene.lairCode.register(kind);
	});
	$("again").addEventListener("click", () => {
		scene = buildScene();
	});
	scene = buildScene();
	var time = 0;
	var last = performance.now();
	function frame(now) {
		const dt = Math.min(.1, (now - last) / 1e3);
		last = now;
		time += dt;
		const { grid, player, ghosts, lairCode, egg } = scene;
		lairCode.update(dt);
		grid.setLairOpen(egg.lairOpen);
		if (scene.solved) {
			const eggTile = grid.lairEggTile() ?? {
				x: 12,
				y: 12
			};
			const dir = stepTowards(egg.lairOpen ? eggTile : {
				x: eggTile.x,
				y: eggTile.y - 3
			});
			if (dir) player.setDesiredDirection(dir);
		}
		player.update(dt);
		egg.update(dt, player);
		ghosts.update(dt);
		if (egg.phase === "spent") {
			scene.doneFor = scene.doneFor < 0 ? 0 : scene.doneFor + dt;
			if (scene.doneFor > 2) scene = buildScene();
		}
		world.update(dt);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.globalAlpha = 1;
		ctx.globalCompositeOperation = "source-over";
		world.setLairGate(egg.doorOpen);
		world.drawWorld(ctx);
		world.drawMood(ctx);
		world.drawFood(ctx, (x, y) => scene.progress.isCollected(x, y));
		const L = world.layout;
		const S = L.tileSize;
		eggView.draw(ctx, egg, L, time);
		ghostView.draw(ctx, ghosts, L, 0, false, egg.vanishProgress);
		playerView.draw(ctx, player, L, time);
		world.drawOverlay(ctx);
		const srcW = 11 * S;
		const srcH = 9 * S;
		const boxW = Math.min(vw * .45, srcW * ZOOM, (vh - 260) / srcH * srcW);
		const boxH = boxW / srcW * srcH;
		const sx = (L.offsetX + 7 * S) * D;
		const sy = (L.offsetY + 8 * S) * D;
		const px = vw - boxW - 18;
		const py = 18;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(view, sx, sy, srcW * D, srcH * D, px * D, py * D, boxW * D, boxH * D);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.strokeStyle = "rgba(255,255,255,.9)";
		ctx.lineWidth = 2;
		ctx.strokeRect(px, py, boxW, boxH);
		const cell = 150;
		ctx.fillStyle = "#06080e";
		ctx.fillRect(18, 18, cell, 172);
		drawEasterEgg(ctx, 93, 97, cell * .9, time);
		ctx.fillStyle = "rgba(200,212,224,.75)";
		ctx.font = "11px \"Courier New\", monospace";
		ctx.textAlign = "center";
		ctx.fillText(`EASTER EGG · ${egg.phase.toUpperCase()}`, 93, 182);
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	requestAnimationFrame(frame);
	//#endregion
})();

    </script>
  </body>
</html>
