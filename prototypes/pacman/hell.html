    <title>Pac-Man · Hell rework</title>

         aimed seals and the new eruption, on the game's own code. Built from the sources:
         `node prototypes/pacman/build.mjs hell`; open as a file. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#000}
      #view{position:fixed;inset:0;display:block}
      #ctl{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;width:calc(100vw - 32px);max-width:980px}
      .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}

    </style>
  </head>

    <canvas id="view"></canvas>
    <div id="ctl">
      <div class="row fight-only"><span id="status"></span></div>
      <div class="row fight-only"><span id="hint">Стрелки / WASD — движение, F — оружие. Попробуйте печати и извержение в фазах 2 и 3.</span></div>
      <div class="row">
        <button class="bt" data-mode="gallery">Галерея</button>
        <button class="bt" data-mode="fight">Бой</button>
        <span class="sep"></span>
        <button class="bt" data-phase="1" aria-pressed="true">Фаза 1</button>
        <button class="bt" data-phase="2">Фаза 2</button>
        <button class="bt" data-phase="3">Фаза 3</button>
      </div>

        <button class="bt" data-pose="chase" aria-pressed="true">Погоня</button>
        <button class="bt" data-pose="windup">Замах</button>
        <button class="bt" data-pose="dash">Рывок</button>
        <button class="bt" data-pose="cast">Заклинание</button>
        <button class="bt" data-pose="stunned">Оглушён</button>
        <button class="bt" data-pose="hit">Попадание</button>
      </div>
      <div class="row fight-only">

			ctx.save();
			ctx.translate(cx, cy);
			ctx.rotate(a);
			ctx.beginPath();
			ctx.moveTo(-r * .06, 0);
			ctx.arc(-r * .06, 0, rx * .9, -mouth * .92, mouth * .92);
			ctx.closePath();
			const throat = ctx.createRadialGradient(-r * .06, 0, 0, -r * .06, 0, rx * .9);
			throat.addColorStop(0, rgba(charge > 0 ? 16777215 : L.mouth1, 1));
			throat.addColorStop(charge > 0 ? .3 + .5 * (1 - charge) : 0, rgba(charge > 0 ? 16773312 : L.mouth1, 1));
			throat.addColorStop(1, rgba(L.mouth0, 1));
			ctx.fillStyle = throat;
			ctx.fill();
			if (open > .25 && charge <= 0) {
				ctx.fillStyle = rgba(L.tongue, Math.min(1, (open - .25) * 2));
				ctx.beginPath();
				ctx.ellipse(r * .18, 0, r * .2 * open, r * .11 * open, 0, 0, TAU);
				ctx.fill();
			}
			if (wB > .01) for (const side of [1, -1]) for (const u of [.55, .82]) {
				const ex = Math.cos(mouth) * rx * u;
				const ey = side * Math.sin(mouth) * rx * u;
				const len = r * .2 * wB;
				ctx.fillStyle = "#fff4e6";
				ctx.beginPath();
				ctx.moveTo(ex - r * .06, ey);
				ctx.lineTo(ex + r * .06, ey);
				ctx.lineTo(ex + r * .01, ey - side * len);
				ctx.closePath();
				ctx.fill();
			}
			ctx.restore();
			ctx.save();
			this.bodyPath(ctx, cx, cy, rx, ry, a, mouth);
			ctx.clip();
			const hl = ctx.createRadialGradient(cx - r * .38, cy - r * .45, 0, cx - r * .38, cy - r * .45, r * .45);
			hl.addColorStop(0, `rgba(255,255,255,${.55 - wB * .3})`);
			hl.addColorStop(1, "rgba(255,255,255,0)");
			ctx.fillStyle = hl;
			ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
			ctx.restore();
			this.bodyPath(ctx, cx, cy, rx, ry, a, mouth);
			ctx.lineWidth = Math.max(1, r * .05);
			ctx.strokeStyle = rgba(L.rim, .75 + wE * .25);
			if (wE > .5) ctx.globalCompositeOperation = "lighter";
			ctx.stroke();
			ctx.globalCompositeOperation = "source-over";
			if (wB > .01) for (let k = 0; k < 4; k += 1) {
				const u = (t * 1.2 + k / 4) % 1;
				const px = cx + Math.sin(k * 2.1 + t) * r * .3;
				const py = cy - r * (.7 + u * .55);
				ctx.fillStyle = `rgba(200,180,170,${.25 * (1 - u) * wB})`;
				ctx.beginPath();
				ctx.arc(px, py, r * (.1 + u * .18), 0, TAU);
				ctx.fill();
			}
			if (charge > 0) {
				ctx.globalCompositeOperation = "lighter";
				for (let k = 0; k < 8; k += 1) {
					const u = (t * 2.2 + k / 8) % 1;
					const ang = a + (k - 3.5) * .18;
					const d = r * 1.25 * (1 - u);
					glow(ctx, cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, r * .14, 16777215, .8 * u * charge);
				}
				ctx.globalCompositeOperation = "source-over";
			}
			if (this.flash > 0) {
				ctx.globalCompositeOperation = "lighter";
				glow(ctx, cx, cy, r * (.9 + (1 - this.flash) * .35), this.flashColor, .8 * this.flash);
				ctx.globalCompositeOperation = "source-over";
			}
			ctx.globalAlpha = 1;
		}
		/** Classic death, made alive: a shiver, then the mouth opens until nothing is left, a pop. */
		drawDeath(ctx, cx, cy, S, L) {
			const t = this.dyingTime;
			const r = S * .42;
			if (t < .35) {
				const jitter = Math.sin(t * 90) * r * .04;
				const g = ctx.createRadialGradient(cx - r * .3, cy - r * .38, r * .05, cx, cy, r);
				g.addColorStop(0, rgba(L.skin0, 1));
				g.addColorStop(1, rgba(L.skin2, 1));
				this.bodyPath(ctx, cx + jitter, cy, r * (1 + .06 * Math.sin(t * 60)), r, -Math.PI / 2, .15);
				ctx.fillStyle = g;
				ctx.fill();
				ctx.strokeStyle = rgba(L.rim, .9);
				ctx.lineWidth = Math.max(1, r * .06);
				ctx.stroke();
				return;
			}
			const u = Math.min(1, (t - .35) / 1.1);
			if (u < 1) {
				const mouth = .15 + Math.pow(u, 1.6) * (Math.PI - .15);
				const g = ctx.createRadialGradient(cx - r * .3, cy - r * .38, r * .05, cx, cy, r);
				g.addColorStop(0, rgba(L.skin0, 1));
				g.addColorStop(1, rgba(L.skin2, 1));
				ctx.fillStyle = g;
				ctx.beginPath();
				ctx.moveTo(cx, cy);
				ctx.arc(cx, cy, r * (1 - u * .15), -Math.PI / 2 + mouth, -Math.PI / 2 + TAU - mouth);
				ctx.closePath();
				ctx.fill();
				ctx.strokeStyle = rgba(L.rim, .9);
				ctx.lineWidth = Math.max(1, r * .06);
				ctx.stroke();
				return;
			}
			const p = Math.min(1, (t - 1.45) / .35);
			if (p < 1) {
				ctx.globalCompositeOperation = "lighter";
				for (let i = 0; i < 8; i += 1) {
					const ang = i / 8 * TAU;
					const d = r * (.2 + p * .9);
					glow(ctx, cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, r * .18 * (1 - p), L.glow, 1 - p);
				}
				ctx.globalCompositeOperation = "source-over";
			}
		}
	};
	//#endregion
	//#region prototypes/pacman/hell/main.ts
	var $ = (id) => document.getElementById(id);
	var view = $("view");
	var ctx = view.getContext("2d");
	var D = Math.min(window.devicePixelRatio || 1, 2);
	var mode = "gallery";
	var phase = 1;
	var pose = "chase";
	var vw = 0;
	var vh = 0;
	var world = new DoomWorld(GRID_DOOM, [
		{
			x: 4,
			y: 7
		},
		{
			x: 18,
			y: 7
		},
		{
			x: 20,
			y: 7
		}
	]);
	var bossView = new HellBlinkyView();
	var echoView = new HellBlinkyView();
	var combat = new DoomCombatView();
	var fx = new DoomFxView();
	var playerView = new PlayerView();
	function poseState(p) {
		switch (p) {
			case "windup": return {
				state: "TELEGRAPH",
				shape: "normal",
				progress: .7
			};
			case "dash": return {
				state: "ACTIVE",
				shape: "wedge",
				progress: 1
			};
			case "cast": return {
				state: "ACTIVE",
				shape: "cast",
				progress: 1
			};
			case "stunned": return {
				state: "STUNNED",
				shape: "stunned",
				progress: 0
			};
			default: return {
				state: "CHASE",
				shape: "normal",
				progress: 0
			};
		}
	}
	function snapshot(x, y, ph, p, dir, time, echo = false) {
		const s = poseState(p);
		return {
			x,
			y,
			phase: ph,
			state: s.state,
			shape: s.shape,
			dir,
			progress: p === "windup" ? time * .8 % 1 : s.progress,
			alpha: 1,
			intro: 1,
			look: Math.PI / 2,
			hit: p === "hit" ? Math.max(0, 1 - time * 2 % 1 * 3) : 0,
			echo
		};
	}
	/** Back and forth between two tiles of one row; returns tile-center x and the heading. */
	function patrol(x0, x1, speed, time, offset = 0) {
		const span = x1 - x0;
		const u = (time * speed / span + offset) % 2;
		const forward = u < 1;
		return {
			x: x0 + .5 + span * (forward ? u : 2 - u),
			dir: forward ? "RIGHT" : "LEFT"
		};
	}
	var at = (cx, cy, tile) => ({
		tileSize: tile,
		offsetX: cx - tile / 2,
		offsetY: cy - tile / 2
	});
	function drawFist(c, x, y, tile, time) {
		const sprite = pickupSprite("berserk");
		const u = tile / 24;
		const glow = 60.8 / 3 * u;
		c.save();
		c.translate(x, y);
		c.scale(1 + .05 * Math.sin(time * 2.6), 1 + .05 * Math.sin(time * 2.6));
		c.globalCompositeOperation = "lighter";
		c.globalAlpha = .7;
		c.drawImage(glowTexture(sprite.glow), -glow / 2, -glow / 2, glow, glow);
		c.globalCompositeOperation = "source-over";
		c.globalAlpha = 1;
		c.rotate(Math.sin(time * 2) * .1);
		c.drawImage(sprite.icon, -13 * u, -13 * u, 26 * u, 26 * u);
		c.restore();
	}
	function drawPickupIcon(c, kind, x, y, tile) {
		const u = tile / 24;
		const sprite = pickupSprite(kind);
		const glow = 60.8 / 3 * u;
		c.save();
		c.globalCompositeOperation = "lighter";
		c.globalAlpha = .7;
		c.drawImage(glowTexture(sprite.glow), x - glow / 2, y - glow / 2, glow, glow);
		c.globalCompositeOperation = "source-over";
		c.globalAlpha = 1;
		c.drawImage(sprite.icon, x - 13 * u, y - 13 * u, 26 * u, 26 * u);
		c.restore();
	}
	function gallery(time) {
		world.setMood(phase >= 2, phase >= 3);
		world.drawWorld(ctx);
		world.drawMood(ctx, []);
		const L = world.layout;
		const S = L.tileSize;
		const speed = pose === "dash" ? 8 : pose === "chase" ? 3 : 0;
		const walk = patrol(6, 16, speed || 1e-4, time);
		const bx = speed ? walk.x : 11.5;
		bossView.draw(ctx, snapshot(bx, 5.5, phase, pose, speed ? walk.dir : "DOWN", time), L, time);
		if (phase >= 3) {
			const e = patrol(2, 22, 5, time, .5);
			echoView.draw(ctx, snapshot(e.x, 23.5, 3, "chase", e.dir, time, true), L, time);
		}
		const kinds = [
			"pinky",
			"inky",
			"clyde"
		];
		kinds.forEach((kind, i) => {
			const m = patrol(2, 11, 4, time, i * .6);
			const px = L.offsetX + m.x * S;
			const py = L.offsetY + (17.5 + (i === 2 ? 0 : 0)) * S;
			if (i < 2) drawImp(ctx, kind, px, py + (i === 1 ? 4 * S : 0), S, m.dir, time, 1);
			else {
				const v = patrol(12, 21, 4, time, .3);
				drawImp(ctx, kind, L.offsetX + v.x * S, L.offsetY + 17.5 * S, S, v.dir, time, 1);
			}
		});
		drawFist(ctx, L.offsetX + 4.5 * S, L.offsetY + 7.5 * S, S, time);
		drawPickupIcon(ctx, "medkit", L.offsetX + 18.5 * S, L.offsetY + 7.5 * S, S);
		drawPickupIcon(ctx, "bfg", L.offsetX + 20.5 * S, L.offsetY + 7.5 * S, S);
		world.drawOverlay(ctx);
		const srcW = 21 * S;
		const srcH = 5 * S;
		const boxW = Math.min(vw - 32, srcW * 4, vh * .36 / srcH * srcW);
		const boxH = boxW / srcW * srcH;
		const px = (vw - boxW) / 2;
		const py = vh - boxH - 96;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.drawImage(view, (L.offsetX + 2 * S) * D, (L.offsetY + 4 * S) * D, srcW * D, srcH * D, px * D, py * D, boxW * D, boxH * D);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.strokeStyle = "rgba(255,200,170,.85)";
		ctx.lineWidth = 2;
		ctx.strokeRect(px, py, boxW, boxH);
		const items = [
			...[
				1,
				2,
				3
			].map((ph) => ({
				name: `phase ${ph}`,
				draw: (cx, cy, t) => bossView.draw(ctx, snapshot(.5, .5, ph, pose, "RIGHT", time), at(cx, cy, t), time)
			})),
			{
				name: "echo",
				draw: (cx, cy, t) => echoView.draw(ctx, snapshot(.5, .5, 3, pose, "LEFT", time, true), at(cx, cy, t), time)
			},
			...kinds.map((kind, i) => ({
				name: kind,
				draw: (cx, cy, t) => drawImp(ctx, kind, cx, cy, t, [
					"UP",
					"LEFT",
					"DOWN"
				][i], time, 1)
			})),
			{
				name: "berserk",
				draw: (cx, cy, t) => drawFist(ctx, cx, cy, t, time)
			}
		];
		const cell = Math.min(140, (vw - 32) / items.length);
		const stripW = cell * items.length;
		const sx = (vw - stripW) / 2;
		const sy = 12;
		ctx.fillStyle = "#0a0606";
		ctx.fillRect(sx, sy, stripW, cell + 20);
		items.forEach((item, i) => {
			const cx = sx + cell * (i + .5);
			const cy = sy + cell / 2 + 2;
			ctx.strokeStyle = "rgba(255,255,255,.08)";
			ctx.strokeRect(cx - cell * .36, cy - cell * .36, cell * .72, cell * .72);
			item.draw(cx, cy, cell * .72);
			ctx.fillStyle = "rgba(230,200,190,.75)";
			ctx.font = "11px \"Courier New\", monospace";
			ctx.textAlign = "center";
			ctx.fillText(item.name.toUpperCase(), cx, sy + cell + 12);
		});
	}
	var fight = null;
	var god = false;
	var held = [];
	function newFight() {
		const grid = new GridService(new GridModel(GRID_DOOM));
		grid.setLairOpen(true);
		const events = new EventBus();
		const player = new PlayerService(grid, new LevelProgress(grid, new ScoreModel(), events), events);
		const spawn = grid.bossSpawn();
		if (!spawn) throw new Error("no boss spawn");
		const boss = new DoomBossService(grid, spawn);
		const doom = new DoomAbilityService(grid, boss);
		doom.setGodMode(god);
		fx.reset();
		playerView.reset();
		return {
			grid,
			player,
			boss,
			doom,
			hits: 0
		};
	}
	function stepFight(f, dt) {
		const want = held[held.length - 1];
		if (want) f.player.setDesiredDirection(want);
		f.player.update(dt);
		const hpBefore = f.doom.playerHp;
		f.boss.update(dt, f.player);
		f.doom.update(dt, f.player);
		if (f.doom.playerHp < hpBefore) f.hits += 1;
		if (f.doom.consumePlayerDeath()) {
			const hits = f.hits;
			fight = newFight();
			fight.hits = hits;
		}
	}
	function drawFight(f, dt, time) {
		const { boss, doom, grid, player } = f;
		world.setMood(boss.phase >= 2, boss.phase >= 3);
		for (const event of doom.consumeFx()) fx.spawn(event);
		fx.update(dt, doom.shots, doom.barrelList);
		world.drawWorld(ctx);
		const lights = [{
			x: player.position.x,
			y: player.position.y,
			r: 6.5,
			tint: 16769712,
			a: 1
		}, {
			x: boss.position.x,
			y: boss.position.y,
			r: 3.2,
			tint: 16726570,
			a: .85
		}];
		world.drawMood(ctx, lights);
		const L = world.layout;
		fx.drawGround(ctx, L);
		if (!boss.defeated) combat.drawGround(ctx, boss, doom, grid, L, time);
		if (!boss.defeated) {
			const rs = boss.renderState;
			const look = (at) => Math.atan2(player.position.y - at.y, player.position.x - at.x);
			const echo = boss.echo;
			const echoPos = boss.echoPosition();
			if (echo && echoPos) echoView.draw(ctx, {
				x: echoPos.x,
				y: echoPos.y,
				phase: boss.phase,
				state: boss.state,
				shape: rs.shape,
				dir: rs.dir,
				progress: rs.progress,
				alpha: Math.max(0, Math.min(1, echo.presence)),
				intro: boss.introProgress,
				look: look(echoPos),
				hit: 0,
				echo: true
			}, L, time);
			bossView.draw(ctx, {
				x: boss.position.x,
				y: boss.position.y,
				phase: boss.phase,
				state: boss.state,
				shape: rs.shape,
				dir: rs.dir,
				progress: rs.progress,
				alpha: rs.alpha,
				intro: boss.introProgress,
				look: look(boss.position),
				hit: 0,
				echo: false
			}, L, time);
			combat.drawAir(ctx, boss, L, time);
			combat.drawPull(ctx, boss, player.position, L, time);
		}
		playerView.draw(ctx, player, L, time, {
			look: doom.berserkActive ? "berserk" : "normal",
			charge: doom.bfgChargeProgress,
			dying: false
		});
		fx.draw(ctx, L, doom.shots, doom.tracerList);
		world.drawFx(ctx);
		world.drawOverlay(ctx);
		fx.drawHurt(ctx, vw, vh);
		$("status").textContent = `HP ${doom.playerHp}  ·  hits taken ${f.hits}  ·  boss ${Math.ceil(boss.hp)}  ·  phase ${boss.phase}  ·  ${boss.state.toLowerCase()}`;
	}
	function layout() {
		vw = window.innerWidth;
		vh = window.innerHeight;
		view.width = Math.round(vw * D);
		view.height = Math.round(vh * D);
		view.style.width = `${vw}px`;
		view.style.height = `${vh}px`;
		world.resize(vw, vh, D);
	}
	function press(group, value) {
		for (const b of document.querySelectorAll(`[data-${group}]`)) b.setAttribute("aria-pressed", String(b.dataset[group] === value));
	}
	function setMode(next) {
		mode = next;
		press("mode", next);
		document.body.dataset.mode = next;
		if (next === "fight" && !fight) fight = newFight();
	}
	for (const b of document.querySelectorAll("[data-mode]")) b.addEventListener("click", () => setMode(b.dataset.mode));
	for (const b of document.querySelectorAll("[data-phase]")) b.addEventListener("click", () => {
		phase = Number(b.dataset.phase);
		press("phase", b.dataset.phase);
		if (mode === "fight" && fight) fight.boss.debugSetPhase(phase);
	});
	for (const b of document.querySelectorAll("[data-pose]")) b.addEventListener("click", () => {
		pose = b.dataset.pose;
		press("pose", pose);
	});
	for (const b of document.querySelectorAll("[data-attack]")) b.addEventListener("click", () => fight?.boss.debugForceAttack(b.dataset.attack));
	$("god").addEventListener("click", () => {
		god = !god;
		$("god").setAttribute("aria-pressed", String(god));
		fight?.doom.setGodMode(god);
	});
	$("restart").addEventListener("click", () => {
		fight = newFight();
	});
	var KEYS = {
		ArrowUp: "UP",
		ArrowDown: "DOWN",
		ArrowLeft: "LEFT",
		ArrowRight: "RIGHT",
		KeyW: "UP",
		KeyS: "DOWN",
		KeyA: "LEFT",
		KeyD: "RIGHT"
	};
	window.addEventListener("keydown", (e) => {
		const dir = KEYS[e.code];
		if (dir) {
			e.preventDefault();
			if (!held.includes(dir)) held.push(dir);
		} else if ((e.code === "KeyF" || e.code === "ShiftLeft") && fight) fight.doom.fire(fight.player);
	});
	window.addEventListener("keyup", (e) => {
		const dir = KEYS[e.code];
		const i = dir ? held.indexOf(dir) : -1;
		if (i >= 0) held.splice(i, 1);
	});
	window.addEventListener("blur", () => held.length = 0);
	var time = 0;
	var last = performance.now();
	function frame(now) {
		const dt = Math.min(.05, (now - last) / 1e3);
		last = now;
		time += dt;
		world.update(dt);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.globalAlpha = 1;
		ctx.globalCompositeOperation = "source-over";
		ctx.fillStyle = "#000";
		ctx.fillRect(0, 0, vw, vh);
		if (mode === "fight" && fight) {
			stepFight(fight, dt);
			drawFight(fight, dt, time);
		} else gallery(time);
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	setMode("gallery");
	requestAnimationFrame(frame);
	//#endregion
})();
