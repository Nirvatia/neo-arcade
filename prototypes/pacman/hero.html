	var rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
	var RibbonTrail = class {
		points = [];
		reset() {
			this.points = [];
		}
		/** The newest point first; a jump longer than `jump` (a teleport) restarts the trail. */
		push(x, y, step, maxLength, jump) {
			const head = this.points[0];
			if (head && Math.hypot(head.x - x, head.y - y) > jump) this.points = [];
			const fixed = this.points[1];
			if (this.points.length === 0) this.points.push({
				x,
				y
			});
			else if (!fixed || Math.hypot(fixed.x - x, fixed.y - y) >= step) this.points.unshift({
				x,
				y
			});
			else {
				this.points[0].x = x;
				this.points[0].y = y;
			}
			let len = 0;
			for (let i = 1; i < this.points.length; i++) {
				len += Math.hypot(this.points[i].x - this.points[i - 1].x, this.points[i].y - this.points[i - 1].y);

					this.points.length = i + 1;
					break;
				}

		/** Shrinks the trail towards the head (standing still, it draws in). */
		shrink(amount) {
			while (this.points.length > 1 && amount > 0) {
				const n = this.points.length;
				const a = this.points[n - 2];
				const b = this.points[n - 1];
				const len = Math.hypot(b.x - a.x, b.y - a.y);
				if (len <= amount) {
					this.points.pop();
					amount -= len;
				} else {
					const k = amount / len;
					b.x += (a.x - b.x) * k;
					b.y += (a.y - b.y) * k;
					amount = 0;
				}
			}

			let len = 0;
			for (let i = 1; i < this.points.length; i++) len += Math.hypot(this.points[i].x - this.points[i - 1].x, this.points[i].y - this.points[i - 1].y);

			if (n < 2 || alpha <= 0) return;

				const right = [];

					if (i > 0) acc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
					const a = pts[Math.max(0, i - 1)];
					const b = pts[Math.min(n - 1, i + 1)];

					let dy = b.y - a.y;

					dy /= len;

					const cy = pts[i].y + dx * side;

						x: cx - dy * w,
						y: cy + dx * w
					});
					right.push({
						x: cx + dy * w,
						y: cy - dx * w

					const p = right[i];
					const q = right[i - 1];
					ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
				}
				ctx.lineTo(right[0].x, right[0].y);
				ctx.closePath();
				ctx.fill();
			}

		a[1] + (b[1] - a[1]) * k,
		a[2] + (b[2] - a[2]) * k

			y: -.83 / n

		velocity = 0;

	};
	/** Brush texture: a few hundred short soft strokes, light and dark, made once. */
	var brush = null;
	function brushTexture() {
		if (brush) return brush;
		const c = document.createElement("canvas");
		c.width = c.height = 256;
		const x = c.getContext("2d");
		let seed = 7;
		const rnd = () => {
			seed = seed * 16807 % 2147483647;
			return seed / 2147483647;
		};

		for (let i = 0; i < 260; i++) {
			const px = rnd() * 256;
			const py = rnd() * 256;
			const a = -.6 + (rnd() - .5) * .5;
			const len = 18 + rnd() * 36;
			x.strokeStyle = rnd() < .5 ? `rgba(255,255,255,${.25 + rnd() * .3})` : `rgba(0,0,0,${.2 + rnd() * .25})`;

			x.moveTo(px, py);

		return c;
	}
	var glowCache = /* @__PURE__ */ new Map();
	function glow(c) {
		const key = c.join(",");
		let g = glowCache.get(key);
		if (!g) {
			g = document.createElement("canvas");
			g.width = g.height = 64;
			const x = g.getContext("2d");
			const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
			gr.addColorStop(0, css(c, 1));
			gr.addColorStop(.3, css(c, .5));
			gr.addColorStop(1, css(c, 0));

			x.fillRect(0, 0, 64, 64);

	}
	/** The painted disc spans ±DISC_SPAN body radii (room for the ink-free soft edge). */
	var DISC_SPAN = 1.15;
	var LIGHT_STEPS = 32;
	var POWER_STEPS = 6;
	var discCache = /* @__PURE__ */ new Map();
	/**
	* The body's painting (base, crisp shadow shape, deep shadow, bounce, brush texture, rim
	* light, highlight) for a body radius in device px, the light's angle in his frame and the
	* look, cached by quantised light and look: drawn once, reused every frame.
	*/
	function paintedDisc(design, deviceR, lightAngle, power) {
		const R = Math.max(4, Math.round(deviceR));
		const step = Math.round((lightAngle / (Math.PI * 2) % 1 + 1) * LIGHT_STEPS) % LIGHT_STEPS;
		const look = Math.round(clamp01(power) * POWER_STEPS);

		let c = discCache.get(key);
		if (c) return c;
		if (discCache.size > 600) discCache.clear();

		const lx = Math.cos(a);
		const ly = Math.sin(a);

		const p = look / POWER_STEPS;

		c.width = c.height = Math.ceil(R * DISC_SPAN * 2);
		const ctx = c.getContext("2d");
		ctx.translate(c.width / 2, c.height / 2);
		ctx.beginPath();
		ctx.arc(0, 0, R, 0, Math.PI * 2);

		base.addColorStop(0, css(pal.light));
		base.addColorStop(.45, css(pal.mid));
		base.addColorStop(1, css(mix(pal.mid, pal.shadow, .6)));

		ctx.rect(-R * 1.3, -R * 1.3, R * 2.6, R * 2.6);

		deep.addColorStop(1, css(pal.deep, 0));

		ctx.arc(R * .09, 0, R * 1, 0, Math.PI * 2);

		ctx.fill("evenodd");
		ctx.globalCompositeOperation = "source-over";

		const hy = ly * R * .52;
		ctx.fillStyle = css(pal.highlight, .95);
		ctx.beginPath();
		ctx.ellipse(hx, hy, R * .25, R * .12, a + Math.PI / 2, 0, Math.PI * 2);
		ctx.fill();
		ctx.beginPath();
		ctx.arc(hx + lx * R * .2 - ly * R * .18, hy + ly * R * .2 + lx * R * .18, R * .05, 0, Math.PI * 2);

	}
	/** Death: a hit (0..0.3), the dying move (to 1.3), then a burst of particles and a flare. */
	var DEATH_OPEN = .3;
	var DEATH_POP = 1.3;
	var CHARGE = .18;
	var Hero = class {
		r = 20;
		x = 0;
		y = 0;
		angle = 0;
		flip = 1;
		lastH = 1;
		moving = false;
		time = 0;
		/** The awoken look, 0..1. */
		power = 0;
		powerOn = false;
		ending = false;
		/** Seconds since the energizer was taken (the wind-up and burst), or -1. */
		transform = -1;
		/** Seconds into the death, or -1. */
		dying = -1;
		invulnerable = false;
		chomp = 0;
		bite = -1;
		snap = -1;
		nextSnap = 2.4;
		snaps = 0;

			ctx.arc(bx + TILE * (i + .5), iy, TILE * .1, 0, Math.PI * 2);
			ctx.fill();
		}
		small.draw(ctx);
		ctx.restore();
		ctx.strokeStyle = "rgba(255,255,255,.8)";
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.roundRect(bx, by, w, h, 10);
		ctx.stroke();
		ctx.fillStyle = "rgba(220,220,235,.7)";
		ctx.font = "11px \"Courier New\", monospace";
		ctx.textAlign = "center";
		ctx.fillText("В РАЗМЕРЕ ТАЙЛА", ix, by - 8);
	}
	window.addEventListener("resize", layout);
	layout();
	$("who").textContent = ms ? "Ms. Pac-Man" : "Pac-Man";
	if (new URLSearchParams(location.search).has("capture")) window.__advance = (seconds) => {
		for (let i = 0; i < Math.round(seconds * 60); i++) frame(1 / 60);
	};
	else {
		let last = performance.now();
		const loop = (now) => {
			frame(Math.min(.1, Math.max(0, (now - last) / 1e3)));
			last = now;
			requestAnimationFrame(loop);
		};
		requestAnimationFrame(loop);
	}
	//#endregion
})();

    </script>
