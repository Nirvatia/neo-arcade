		ctx.setTransform(D, 0, 0, D, 0, 0);
		if (tl < SEASON_TURN_TOTAL) drawPac(tl, time);
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	setT(-1);
	window.turn = {
		play: () => $("bp").click(),
		seek: (t) => {
			playing = false;
			setT(t);
		},
		season: (s) => {
			from = s;
			buildWorlds();
		}
	};
	requestAnimationFrame(frame);
	//#endregion
})();

    </script>
  </body>
