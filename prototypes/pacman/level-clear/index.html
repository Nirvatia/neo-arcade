<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Уровень пройден · смена сезона</title>
    <!-- Prototype for stage 4: the level-complete animation. Built from the game's own
         sources (prototypes/pacman/level-clear/main.ts, `node build.mjs`); open as a file. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#1a1a14}
      #view{position:fixed;inset:0;display:block;cursor:crosshair}
      .ui{font:700 14px "Trebuchet MS","Segoe UI",system-ui,sans-serif}
      #note{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;font:600 12px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a3020;background:rgba(255,250,235,.75);padding:5px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
      #dock{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;width:calc(100vw - 32px);max-width:820px}
      #tl{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:rgba(255,250,235,.8);box-shadow:0 4px 12px rgba(40,30,10,.2);color:#4a3a20;width:min(460px,100%);box-sizing:border-box}
      #tl input{flex:1;accent-color:#c47a1a}
      #tt{min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
      #ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
      .bt{border:0;cursor:pointer;padding:9px 15px;border-radius:999px;color:#5a3a14;background:linear-gradient(#fffaf0,#f3e2bc);box-shadow:0 3px 0 #c9a76a,0 8px 14px rgba(40,30,10,.22)}
      .bt[aria-pressed="true"]{transform:translateY(2px);color:#fff8e6;background:linear-gradient(#e0a040,#b8701e);box-shadow:0 1px 0 #7a4a10,0 0 14px rgba(255,190,90,.7)}
      .bt.go{color:#fff;background:linear-gradient(#f0b040,#d07818);box-shadow:0 3px 0 #8a4a10,0 8px 14px rgba(40,30,10,.3)}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="note">клик по коридору — где съедена последняя точка</div>
    <div id="dock" class="ui">
      <div id="tl"><input id="ts" type="range" min="0" max="1000" value="0" aria-label="время" /><span id="tt">—</span></div>
      <div id="ctl">
        <button class="bt go" id="bp">★ Уровень пройден</button>
        <button class="bt" id="br">↺ Сброс</button>
        <button class="bt" data-season="summer">Лето</button>
        <button class="bt" data-season="autumn">Осень</button>
        <button class="bt" data-season="winter">Зима</button>
        <button class="bt" data-season="spring">Весна</button>
        <button class="bt" id="bv">1×</button>
      </div>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
