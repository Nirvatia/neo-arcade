			ctx.fillStyle = rgba(ROSE_INNER, this.buffed ? .15 : .08);
			ctx.beginPath();
			ctx.arc(cx, cy, auraR, 0, TAU);
			ctx.fill();
			ctx.fillStyle = rgba(this.buffed ? GOLD_ACCENT : ROSE_INNER, .1);
			ctx.beginPath();
			ctx.arc(cx, cy, auraR * .75, 0, TAU);
			ctx.fill();
			ctx.globalCompositeOperation = "source-over";
		}
		/** A pie slice in the sprite frame: the mouth opens around angle 0. */
		wedge(ctx, r, mouth) {
			ctx.beginPath();
			ctx.moveTo(0, 0);
			ctx.arc(0, 0, r, mouth, TAU - mouth, false);
			ctx.closePath();
		}
		drawBody(ctx, r, mouth) {
			const k = r / 24;
			ctx.globalCompositeOperation = "source-over";
			for (let i = 5; i >= 0; i--) {
				const frac = i / 5;
				ctx.fillStyle = rgba(mixHex(ROSE_EDGE, ROSE_CORE, frac), .95);
				this.wedge(ctx, r * (1 - frac * .12), mouth);
				ctx.fill();
			}
			ctx.strokeStyle = rgba(this.buffed ? GOLD_ACCENT : ROSE_INNER, this.buffed ? .7 : .6);
			ctx.lineWidth = (this.buffed ? 7 : 5) * k;
			ctx.lineJoin = "miter";
			this.wedge(ctx, r, mouth);
			ctx.stroke();
			const sa = mouth;
			const ea = TAU - mouth;
			const segments = 48;
			ctx.lineWidth = (this.buffed ? 3 : 2.5) * k;
			ctx.lineCap = "butt";
			for (let i = 0; i < segments; i++) {
				const a1 = sa + (ea - sa) / segments * i;
				const a2 = sa + (ea - sa) / segments * (i + 1);
				const doppler = .5 + .5 * Math.cos((a1 + a2) / 2);
				const brightness = .5 + doppler * .5;
				ctx.strokeStyle = rgba(255 << 16 | Math.round(80 + doppler * 120) << 8 | Math.round(140 + doppler * 60), brightness * (this.buffed ? 1 : .9));
				ctx.beginPath();
				ctx.arc(0, 0, r, a1, a2, false);
				ctx.stroke();
			}
		}
		drawMouthGlow(ctx, r, mouth) {
			const k = r / 24;
			const mouthSize = mouth * 2;
			if (mouthSize < .05) return;
			let alpha = Math.min(1, mouthSize / .6) * (this.buffed ? .5 : .35);
			if (!this.moving && !this.buffed) alpha *= .8 + .2 * Math.sin(this.time * 3);
			ctx.globalCompositeOperation = "lighter";
			ctx.fillStyle = rgba(this.buffed ? MOUTH_BUFFED : MOUTH_GLOW, alpha);
			this.wedge(ctx, r * .85, mouth);
			ctx.fill();
			const ringR = r * .48;
			const span = Math.PI * .55;
			ctx.strokeStyle = rgba(this.buffed ? GOLD_BRIGHT : RIBBON_GLOW, alpha * 1.8);
			ctx.lineWidth = (this.buffed ? 1.5 : 1.2) * k;
			ctx.lineCap = "round";
			ctx.beginPath();
			ctx.arc(0, 0, ringR, Math.PI - span / 2, Math.PI + span / 2, false);
			ctx.stroke();
			if (mouthSize > .2) {
				ctx.fillStyle = rgba(FLARE_WHITE, alpha * 1.4);
				ctx.beginPath();
				ctx.arc(0, 0, r * .05, 0, TAU);
				ctx.fill();
			}
			ctx.globalCompositeOperation = "source-over";
		}
		drawBow(ctx, r) {
			const k = r / 24;
			const t = this.time;
			const bowX = Math.cos(BOW_ANGLE) * r * .9;
			const bowY = Math.sin(BOW_ANGLE) * r * .9;
			const wiggle = Math.sin(t * 5) * .1;
			const scale = BOW_SIZE * (this.buffed ? 1.15 : 1);
			const pulse = 1 + Math.sin(t * 4) * .05;
			ctx.globalCompositeOperation = "lighter";
			for (const side of [-1, 1]) {
				const petalAngle = BOW_ANGLE + side * (.7 + wiggle);
				const len = r * .9 * scale * pulse;
				const wid = r * .55 * scale * pulse;
				const tipX = bowX + Math.cos(petalAngle) * len;
				const tipY = bowY + Math.sin(petalAngle) * len;
				const perp = petalAngle + Math.PI / 2;
				const midX = bowX + Math.cos(petalAngle) * len * .5;
				const midY = bowY + Math.sin(petalAngle) * len * .5;
				const c1x = midX + Math.cos(perp) * wid * side;
				const c1y = midY + Math.sin(perp) * wid * side;
				const c2x = midX - Math.cos(perp) * wid * side * .3;
				const c2y = midY - Math.sin(perp) * wid * side * .3;
				const petal = () => {
					ctx.beginPath();
					ctx.moveTo(bowX, bowY);
					ctx.quadraticCurveTo(c1x, c1y, tipX, tipY);
					ctx.quadraticCurveTo(c2x, c2y, bowX, bowY);
					ctx.closePath();
				};
				ctx.strokeStyle = rgba(this.buffed ? GOLD_BRIGHT : RIBBON_GLOW, .4);
				ctx.lineWidth = 8 * k;
				ctx.lineJoin = "miter";
				petal();
				ctx.stroke();
				ctx.fillStyle = rgba(this.buffed ? GOLD_ACCENT : RIBBON_BASE, .85);
				petal();
				ctx.fill();
				ctx.strokeStyle = rgba(FLARE_WHITE, .7);
				ctx.lineWidth = 1.5 * k;
				ctx.lineCap = "round";
				ctx.beginPath();
				ctx.moveTo(bowX, bowY);
				ctx.quadraticCurveTo(c1x * .95 + bowX * .05, c1y * .95 + bowY * .05, tipX, tipY);
				ctx.stroke();
			}
			ctx.fillStyle = rgba(this.buffed ? GOLD_BRIGHT : RIBBON_BASE, .95);
			ctx.beginPath();
			ctx.arc(bowX, bowY, r * .25 * scale * pulse, 0, TAU);
			ctx.fill();
			ctx.fillStyle = rgba(FLARE_WHITE, .8);
			ctx.beginPath();
			ctx.arc(bowX, bowY, r * .15 * scale * pulse, 0, TAU);
			ctx.fill();
			if (this.buffed) for (let i = 0; i < 5; i++) {
				const a = BOW_ANGLE + i / 5 * TAU + t * 3;
				const d = r * 1.3;
				this.star(ctx, bowX + Math.cos(a) * d, bowY + Math.sin(a) * d, r * .12, 1.5 * k, .9);
			}
			ctx.globalCompositeOperation = "source-over";
		}
		/** The bow's four-ray star (additive, drawn by the caller's blend mode). */
		star(ctx, x, y, size, width, alpha) {
			ctx.strokeStyle = rgba(GOLD_BRIGHT, alpha);
			ctx.lineWidth = width;
			ctx.lineCap = "round";
			ctx.beginPath();
			for (let i = 0; i < 4; i++) {
				const a = i / 4 * TAU;
				ctx.moveTo(x, y);
				ctx.lineTo(x + Math.cos(a) * size, y + Math.sin(a) * size);
			}
			ctx.stroke();
			ctx.fillStyle = rgba(FLARE_WHITE, alpha);
			ctx.beginPath();
			ctx.arc(x, y, size * .3, 0, TAU);
			ctx.fill();
		}
		heart(ctx, cx, cy, size, alpha) {
			const s = size * .8;
			ctx.fillStyle = rgba(HEART_GLOW, alpha * .8);
			ctx.beginPath();
			ctx.moveTo(cx, cy + s * .3);
			ctx.bezierCurveTo(cx, cy - s * .3, cx - s, cy - s * .3, cx - s, cy + s * .1);
			ctx.bezierCurveTo(cx - s, cy + s * .6, cx, cy + s, cx, cy + s);
			ctx.bezierCurveTo(cx, cy + s, cx + s, cy + s * .6, cx + s, cy + s * .1);
			ctx.bezierCurveTo(cx + s, cy - s * .3, cx, cy - s * .3, cx, cy + s * .3);
			ctx.fill();
			ctx.fillStyle = rgba(FLARE_WHITE, alpha * .7);
			ctx.beginPath();
			ctx.arc(cx - s * .3, cy - s * .1, s * .2, 0, TAU);
			ctx.fill();
		}
		dot(ctx, x, y, radius) {
			ctx.beginPath();
			ctx.arc(x, y, Math.max(0, radius), 0, TAU);
			ctx.fill();
		}
		drawParts(ctx, layout, r) {
			const S = layout.tileSize;
			const k = r / 24;
			ctx.globalCompositeOperation = "lighter";
			for (const p of this.parts) {
				if (p.life <= .01) continue;
				const a = p.life / p.max;
				const x = layout.offsetX + p.x * S;
				const y = layout.offsetY + p.y * S;
				const size = p.size * S;
				if (p.kind === "star") {
					ctx.fillStyle = rgba(GOLD_ACCENT, a * .3);
					this.dot(ctx, x, y, size * 2.5 * a);
					ctx.strokeStyle = rgba(GOLD_BRIGHT, a);
					ctx.lineWidth = k;
					ctx.lineCap = "round";
					ctx.beginPath();
					for (let i = 0; i < 4; i++) {
						const ra = p.rot + i / 4 * TAU;
						ctx.moveTo(x, y);
						ctx.lineTo(x + Math.cos(ra) * size * 1.5, y + Math.sin(ra) * size * 1.5);
					}
					ctx.stroke();
					ctx.fillStyle = rgba(FLARE_WHITE, a);
					this.dot(ctx, x, y, size * .4);
				} else if (p.kind === "heart") this.heart(ctx, x, y, size * a, a);
				else {
					const ribbon = p.kind === "ribbon";
					ctx.fillStyle = rgba(ribbon ? RIBBON_BASE : SPARKLE_BASE, a * (ribbon ? .4 : .3));
					this.dot(ctx, x, y, size * 2 * a);
					ctx.fillStyle = rgba(ribbon ? RIBBON_GLOW : SPARKLE_GLOW, a * .9);
					this.dot(ctx, x, y, size * (ribbon ? .5 : .4) * a);
				}
			}
			ctx.globalCompositeOperation = "source-over";
		}
		drawSparkles(ctx, layout, r) {
			const S = layout.tileSize;
			const k = r / 24;
			ctx.globalCompositeOperation = "lighter";
			ctx.lineCap = "round";
			ctx.lineWidth = .8 * k;
			for (const s of this.sparkles) {
				const a = s.life / s.max;
				const tw = .5 + .5 * Math.sin(s.twinkle);
				const x = layout.offsetX + s.x * S;
				const y = layout.offsetY + s.y * S;
				const sz = s.size * S * a * tw;
				for (let i = 0; i < 4; i++) {
					const ra = s.angle + i / 4 * TAU;
					ctx.strokeStyle = rgba(i % 2 === 0 ? GOLD_BRIGHT : FLARE_WHITE, a * tw);
					ctx.beginPath();
					ctx.moveTo(x, y);
					ctx.lineTo(x + Math.cos(ra) * sz * 1.2, y + Math.sin(ra) * sz * 1.2);
					ctx.stroke();
				}
				ctx.fillStyle = rgba(FLARE_WHITE, a * tw);
				this.dot(ctx, x, y, sz * .3);
			}
			ctx.globalCompositeOperation = "source-over";
		}
		drawRings(ctx, layout, r) {
			const S = layout.tileSize;
			const k = r / 24;
			const circle = (x, y, radius) => {
				ctx.beginPath();
				ctx.arc(x, y, Math.max(0, radius), 0, TAU);
				ctx.stroke();
			};
			ctx.globalCompositeOperation = "lighter";
			for (const g of this.rings) {
				const a = Math.max(0, g.life / g.max);
				const x = layout.offsetX + g.x * S;
				const y = layout.offsetY + g.y * S;
				const radius = g.radius * S;
				if (g.kind === "dot") {
					if (radius > .5 * k) {
						ctx.strokeStyle = rgba(RIBBON_GLOW, a * .9);
						ctx.lineWidth = 1.5 * a * k;
						circle(x, y, radius);
						ctx.strokeStyle = rgba(FLARE_WHITE, a * .8);
						ctx.lineWidth = .8 * a * k;
						circle(x, y, radius * .6);
					}
				} else if (g.kind === "pill") {
					ctx.strokeStyle = rgba(GOLD_BRIGHT, a * .9);
					ctx.lineWidth = 3 * a * k;
					circle(x, y, radius);
					ctx.strokeStyle = rgba(RIBBON_GLOW, a * .4);
					ctx.lineWidth = 5 * a * k;
					circle(x, y, radius * .85);
					ctx.strokeStyle = rgba(FLARE_WHITE, a * .7);
					ctx.lineWidth = 1.5 * a * k;
					circle(x, y, radius * .3);
				} else {
					const entry = g.kind === "wormhole-in";
					const progress = 1 - a;
					const ringR = entry ? radius : g.maxRadius * S;
					ctx.strokeStyle = rgba(entry ? GOLD_BRIGHT : RIBBON_GLOW, a * .8);
					ctx.lineWidth = 4 * a * k;
					circle(x, y, ringR);
					ctx.strokeStyle = rgba(FLARE_WHITE, a * .9);
					ctx.lineWidth = 2.5 * a * k;
					circle(x, y, ringR * .65);
					const baseTwist = Math.PI * 1.8;
					const twist = entry ? progress * baseTwist * (.8 + .4 * Math.sin(progress * 10)) : (1 - progress) * baseTwist;
					for (let s = 0; s < 12; s++) {
						const base = s / 12 * TAU + g.rot;
						const ia = base + twist;
						const oa = base - twist * .5;
						const inner = ringR * .15 * a;
						const outer = ringR * (.9 + a * .1);
						ctx.strokeStyle = rgba(s % 3 === 0 ? GOLD_BRIGHT : RIBBON_GLOW, a * .7);
						ctx.lineWidth = (s % 3 === 0 ? 1.8 : .8) * a * k;
						ctx.beginPath();
						ctx.moveTo(x + Math.cos(ia) * inner, y + Math.sin(ia) * inner);
						ctx.lineTo(x + Math.cos(oa) * outer, y + Math.sin(oa) * outer);
						ctx.stroke();
					}
				}
			}
			ctx.globalCompositeOperation = "source-over";
		}
		drawGhostStreak(ctx, layout, cx, cy, r) {
			const k = r / 24;
			ctx.globalCompositeOperation = "lighter";
			if (this.streak) {
				const S = layout.tileSize;
				const progress = 1 - this.streak.t / GHOST_STREAK_TIME;
				const sx = layout.offsetX + this.streak.x * S;
				const sy = layout.offsetY + this.streak.y * S;
				const t = Math.min(1, progress * 2.5);
				const ex = sx + (cx - sx) * t;
				const ey = sy + (cy - sy) * t;
				const a = 1 - progress;
				ctx.lineCap = "round";
				ctx.strokeStyle = rgba(GHOST_STREAK, a * .4);
				ctx.lineWidth = 3.5 * a * k;
				ctx.beginPath();
				ctx.moveTo(sx, sy);
				ctx.lineTo(ex, ey);
				ctx.stroke();
				ctx.strokeStyle = rgba(FLARE_WHITE, a * .8);
				ctx.lineWidth = 1.2 * a * k;
				ctx.beginPath();
				ctx.moveTo(sx, sy);
				ctx.lineTo(ex, ey);
				ctx.stroke();
			}
			if (this.terminalFlash > 0) {
				const fa = this.terminalFlash / .15;
				const flashR = r * (.5 + fa * 1.5);
				ctx.fillStyle = rgba(FLARE_WHITE, fa * .7);
				this.dot(ctx, cx, cy, flashR);
				ctx.fillStyle = rgba(GHOST_STREAK, fa * .3);
				this.dot(ctx, cx, cy, flashR * 1.6);
			}
			ctx.globalCompositeOperation = "source-over";
		}
		drawFlash(ctx, cx, cy, r) {
			const f = this.flash;
			if (!f) return;
			const a = f.t / f.max;
			const k = r / 24;
			const circle = (radius) => {
				ctx.beginPath();
				ctx.arc(cx, cy, radius, 0, TAU);
				ctx.stroke();
			};
			ctx.globalCompositeOperation = "lighter";
			if (f.kind === "ghost") {
				ctx.strokeStyle = rgba(FLARE_WHITE, a * .7);
				ctx.lineWidth = 3.5 * a * k;
				circle(r);
				ctx.strokeStyle = rgba(GOLD_ACCENT, a * .35);
				ctx.lineWidth = 6 * a * k;
				circle(r + 8 * k);
			} else if (f.kind === "pill") {
				ctx.strokeStyle = rgba(GOLD_BRIGHT, a * .9);
				ctx.lineWidth = 2.5 * a * k;
				circle(r);
			} else {
				ctx.fillStyle = rgba(FLARE_WHITE, a * .3);
				this.dot(ctx, cx, cy, r * .25);
			}
			ctx.globalCompositeOperation = "source-over";
		}
		emitDeath(dt) {
			const t = this.dyingTime;
			const p = this.last;
			if (!p || t < .3 || t >= 1.8) return;
			const shrink = Math.min(1, (t - .3) / 1.5);
			this.deathEmit += dt;
			const interval = .06 - shrink * .04;
			while (this.deathEmit > interval) {
				this.deathEmit -= interval;
				const n = 3 + Math.floor(shrink * 5);
				for (let i = 0; i < n; i++) {
					const a = Math.random() * TAU;
					const v = (80 + Math.random() * 200) * PX;
					const kind = Math.random() < .3 ? "heart" : Math.random() < .5 ? "star" : "sparkle";
					this.part({
						kind,
						x: p.x + Math.cos(a) * R * .3,
						y: p.y + Math.sin(a) * R * .3,
						vx: Math.cos(a) * v,
						vy: Math.sin(a) * v,
						life: .5 + Math.random() * .8,
						max: 1.3,
						size: (1 + Math.random() * 3) * PX,
						rot: Math.random() * TAU,
						spin: (Math.random() - .5) * 10
					});
				}
			}
		}
		/** Convulse, shrink into a shower of hearts and stars, pop, flash. */
		drawDeath(ctx, cx, cy, r0) {
			const t = this.dyingTime;
			const shrink = Math.min(1, Math.max(0, (t - .3) / 1.5));
			const r = t < .3 ? r0 * (1 + Math.sin(t * 50) * .12) : Math.max(0, r0 * (1 - shrink * .88));
			const k = r0 / 24;
			const alpha = t < 1.8 ? 1 : Math.max(0, 1 - (t - 1.8) / .2);
			if (r <= .3 * k || alpha <= 0) return;
			ctx.globalCompositeOperation = "source-over";
			ctx.fillStyle = rgba(ROSE_CORE, alpha);
			this.dot(ctx, cx, cy, r);
			const ring = (radius) => {
				ctx.beginPath();
				ctx.arc(cx, cy, radius, 0, TAU);
				ctx.stroke();
			};
			if (t < .3) {
				const flicker = .5 + .5 * Math.sin(t * 50);
				ctx.strokeStyle = rgba(flicker > .7 ? FLARE_WHITE : RIBBON_GLOW, (.5 + flicker * .5) * alpha);
				ctx.lineWidth = (2 + flicker * 3) * k;
				ring(r);
			} else {
				ctx.strokeStyle = rgba(shrink > .7 ? GOLD_BRIGHT : ROSE_BUFFED, (.5 + shrink * .5) * alpha);
				ctx.lineWidth = (1.5 + shrink * 1.5) * k;
				ring(r);
				ctx.strokeStyle = rgba(RIBBON_GLOW, shrink * alpha * .4);
				ctx.lineWidth = k;
				ring(r * (1.2 + shrink * 2.5));
			}
			ctx.globalCompositeOperation = "lighter";
			if (t >= 1.5 && t < 1.8) {
				const p = (t - 1.5) / .3;
				ctx.fillStyle = rgba(FLARE_WHITE, (1 - p) * .9);
				this.dot(ctx, cx, cy, r0 * .2 * (1 + p * 3));
			}
			if (t >= 1.8 && t < 1.95) {
				const f = Math.max(0, 1 - (t - 1.8) / .15);
				ctx.fillStyle = rgba(FLARE_WHITE, f * .6);
				this.dot(ctx, cx, cy, r0 * 2 * (2 - f));
			}
			ctx.globalCompositeOperation = "source-over";
		}
	};

	var $ = (id) => document.getElementById(id);

	var LOOP = [
		[13, 5],
		[22, 5],
		[22, 2],
		[13, 2]
	];
	var SPEED = 5.5;
	var season = "spring";
	var world;
	var night = false;
	var buffed = false;
	var stopped = false;

	var perimeter = (() => {
		let p = 0;
		for (let i = 0; i < LOOP.length; i++) {
			const [ax, ay] = LOOP[i];
			const [bx, by] = LOOP[(i + 1) % LOOP.length];
			p += Math.abs(bx - ax) + Math.abs(by - ay);
		}
		return p;
	})();
	/** Position (tile centres) and facing at a distance along the loop. */
	function onLoop(d) {
		let rest = (d % perimeter + perimeter) % perimeter;
		for (let i = 0; i < LOOP.length; i++) {
			const [ax, ay] = LOOP[i];
			const [bx, by] = LOOP[(i + 1) % LOOP.length];
			const len = Math.abs(bx - ax) + Math.abs(by - ay);
			if (rest <= len) {
				const u = rest / len;
				const facing = bx > ax ? "RIGHT" : bx < ax ? "LEFT" : by > ay ? "DOWN" : "UP";
				return {
					x: ax + (bx - ax) * u + .5,
					y: ay + (by - ay) * u + .5,
					facing

			}
			rest -= len;

			x: LOOP[0][0] + .5,
			y: LOOP[0][1] + .5,
			facing: "RIGHT"

	});
	$("night").addEventListener("click", () => {
		night = !night;
		toggle("night", night);
		world.setMood(night ? 1 : 0, night ? 1 : 0);
	});
	$("buff").addEventListener("click", () => {
		buffed = !buffed;
		toggle("buff", buffed);
	});
	$("stop").addEventListener("click", () => {
		stopped = !stopped;
		toggle("stop", stopped);
	});
	$("pill").addEventListener("click", () => ms.trigger("energizer"));
	$("ghost").addEventListener("click", () => ms.trigger("ghost-eaten"));
	$("tele").addEventListener("click", () => {
		along += perimeter / 2;
		ms.trigger("teleport");
	});
	$("die").addEventListener("click", () => {
		if (dyingFor < 0) dyingFor = 0;
	});
	var time = 0;
	var last = performance.now();
	var lastTile = "";
	function frame(now) {
		const dt = Math.min(.1, (now - last) / 1e3);
		last = now;
		time += dt;
		if (dyingFor >= 0) {
			dyingFor += dt;
			if (dyingFor > 2.6) {
				dyingFor = -1;
				invulnerableFor = 2;
			}
		} else if (!stopped) along += SPEED * dt;
		invulnerableFor = Math.max(0, invulnerableFor - dt);
		const p = onLoop(along);
		player.position = {
			x: p.x,
			y: p.y
		};
		player.facing = p.facing;
		player.isInvulnerable = invulnerableFor > 0;
		const tile = `${Math.floor(p.x)},${Math.floor(p.y)}`;
		if (tile !== lastTile && dyingFor < 0 && !stopped) {
			lastTile = tile;
			ms.trigger("dot");
		}
		world.update(dt);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.globalAlpha = 1;
		ctx.globalCompositeOperation = "source-over";
		world.drawWorld(ctx, () => false);
		world.drawMood(ctx);
		const L = world.layout;
		ms.draw(ctx, player, L, time, {
			look: buffed ? "energized" : "normal",
			charge: 0,
			dying: dyingFor >= 0
		});
		world.drawOverlay(ctx);
		const box = Math.min(vw * .3, vh * .42);
		const src = box / ZOOM;
		const cx = (L.offsetX + p.x * L.tileSize) * D;
		const cy = (L.offsetY + p.y * L.tileSize) * D;
		const bx = vw - box - 18;
		const by = 70;
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.imageSmoothingEnabled = true;
		ctx.drawImage(view, cx - src * D / 2, cy - src * D / 2, src * D, src * D, bx * D, by * D, box * D, box * D);
		ctx.setTransform(D, 0, 0, D, 0, 0);
		ctx.strokeStyle = "rgba(255,255,255,.9)";
		ctx.lineWidth = 2;
		ctx.strokeRect(bx, by, box, box);
		requestAnimationFrame(frame);
	}
	window.addEventListener("resize", layout);
	layout();
	window.ms = {
		buff: () => $("buff").click(),
		die: () => $("die").click(),
		stop: () => $("stop").click(),
		season: (s) => {
			season = s;
			buildWorld();
		}
	};
	requestAnimationFrame(frame);
	//#endregion
})();

    </script>
  </body>
</html>
