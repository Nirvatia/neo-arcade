<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ms. Pac-Man · Stardust Heart</title>
    <!-- Prototype: the owner's Stardust Heart Ms. Pac-Man, ported into the game
         (render/actors/MsPacmanView.ts) and shown on the real seasons. Built from the
         sources: `node prototypes/pacman/build.mjs ms-pacman`; open as a file. -->
    <style>
      html,body{height:100%;margin:0;overflow:hidden;background:#1a1a14}
      #view{position:fixed;inset:0;display:block}
      #note{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;font:600 12px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#4a1430;background:rgba(255,240,246,.82);padding:5px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
      #ctl{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:calc(100vw - 32px);max-width:860px}
      .bt{border:0;cursor:pointer;padding:9px 14px;border-radius:999px;font:700 14px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#7a1844;background:linear-gradient(#fff6fa,#ffd9e8);box-shadow:0 3px 0 #e08aac,0 8px 14px rgba(60,10,30,.22)}
      .bt[aria-pressed="true"]{transform:translateY(2px);color:#fff;background:linear-gradient(#ff5ea0,#d02a6e);box-shadow:0 1px 0 #7a0c3a,0 0 14px rgba(255,90,160,.7)}
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="note">Ms. Pac-Man · вставка справа — крупный план 4×</div>
    <div id="ctl">
      <button class="bt" data-season="summer">Лето</button>
      <button class="bt" data-season="autumn">Осень</button>
      <button class="bt" data-season="winter">Зима</button>
      <button class="bt" data-season="spring">Весна</button>
      <button class="bt" id="night" aria-pressed="false">☾ Ночь</button>
      <button class="bt" id="buff" aria-pressed="false">★ Овердрайв</button>
      <button class="bt" id="pill">Энерджайзер</button>
      <button class="bt" id="ghost">Съесть призрака</button>
      <button class="bt" id="tele">Телепорт</button>
      <button class="bt" id="stop" aria-pressed="false">■ Стоп</button>
      <button class="bt" id="die">☠ Смерть</button>
    </div>
    <script>
/*SCRIPT*/
    </script>
  </body>
</html>
