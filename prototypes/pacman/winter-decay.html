<!doctype html>

    <!-- Prototype for stage 3: the level decays around the death point.
         Art: CLAUDE_GRID_WINTER bake() verbatim; live layer ported from PIXI to Canvas2D;
         the decay is one WebGL2 post pass over the world layer (no libraries). -->
    <style>
      html,
      body {
        height: 100%;

      #hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;padding:13px 6px 9px;border-radius:12px;z-index:5;user-select:none;color:#fff4dc;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;

      .bt[aria-pressed="true"]{transform:translateY(2px);color:#e9f6ff;background:linear-gradient(#3b5b8a,#2a4570);box-shadow:0 1px 0 #1a2d4a,0 0 16px rgba(127,216,255,.75)}

      #tl{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:0 4px 12px rgba(40,55,90,.18);font:600 13px "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a4d66;width:min(420px,100%);box-sizing:border-box}

    </style>

  <body>
    <canvas id="view"></canvas>
    <div id="hud"><div class="hc"><small>ОЧКИ</small><b id="hs">0</b></div><div class="hc"><small>УРОВЕНЬ</small><b id="hl">1</b></div><div class="hc"><small>ЖИЗНИ</small><span id="hv"></span></div></div>
    <div id="note">клик по коридору — место гибели</div>
    <div id="dock">
    <div id="tl"><input id="ts" type="range" min="0" max="1000" value="0" aria-label="время распада" /><span id="tt">—</span></div>
    <div id="ctl"><button class="bt dz" id="bd">☠ Распад</button><button class="bt" id="br">↺ Сброс</button><button class="bt" id="bm">⌗ По коридорам</button><button class="bt" id="bv">1×</button><button class="bt" id="bs" aria-pressed="false">❄ Буря</button><button class="bt" id="bn" aria-pressed="false">☾ Ночь</button></div>
    </div>
    <script>
      const S =
        `ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES
ES WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL ES
ES WL EU DT DT DT DT DT DT DT DT DT WL DT DT DT DT DT DT DT DT DT EU WL ES
ES WL DT WL WL WL DT WL WL WL WL DT WL DT WL WL WL WL DT WL WL WL DT WL ES
ES WL DT WL WL WL DT WL WL WL WL DT WL DT WL WL WL WL DT WL WL WL DT WL ES
ES WL DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT WL ES
ES WL DT WL WL WL DT WL DT WL WL WL WL WL WL WL DT WL DT WL WL WL DT WL ES
ES WL DT DT DT DT DT WL DT DT DT DT WL DT DT DT DT WL DT DT DT DT DT WL ES
ES WL WL WL WL WL DT WL WL WL WL DT WL DT WL WL WL WL DT WL WL WL WL WL ES
ES ES ES ES ES WL DT WL DT DT DT DT DT DT DT DT DT WL DT WL ES ES ES ES ES
ES ES ES ES ES WL DT WL DT WL WL LE LE LE WL WL DT WL DT WL ES ES ES ES ES
ES WL WL WL WL WL DT WL DT WL LT LT LT LT LT WL DT WL DT WL WL WL WL WL ES
ES 0A DT DT DT DT DT DT DT WL BY IY LT PY CE WL DT DT DT DT DT DT DT 0A ES
ES WL WL WL WL WL DT WL DT WL LT LT LT LT LT WL DT WL DT WL WL WL WL WL ES
ES ES ES ES ES WL DT WL DT WL WL WL WL WL WL WL DT WL DT WL ES ES ES ES ES
ES ES ES ES ES WL DT WL DT DT DT DT DT DT DT DT DT WL DT WL ES ES ES ES ES
ES WL WL WL WL WL DT WL DT WL WL WL WL WL WL WL DT WL DT WL WL WL WL WL ES
ES WL DT DT DT DT DT DT DT DT DT DT WL DT DT DT DT DT DT DT DT DT DT WL ES
ES WL DT WL WL WL DT WL WL WL WL DT WL DT WL WL WL WL DT WL WL WL DT WL ES
ES WL DT DT DT WL DT DT DT DT DT DT PM DT DT DT DT DT DT WL DT DT DT WL ES
ES WL WL WL DT WL DT WL DT WL WL WL WL WL WL WL DT WL DT WL DT WL WL WL ES
ES WL DT DT DT DT DT WL DT DT DT DT WL DT DT DT DT WL DT DT DT DT DT WL ES
ES WL DT WL WL WL WL WL WL WL WL DT WL DT WL WL WL WL WL WL WL WL DT WL ES
ES WL EU DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT DT EU WL ES
ES WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL WL ES
ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES ES`
          .split("\n")
          .map((r) => r.split(" "));

      /*BAKE_START*/
      const R = S.length,
        C = S[0].length,
        T = 24,
        BG = "#c9d8e8",
        LAIR = ["LT", "BY", "IY", "PY", "CE"];
      const isW = (r, c) => !!S[r] && S[r][c] === "WL";
      const hs = (a, b) => {
        let s = (((a + 50) * 7919 + (b + 50) * 104729) % 2147483646) + 1;
        return () => (s = (s * 16807) % 2147483647) / 2147483647;
      };
      const sy = (x) =>
        (R + 4.7) * T +
        Math.sin(x / (9 * T)) * 2.5 * T +
        Math.sin(x / (3.7 * T) + 1) * 0.6 * T;
      const TY = 12.5 * T;
      const DEC = (() => {
        let s = 91;
        const FIX = [
          { k: "cabin", x: -8.5, y: 7, w: 7, h: 5, ex: 4.2 },
          { k: "cabin", x: 33.5, y: 19, w: 7, h: 5, ex: 4.2 },
          { k: "cabin", x: 23.5, y: -5, w: 6, h: 4.4, ex: 3.8 },
          { k: "pond", x: 1.5, y: -4.5, rx: 3.6, ry: 2.4, ex: 4.2 },
          { k: "snowman", x: -3.6, y: 3.2, r: 0.8, ex: 1.8 },
          { k: "snowman", x: 28.6, y: 23.5, r: 0.7, ex: 1.6 },
          { k: "lamp", x: -2, y: -2, ex: 1 },
          { k: "lamp", x: 27, y: -2, ex: 1 },
          { k: "lamp", x: -2, y: 28, ex: 1 },
          { k: "lamp", x: 27, y: 28, ex: 1 },
        ].map((o) => {
          for (const q of ["x", "y", "w", "h", "rx", "ry", "r", "ex"])
            if (o[q] !== undefined) o[q] *= T;
          return o;
        });
        FIX.push({ k: "bridge", x: 12.5 * T, y: sy(12.5 * T), ex: 2 * T });
        const g = () => (s = (s * 16807) % 2147483647) / 2147483647,
          P = FIX;
        const free = (x, y, m) =>
          !(x > -m && x < C * T + m && y > -m && y < R * T + m) &&
          Math.abs(y - sy(x)) > 3.6 * T &&
          !(Math.abs(y - TY) < 2.4 * T && (x < 0 || x > C * T));
        const add = (k, n, dist, m, f) => {
          let t = 0,
            cnt = 0;
          while (cnt < n && t++ < 6000) {
            const x = (-34 + g() * (C + 68)) * T,
              y = (-25 + g() * (R + 50)) * T;
            if (
              !free(x, y, m) ||
              P.some((q) => Math.hypot(q.x - x, q.y - y) < dist + (q.ex || 0))
            )
              continue;
            P.push({ k, x, y, ...f() });
            cnt++;
          }
        };
        add("tree", 80, 5.5 * T, 4 * T, () => ({
          r: (1.5 + g() * 0.7) * T,
          pk: g() < 0.45,
          s: (g() * 99) | 0,
        }));
        add("rock", 28, 3 * T, 3 * T, () => ({ r: (0.5 + g() * 0.4) * T }));
        add("bush", 44, 2.5 * T, 3 * T, () => ({ r: (0.6 + g() * 0.4) * T }));
        add("fl", 110, 2 * T, 2 * T, () => ({ n: 6 + ((g() * 6) | 0), c: g() }));
        return P.sort((a, c) => a.y - c.y);
      })();
      function bake(mk, x0, y0, w, h, RS) {
        const cv = mk(Math.ceil(w * RS), Math.ceil(h * RS)),
          b = cv.getContext("2d");
        b.scale(RS, RS);
        b.translate(-x0, -y0);
        const X1 = x0 + w,
          Y1 = y0 + h,
          vis = (x, y, m = 70) =>
            x > x0 - m && x < X1 + m && y > y0 - m && y < Y1 + m;
        let sd = 11;
        const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647,
          rr = (a, c) => a + rnd() * (c - a),
          pick = (a) => a[(rnd() * a.length) | 0];
        const lin = (a, c, d, e, f, g) => {
          const q = b.createLinearGradient(a, c, d, e);
          q.addColorStop(0, f);
          q.addColorStop(1, g);
          return q;
        };
        const blob = (x, y, rx, ry, col, rot) => {
          b.fillStyle = col;
          b.beginPath();
          b.ellipse(x, y, rx, ry, rot ?? rnd() * 3, 0, 7);
          b.fill();
        };
        const rp = (x, y, w2, h2, [a, c, d, e]) => {
          b.beginPath();
          b.moveTo(x + a, y);
          b.lineTo(x + w2 - c, y);
          b.arcTo(x + w2, y, x + w2, y + c, c);
          b.lineTo(x + w2, y + h2 - d);
          b.arcTo(x + w2, y + h2, x + w2 - d, y + h2, d);
          b.lineTo(x + e, y + h2);
          b.arcTo(x, y + h2, x, y + h2 - e, e);
          b.lineTo(x, y + a);
          b.arcTo(x, y, x + a, y, a);
        };
        const fl5 = (x, y, r, col, mid) => {
          for (let k = 0; k < 5; k++) {
            const a = k * 1.2566 + 0.3;
            blob(
              x + Math.cos(a) * r * 0.7,
              y + Math.sin(a) * r * 0.7,
              r * 0.6,
              r * 0.6,
              col,
              0,
            );
          }
          blob(x, y, r * 0.38, r * 0.38, mid, 0);
        };
        const sph = (x, y, r, c0, c1) => {
          const g = b.createRadialGradient(x - r * 0.35, y - r * 0.35, 0.5, x, y, r);
          g.addColorStop(0, c0);
          g.addColorStop(1, c1);
          b.fillStyle = g;
          b.beginPath();
          b.arc(x, y, r, 0, 7);
          b.fill();
        };
        /* ground: one meadow for the whole screen */
        let q = b.createRadialGradient(
          (C * T) / 2,
          (R * T) / 2,
          0,
          (C * T) / 2,
          (R * T) / 2,
          38 * T,
        );
        q.addColorStop(0, "#f2f7fc");
        q.addColorStop(1, BG);
        b.fillStyle = q;
        b.fillRect(x0, y0, w, h);
        const A = w * h;
        for (let i = 0; i < A / 50000; i++) {
          const x = x0 + rnd() * w,
            y = y0 + rnd() * h,
            r = rr(70, 130),
            g = b.createRadialGradient(x, y, 0, x, y, r),
            d = i % 2;
          g.addColorStop(
            0,
            d ? "rgba(255,255,255,.4)" : "rgba(90,120,170,.06)",
          );
          g.addColorStop(1, "rgba(0,0,0,0)");
          b.fillStyle = g;
          b.fillRect(x - r, y - r, 2 * r, 2 * r);
        }
        for (let i = 0; i < A / 1100; i++) {
          b.strokeStyle = pick([
            "#9aa888aa",
            "#b8c0a488",
            "#6f7f66aa",
            "#ffffff66",
          ]);
          const x = x0 + rnd() * w,
            y = y0 + rnd() * h;
          b.lineWidth = 1;
          b.beginPath();
          b.moveTo(x, y);
          b.lineTo(x + rr(-2, 2), y - rr(3, 7));
          b.stroke();
        }
        for (let i = 0; i < A / 8000; i++) {
          const x = x0 + rnd() * w,
            y = y0 + rnd() * h,
            L = rr(14, 40);
          b.strokeStyle = "rgba(150,175,215,.28)";
          b.lineWidth = 1.4;
          b.beginPath();
          b.moveTo(x, y);
          b.quadraticCurveTo(x + L / 2, y - rr(2, 6), x + L, y);
          b.stroke();
        }
        /* stream */
        if (Y1 > sy(x0) - 40 && y0 < sy(x0) + 60) {
          const line = () => {
            b.beginPath();
            for (let x = x0 - 20; x <= X1 + 20; x += 12)
              x === x0 - 20 ? b.moveTo(x, sy(x)) : b.lineTo(x, sy(x));
          };
          b.lineCap = b.lineJoin = "round";
          [
            [40, "rgba(70,95,130,.35)"],
            [32, "#dbe9f3"],
            [27, "#b4d6e8"],
            [13, "rgba(150,200,225,.6)"],
          ].forEach(([lw, c]) => {
            b.lineWidth = lw;
            b.strokeStyle = c;
            line();
            b.stroke();
          });
          for (let x = x0; x < X1; x += 16) {
            const y = sy(x) + rr(-9, 9);
            b.strokeStyle = "rgba(255,255,255,.4)";
            b.lineWidth = 1;
            b.beginPath();
            b.moveTo(x, y);
            b.lineTo(x + rr(6, 14), y);
            b.stroke();
          }
        }
        /* meadow life */
        DEC.forEach((o) => {
          if (!vis(o.x, o.y, 60 + (o.w || (o.rx || 0) * 2))) return;
          if (o.k === "fl") {
            const cl =
              o.c < 0.3
                ? ["#ffffff", "#e8f2fb"]
                : o.c < 0.55
                  ? ["#c9dcef", "#e8f2fb"]
                  : o.c < 0.8
                    ? ["#d9333a", "#ff6b6b"]
                    : ["#f4d4d8", "#ffffff"];
            for (let i = 0; i < o.n; i++)
              fl5(
                o.x + rr(-16, 16),
                o.y + rr(-12, 12),
                rr(2, 3),
                pick(cl),
                "#ffcf4d",
              );
          } else if (o.k === "bush") {
            blob(o.x + 3, o.y + 4, o.r, o.r * 0.7, "rgba(55,75,115,.3)", 0);
            for (let i = 0; i < 4; i++) {
              const px = o.x + rr(-0.5, 0.5) * o.r,
                py = o.y + rr(-0.4, 0.4) * o.r,
                g = b.createRadialGradient(
                  px - 2,
                  py - 2,
                  1,
                  px,
                  py,
                  o.r * 0.7,
                );
              g.addColorStop(0, "#ffffff");
              g.addColorStop(1, "#a9bfd6");
              b.fillStyle = g;
              b.beginPath();
              b.arc(px, py, o.r * 0.7, 0, 7);
              b.fill();
            }
          } else if (o.k === "pond") {
            blob(o.x + 3, o.y + 4, o.rx * 1.05, o.ry * 1.05, "rgba(55,75,115,.25)", 0);
            blob(o.x, o.y, o.rx * 1.1, o.ry * 1.12, "#f4f9fd", 0);
            b.fillStyle = lin(o.x - o.rx, o.y - o.ry, o.x + o.rx, o.y + o.ry, "#eaf6fd", "#8fc3de");
            b.beginPath();
            b.ellipse(o.x, o.y, o.rx, o.ry, 0, 0, 7);
            b.fill();
            b.strokeStyle = "rgba(60,100,140,.35)";
            b.lineWidth = 1.5;
            b.stroke();
            b.strokeStyle = "rgba(255,255,255,.8)";
            b.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
              const a = rnd() * 6.28, L = rr(0.3, 0.8);
              b.beginPath();
              b.moveTo(o.x + Math.cos(a) * o.rx * 0.1, o.y + Math.sin(a) * o.ry * 0.1);
              b.lineTo(o.x + Math.cos(a + 0.2) * o.rx * L * 0.6, o.y + Math.sin(a + 0.2) * o.ry * L);
              b.lineTo(o.x + Math.cos(a - 0.1) * o.rx * L, o.y + Math.sin(a - 0.1) * o.ry * L * 1.1);
              b.stroke();
            }
            blob(o.x - o.rx * 0.35, o.y - o.ry * 0.4, o.rx * 0.3, o.ry * 0.1, "rgba(255,255,255,.85)", -0.3);
            for (let i = 0; i < 9; i++) {
              const a = i * 0.7 + rnd() * 0.4;
              blob(o.x + Math.cos(a) * o.rx * 1.05, o.y + Math.sin(a) * o.ry * 1.07, rr(3, 5), rr(2, 3.4), "#ffffff");
            }
          } else if (o.k === "snowman") {
            blob(o.x + o.r * 0.5, o.y + o.r * 0.6, o.r * 1.15, o.r * 0.8, "rgba(55,75,115,.32)", 0);
            b.strokeStyle = "#5a4028";
            b.lineWidth = 1.6;
            b.beginPath();
            b.moveTo(o.x - o.r * 0.9, o.y - o.r * 0.1);
            b.lineTo(o.x + o.r * 0.9, o.y + o.r * 0.1);
            b.stroke();
            sph(o.x, o.y + o.r * 0.2, o.r, "#ffffff", "#b4c9de");
            sph(o.x - o.r * 0.1, o.y - o.r * 0.55, o.r * 0.62, "#ffffff", "#bfd2e4");
            b.strokeStyle = "#d9333a";
            b.lineWidth = 2.4;
            b.beginPath();
            b.arc(o.x - o.r * 0.1, o.y - o.r * 0.55, o.r * 0.58, 0.3, 2.9);
            b.stroke();
            blob(o.x - o.r * 0.1, o.y - o.r * 0.55, o.r * 0.34, o.r * 0.34, "#2b3340", 0);
            blob(o.x - o.r * 0.1, o.y - o.r * 0.58, o.r * 0.2, o.r * 0.2, "#4a5566", 0);
          } else if (o.k === "lamp") {
            blob(o.x + 2, o.y + 3, 5, 3.5, "rgba(50,70,110,.35)", 0);
            sph(o.x, o.y, 4.2, "#7b7268", "#2f2a27");
            sph(o.x, o.y, 2.6, "#fff6cf", "#ffc561");
            blob(o.x - 2.6, o.y - 3, 2.4, 1.2, "#ffffff", 0);
          } else if (o.k === "bridge") {
            const bx = o.x - 26, by = o.y - 34;
            b.fillStyle = "rgba(40,55,90,.35)";
            b.fillRect(bx + 4, by + 5, 52, 68);
            for (let yy = by, i = 0; yy < by + 68; yy += 5, i++) {
              b.fillStyle = i % 2 ? "#8c6342" : "#795634";
              b.fillRect(bx + 2, yy, 48, 4.2);
              b.fillStyle = "rgba(255,230,190,.25)";
              b.fillRect(bx + 2, yy, 48, 0.8);
            }
            b.fillStyle = "#4f3622";
            b.fillRect(bx, by, 4, 68);
            b.fillRect(bx + 48, by, 4, 68);
            [[bx - 1, by - 1], [bx + 47, by - 1], [bx - 1, by + 63], [bx + 47, by + 63]].forEach(([px, py]) => {
              b.fillStyle = "#3a281a";
              b.fillRect(px, py, 6, 6);
              blob(px + 3, py + 1, 2.8, 1.6, "#f4f9fd", 0);
            });
            blob(bx + 26, by + 20, 7, 2.6, "rgba(255,255,255,.9)", 0.2);
          } else if (o.k === "cabin") {
            const X = o.x - o.w / 2, Y = o.y - o.h / 2;
            b.fillStyle = "rgba(50,70,110,.3)";
            rp(X + 6, Y + 8, o.w, o.h, [4, 4, 4, 4]);
            b.fill();
            b.save();
            rp(X, Y, o.w, o.h, [4, 4, 4, 4]);
            b.clip();
            b.fillStyle = lin(X, Y, X, o.y, "#bb6851", "#a65240");
            b.fillRect(X, Y, o.w, o.h / 2);
            b.fillStyle = lin(X, o.y, X, Y + o.h, "#87423b", "#6a342f");
            b.fillRect(X, o.y, o.w, o.h / 2);
            b.strokeStyle = "rgba(40,20,20,.22)";

        /* =====================================================================
           DECAY — the level falls apart around the place Pac-Man died.

           1. Geodesic front. Dijkstra over the tile grid from the death tile:
              corridors cost 1, walls 5, open snow 2.4. The decay runs along
              the corridors first and soaks through the walls later. The field
              is packed into a 16-bit texture and bilinearly read in the shader;
              radial mode uses plain Euclidean distance instead.
           2. Domain warp. f = geo + 1.8·(fbm − ½) + 0.5·(noise − ½) — the front

           3. Ice shards. The world is cut into a jittered Voronoi mosaic
              (cell 12 px). Every shard reads its own decay s at its centre, then
              lifts (scale up), turns, drifts away from the epicentre and
              shrinks to nothing. The pass inverts that motion per pixel:
              q = c + R(−θ)·(p − c − Δ)/σ, accepted if q still lies in the cell.
           4. Frost runs ahead of the front: cracks along the Voronoi seams,
              icy tint and sparkles. Behind the shards, a cold abyss of
              domain-warped fbm with aurora wisps and stars.
           5. A refracting shock ring at the moment of death; the level then
              reassembles from the respawn point outward (time-reversed shards
              under a second, warm front).
           ===================================================================== */
        const MARGIN = 32;
        const decay = (() => {
          const NR = R + 2 * MARGIN,
            NC = C + 2 * MARGIN;
          const cost = (r, c) => {
            const mr = r - MARGIN,
              mc = c - MARGIN;
            if (mr < 0 || mc < 0 || mr >= R || mc >= C) return 2.4;
            const t = S[mr][mc];
            if (t === "WL") return 5;
            if (t === "ES") return 2.4;
            if (LAIR.includes(t) || t === "LE") return 1.25;
            return 1;
          };
          const dist = new Float64Array(NR * NC); // Float32 would round pushed keys and drop nodes
          let dMax = 1;
          const solve = (er, ec) => {
            dist.fill(Infinity);
            const heap = [];
            const push = (d, i) => {
              heap.push([d, i]);
              let k = heap.length - 1;
              while (k > 0) {
                const p = (k - 1) >> 1;
                if (heap[p][0] <= heap[k][0]) break;
                [heap[p], heap[k]] = [heap[k], heap[p]];
                k = p;
              }
            };
            const pop = () => {
              const top = heap[0],
                last = heap.pop();
              if (heap.length) {
                heap[0] = last;
                let k = 0;
                for (;;) {
                  const l = 2 * k + 1,
                    r2 = l + 1;
                  let m = k;
                  if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
                  if (r2 < heap.length && heap[r2][0] < heap[m][0]) m = r2;
                  if (m === k) break;
                  [heap[m], heap[k]] = [heap[k], heap[m]];
                  k = m;
                }
              }
              return top;
            };
            const src = (er + MARGIN) * NC + ec + MARGIN;
            dist[src] = 0;
            push(0, src);
            while (heap.length) {
              const [d, i] = pop();
              if (d > dist[i]) continue;
              const r = (i / NC) | 0,
                c = i % NC,
                ci = cost(r, c);
              for (let dr = -1; dr <= 1; dr++)
                for (let dc = -1; dc <= 1; dc++) {
                  if (!dr && !dc) continue;
                  const r2 = r + dr,
                    c2 = c + dc;
                  if (r2 < 0 || c2 < 0 || r2 >= NR || c2 >= NC) continue;
                  // no diagonal shortcuts through wall corners
                  if (dr && dc && (cost(r + dr, c) > 4 || cost(r, c + dc) > 4)) continue;
                  const j = r2 * NC + c2,
                    nd = d + ((ci + cost(r2, c2)) / 2) * (dr && dc ? Math.SQRT2 : 1);
                  if (nd < dist[j]) {
                    dist[j] = nd;
                    push(nd, j);
                  }

            for (const v of dist) if (v > dMax) dMax = v;
          };
          const pack = () => {
            const data = new Uint8Array(NR * NC * 4);
            for (let i = 0; i < NR * NC; i++) {

                hi = Math.floor(x);

              data[i * 4 + 1] = Math.floor((x - hi) * 255);
              data[i * 4 + 3] = 255;
            }
            return data;
          };

          const geo = (tx, ty, radial) => {
            if (radial) return Math.hypot(tx - st.ex, ty - st.ey);

              gy = ty + MARGIN - 0.5,

              cy = Math.min(NR - 1, Math.max(0, gy)),

              (d(iy + 1, ix) * (1 - fx) + d(iy + 1, ix + 1) * fx) * fy +

          /* timeline, seconds */
          const TL = { shock: 1.0, front0: 0.12, front: 2.5, hold: 0.45, rebuild: 1.7, pacDie: 0.75 };
          TL.total = TL.front0 + TL.front + TL.hold + TL.rebuild;
          const BAND = 2.2,
            RB = 1.8;
          const st = { er: 19, ec: 12, ex: 12.5, ey: 19.5, radial: false, fEnd: 40, t: -1, playing: false, speed: 1 };

          /* WebGL2 pass */
          const gl = glCv.getContext("webgl2", { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: false });
          let prog = null,
            sceneTex = null,
            distTex = null,
            U = {};
          if (gl) {
            const VS = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
            const FS = `#version 300 es
precision highp float;
uniform sampler2D uScene;
uniform sampler2D uDist;
uniform vec2 uSizePx;
uniform float uDpr;
uniform vec4 uWorld;      // world origin (css px), scale, tile size
uniform vec2 uDistSize;
uniform float uMargin;
uniform float uDMax;
uniform float uFront;     // decay front, tiles (< -50: inactive)
uniform float uRebuild;   // rebuild front, tiles (< -50: inactive)
uniform float uTime;
uniform float uShock;     // 0..1 shock ring progress (< 0: none)
uniform vec2 uEpic;       // epicentre, tile coords
uniform float uRadial;
out vec4 outColor;

const float CS = 12.0;    // shard cell, world px (half a tile)
const float BAND = ${BAND.toFixed(2)};
const float RB = ${RB.toFixed(2)};
const vec3 ICE = vec3(0.80, 0.92, 1.0);

float h21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
vec2 h22(vec2 p) { float n = h21(p); return vec2(n, h21(p + n + 17.17)); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p; a *= 0.5; }
  return s;
}
float texel(ivec2 c) { vec4 v = texelFetch(uDist, c, 0); return (floor(v.r * 255.0 + 0.5) + v.g) / 255.0 * uDMax; }
float geo(vec2 t) {
  if (uRadial > 0.5) return length(t - uEpic);
  vec2 g = t + uMargin - 0.5, mx = uDistSize - 1.0, gc = clamp(g, vec2(0.0), mx);
  float extra = length(g - gc) * 2.4;
  vec2 i = min(floor(gc), mx - 1.0), f = gc - i;
  ivec2 a = ivec2(i);
  float d00 = texel(a), d10 = texel(a + ivec2(1, 0)), d01 = texel(a + ivec2(0, 1)), d11 = texel(a + ivec2(1, 1));
  return mix(mix(d00, d10, f.x), mix(d01, d11, f.x), f.y) + extra;
}
float field(vec2 t) { return geo(t) + 1.8 * (fbm(t * 0.38 + vec2(3.1, 7.7)) - 0.5) + 0.5 * (noise(t * 1.7) - 0.5); }
// x: shard decay (0 intact .. 1 gone), y: warped distance, z: frost ahead of the front
vec3 state(vec2 t) {
  float f = field(t);
  float a = clamp((uFront - f) / BAND, 0.0, 1.0);
  float r = clamp((uRebuild - f) / RB, 0.0, 1.0);
  float frost = (uFront > -50.0) ? (1.0 - r) * clamp(1.0 - (f - uFront) / 3.2, 0.0, 1.0) : 0.0;
  return vec3(a * (1.0 - r), f, frost);
}
vec2 cellCenter(vec2 k) { return (k + 0.15 + 0.7 * h22(k)) * CS; }
vec3 vor(vec2 w) { // nearest cell id + half gap to the second nearest (seam distance)
  vec2 g = floor(w / CS), best = g;
  float d1 = 1e9, d2 = 1e9;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 k = g + vec2(x, y);
    float d = length(w - cellCenter(k));
    if (d < d1) { d2 = d1; d1 = d; best = k; } else if (d < d2) d2 = d;
  }
  return vec3(best, 0.5 * (d2 - d1));
}
vec4 scene(vec2 w) { vec2 css = w * uWorld.z + uWorld.xy; return texture(uScene, css * uDpr / uSizePx); }
vec3 abyss(vec2 t) {
  vec2 q = t * 0.22;
  float n = fbm(q + vec2(uTime * 0.03, -uTime * 0.02) + 1.5 * fbm(q * 1.7 - uTime * 0.05));
  vec3 c = mix(vec3(0.02, 0.04, 0.09), vec3(0.08, 0.17, 0.29), n);
  c += vec3(0.25, 0.62, 0.82) * pow(n, 5.0) * 1.2;
  vec2 sc = floor(t * 6.0);
  float s = step(0.996, h21(sc)) * (0.5 + 0.5 * sin(uTime * 3.0 + h21(sc + 3.3) * 40.0));

void main() {
  vec2 css = vec2(gl_FragCoord.x, uSizePx.y - gl_FragCoord.y) / uDpr;
  vec2 w = (css - uWorld.xy) / uWorld.z;
  float T = uWorld.w;
  vec2 t = w / T;

  vec2 shockOff = vec2(0.0);
  float shockGlow = 0.0;
  if (uShock >= 0.0 && uShock < 1.0) {
    float rad = (1.0 - pow(1.0 - uShock, 2.0)) * 20.0;
    float sb = exp(-pow((length(t - uEpic) - rad) / 1.2, 2.0)) * (1.0 - uShock);

  float f = here.y;

  bool gone = f < uFront - BAND - 5.0 && !(uRebuild > -50.0 && f < uRebuild + 5.0);

  } else if (gone) {

  } else {
    vec2 g = floor(w / CS);

    vec3 bestCol = vec3(0.0);

      vec2 rn = h22(k + 31.7);

      if (h <= bestH) continue;

      float frost = max(smoothstep(0.0, 0.45, s), sh.z * 0.55);
      c3 = mix(c3, c3 * 0.62 + ICE * 0.4, frost * 0.7);
      float seam = 1.0 - smoothstep(0.0, 1.4, vq.z);
      float glint = pow(max(0.0, sin(th * 5.0 + rn.y * 6.283 + uTime * 2.0)), 14.0) * mv;
      float sparkle = step(0.992, h21(floor(q * 1.3))) * frost * (0.5 + 0.5 * sin(uTime * 6.0 + rn.x * 30.0));
      c3 += ICE * (seam * (0.25 * step(0.001, s) + 0.75 * frost) + glint * 0.9 + sparkle * 0.8);
      c3 *= 1.0 + 0.25 * sin(th * 2.0 + rn.x * 3.0) * mv;
      bestCol = c3;
      bestA = 1.0 - smoothstep(0.72, 0.98, s);

  }
  float rest = clamp((uRebuild - f) / RB, 0.0, 1.0);
  float rim1 = uFront > -50.0 ? exp(-pow((f - uFront) / 0.55, 2.0)) * (1.0 - rest) : 0.0;
  float rim2 = uRebuild > -50.0 ? exp(-pow((f - uRebuild) / 0.7, 2.0)) : 0.0;

  col += vec3(0.7, 0.9, 1.0) * shockGlow * 0.35;

            const sh = (type, src) => {
              const s = gl.createShader(type);
              gl.shaderSource(s, src);
              gl.compileShader(s);
              if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
              return s;
            };
            prog = gl.createProgram();
            gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
            gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
            gl.bindAttribLocation(prog, 0, "aPos");
            gl.linkProgram(prog);
            if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
            gl.useProgram(prog);
            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
            gl.enableVertexAttribArray(0);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            for (const n of ["uScene", "uDist", "uSizePx", "uDpr", "uWorld", "uDistSize", "uMargin", "uDMax", "uFront", "uRebuild", "uTime", "uShock", "uEpic", "uRadial"])
              U[n] = gl.getUniformLocation(prog, n);
            const mkTex = (filter) => {
              const t = gl.createTexture();
              gl.bindTexture(gl.TEXTURE_2D, t);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
              gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
              return t;
            };
            sceneTex = mkTex(gl.LINEAR);
            distTex = mkTex(gl.NEAREST);
            gl.uniform1i(U.uScene, 0);
            gl.uniform1i(U.uDist, 1);
          } else $("note").textContent = "WebGL2 недоступен — распад не показать";

          const upload = () => {
            if (!gl) return;
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, distTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, NC, NR, 0, gl.RGBA, gl.UNSIGNED_BYTE, pack());
          };
          const setEpicentre = (r, c) => {
            st.er = r;
            st.ec = c;
            st.ex = c + 0.5;
            st.ey = r + 0.5;
            solve(r, c);
            upload();
            refit();
          };
          /* the front must sweep everything on screen: largest distance in view + noise + band */
          const refit = () => {
            let m = 0;
            const x0 = -wox / sc / T,
              y0 = -woy / sc / T,
              x1 = (vw - wox) / sc / T,
              y1 = (vh - woy) / sc / T;
            for (let y = y0; y <= y1 + 0.5; y += 0.5)

          const ease = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : x);
          /* fronts for timeline time t (seconds since death) */
          const fronts = (t) => {
            if (t < 0) return { front: -100, rebuild: -100, shock: -1 };
            const p = ease((t - TL.front0) / TL.front),
              front = t >= TL.front0 + TL.front ? st.fEnd + BAND + 12 : -3 + (st.fEnd + BAND + 6) * Math.pow(p, 1.6);
            const r0 = TL.front0 + TL.front + TL.hold,
              p2 = ease((t - r0) / TL.rebuild),
              rebuild = t < r0 ? -100 : t >= TL.total ? 1e4 : -3 + (st.fEnd + RB + 6) * (1 - Math.pow(1 - p2, 3));

          /* CPU decay estimate (no noise) for lights and particles */
          const amountAt = (tx, ty, fr) => {
            const f = geo(tx, ty, st.radial),
              a = Math.min(1, Math.max(0, (fr.front - f) / BAND)),
              r = Math.min(1, Math.max(0, (fr.rebuild - f) / RB));

          };
          const render = (fr, time, ox, oy) => {
            if (!gl) return false;
            gl.viewport(0, 0, glCv.width, glCv.height);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, sceneTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, worldCv);

            gl.uniform1f(U.uMargin, MARGIN);
            gl.uniform1f(U.uDMax, dMax);

          };
          return { st, TL, setEpicentre, refit, fronts, amountAt, render, geo, field: () => ({ dist, NC, NR, dMax }), get ready() { return !!gl; } };
        })();

        /* ---------- ice dust: CPU particles released where the front passes ---------- */
        const dust = [];
        const emitDust = (fr, dt) => {
          if (fr.front < -50 || fr.rebuild > -50) return;
          const x0 = -wox / sc / T,
            y0 = -woy / sc / T,
            w = vw / sc / T,
            h = vh / sc / T;
          const tries = Math.round(900 * dt);
          for (let i = 0; i < tries && dust.length < 700; i++) {
            const tx = x0 + Math.random() * w,
              ty = y0 + Math.random() * h,
              a = decay.amountAt(tx, ty, fr);
            if (a < 0.25 || a > 0.6) continue;
            let ax = tx - decay.st.ex,
              ay = ty - decay.st.ey;
            const l = Math.hypot(ax, ay) || 1;
            ax /= l;
            ay /= l;
            const sp = 0.6 + Math.random() * 1.6;
            dust.push({
              x: tx * T,
              y: ty * T,
              vx: (ax * sp + (Math.random() - 0.5) * 1.2) * T,
              vy: (ay * sp + (Math.random() - 0.5) * 1.2 - 0.6) * T,
              life: 0,
              max: 0.8 + Math.random() * 0.9,
              s: 2 + Math.random() * 4,
            });
          }
        };

        /* ---------- Pac-Man marker: the death and the respawn ---------- */
        const drawPac = (x, tl, time) => {
          const p = ctr(decay.st.er, decay.st.ec),
            TL = decay.TL,
            rr = T * 0.42;
          let mouth = 0.18 + 0.16 * Math.abs(Math.sin(time * 9)),
            scale = 1,
            a = 1;
          if (tl >= 0 && tl < TL.total) {
            if (tl < TL.pacDie) {
              const u = tl / TL.pacDie;
              mouth = 0.2 + (1 - 0.2) * u * u;
              scale = 1 - 0.25 * u;
            } else if (tl > TL.total - 0.4) {
              const u = (tl - (TL.total - 0.4)) / 0.4;
              scale = 0.3 + 0.7 * (1 - Math.pow(1 - u, 3));
              a = u;
            } else return;
          }
          x.globalCompositeOperation = "source-over";
          x.globalAlpha = a;
          x.fillStyle = "#ffd23f";
          x.beginPath();
          const m = Math.PI * mouth;
          x.moveTo(p.x, p.y);
          x.arc(p.x, p.y, rr * scale, Math.PI + m, Math.PI - m + Math.PI * 2);
          x.closePath();
          if (mouth < 0.999) x.fill();
          x.strokeStyle = "rgba(120,80,0,.45)";
          x.lineWidth = 1;
          if (mouth < 0.999) x.stroke();
          if (tl >= TL.pacDie * 0.6 && tl < TL.pacDie + 0.5) {
            const u = (tl - TL.pacDie * 0.6) / (TL.pacDie * 0.4 + 0.5);
            for (let i = 0; i < 10; i++) {
              const ang = (i / 10) * Math.PI * 2,
                d = rr * (0.4 + 1.6 * u);
              spr(x, tinted(glowT, 0xfff2b0), p.x + Math.cos(ang) * d, p.y + Math.sin(ang) * d, 9 * (1 - u), 9 * (1 - u), 1 - u, 0, "lighter");
            }
          }
          x.globalAlpha = 1;
        };

        /* ---------- controls ---------- */
        const slider = $("ts"),
          tLabel = $("tt");
        const setT = (t) => {
          decay.st.t = t;
          slider.value = Math.round((Math.max(0, t) / decay.TL.total) * 1000);
          tLabel.textContent = t < 0 ? "—" : t.toFixed(2) + " с";
        };
        $("bd").addEventListener("click", () => {
          if (!decay.ready) return;
          dust.length = 0;
          decay.st.playing = true;
          setT(0);
        });
        $("br").addEventListener("click", () => {
          decay.st.playing = false;
          dust.length = 0;
          setT(-1);
        });
        $("bm").addEventListener("click", () => {
          decay.st.radial = !decay.st.radial;

        slider.addEventListener("input", () => {
          decay.st.playing = false;
          dust.length = 0;
          setT((slider.value / 1000) * decay.TL.total);

          const c = Math.floor((e.clientX - wox) / sc / T),

          M.setTransform(D * sc, 0, 0, D * sc, D * (wox + ox), D * (woy + oy));
          if (active) emitDust(fr, dt);
          for (let i = dust.length - 1; i >= 0; i--) {
            const p = dust[i];
            p.life += dt;
            if (p.life >= p.max) {
              dust.splice(i, 1);
              continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.985;
            p.vy *= 0.985;
            const u = p.life / p.max;
            spr(M, tinted(glowT, 0xcfeaff), p.x, p.y, p.s * (1 - u * 0.5), p.s * (1 - u * 0.5), (1 - u) * 0.9, 0, "lighter");
          }
          drawPac(M, active ? tl : -1, t);

          /* screen-space atmosphere */
          M.setTransform(D, 0, 0, D, 0, 0);
          mist.forEach((f) => {
            f.x += f.v * d * (1 + 6 * stormV);
            if (f.x > vw + f.w / 2) f.x = -f.w / 2;
            spr(M, tinted(fogT, 0xdbe8f5), f.x, f.y, f.w, f.h, 0.1 + 0.22 * stormV);
          });
          {
            const W = Math.max(vw, vh) * 1.5;
            M.globalAlpha = 1;
            M.globalCompositeOperation = "lighter";
            M.drawImage(litT, 0, 0, W, W);

            p.py += p.v * d * 16;
            p.px += Math.sin(t * 0.9 + p.ph) * 0.0004;
            if (p.py > 1.03) {
              p.py = -0.03;
              p.px = Math.random();
            }
            spr(M, glowT, p.px * vw, p.py * vh, p.s, p.s, p.a);
          }
          M.globalAlpha = 1;
          M.globalCompositeOperation = "source-over";
          M.drawImage(washT, 0, 0, vw, vh);
          if (stormV > 0.002) {
            M.globalAlpha = 0.24 * stormV;
            M.fillStyle = "#e4edf6";
            M.fillRect(0, 0, vw, vh);
          }
          if (stormV > 0.02)
            for (const p of flk) {
              p.px += p.vx * d * stormV;
              p.py += p.vy * d * stormV + (p.st ? 0 : Math.sin(t * 2 + p.ph) * 0.3);
              if (p.px > vw + 30) {
                p.px = -30;
                p.py = Math.random() * vh;
              }
              if (p.py > vh + 30) {
                p.py = -30;
                p.px = Math.random() * vw;
              }
              if (p.st) spr(M, tinted(streakT, p.tint), p.px, p.py, 16 * p.s, 2 * p.s, stormV * 0.7, 0.3);
              else spr(M, glowT, p.px, p.py, (64 * p.s) / 3, (64 * p.s) / 3, stormV * 0.9);
            }
          if (nightV > 0.002) {
            M.globalAlpha = 0.55 * nightV;
            M.globalCompositeOperation = "multiply";
            M.fillStyle = "#5a6ea6";
            M.fillRect(0, 0, vw, vh);
          }
          M.globalAlpha = 1;
          M.globalCompositeOperation = "source-over";
          M.drawImage(vigT, 0, 0, vw, vh);
          if (nightV > 0.01) {
            M.setTransform(D * sc, 0, 0, D * sc, D * (wox + ox), D * (woy + oy));
            for (const g of LG) {
              const gone = active ? decay.amountAt(g.x / T, g.y / T, fr) : 0;
              const a = nightV * g.a0 * (g.fl ? 0.88 + 0.12 * Math.sin(t * 7 + g.x) : 1) * (1 - gone);
              spr(M, tinted(glowT, g.tint), g.x, g.y, 2 * g.r, 2 * g.r, a, 0, "lighter");
            }
          }
          /* death flash */
          if (tl >= 0 && tl < 0.3) {
            M.setTransform(D, 0, 0, D, 0, 0);
            M.globalCompositeOperation = "lighter";
            M.globalAlpha = 0.35 * (1 - tl / 0.3);
            M.fillStyle = "#bfe6ff";
            M.fillRect(0, 0, vw, vh);
          }
          M.globalAlpha = 1;
          M.globalCompositeOperation = "source-over";
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      })();
      /*LIVE_END*/
    </script>
