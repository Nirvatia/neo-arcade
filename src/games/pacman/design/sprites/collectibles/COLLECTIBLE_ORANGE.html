<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Orange — High Quality</title>
<style>
    body { 
        margin: 0; 
        background: #06080e; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 30px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">COSMIC ORANGE · HIGH QUALITY</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, BlurFilter } = PIXI;

function createCosmicOrange() {
    const size = 256;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // ═══════════════════════════════════════════════════════════
    // 1. AMBIENT GLOW (3 слоя, оранжевый)
    // ═══════════════════════════════════════════════════════════
    const glowLayers = [
        { r: size * 0.48, stops: [[0, "rgba(255,180,80,0.35)"], [0.5, "rgba(220,140,60,0.15)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.35, stops: [[0, "rgba(255,200,120,0.3)"], [0.5, "rgba(240,160,80,0.12)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.25, stops: [[0, "rgba(255,220,150,0.25)"], [0.5, "rgba(250,180,100,0.1)"], [1, "rgba(0,0,0,0)"]] }
    ];

    for (const layer of glowLayers) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
        for (const [offset, color] of layer.stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }

    ctx.save();
    ctx.translate(cx, cy);

    // ═══════════════════════════════════════════════════════════
    // 2. ORANGE BODY (сфера, многослойный градиент)
    // ═══════════════════════════════════════════════════════════
    const orangeR = size * 0.22;

    // Тень под фруктом
    const shadow = ctx.createRadialGradient(0, orangeR * 0.3, 0, 0, orangeR * 0.3, orangeR * 1.2);
    shadow.addColorStop(0, "rgba(120,60,20,0.4)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, orangeR * 0.3, orangeR * 1.2, 0, Math.PI * 2);
    ctx.fill();

    // Основное тело (многослойный радиальный градиент)
    const bodyGrad = ctx.createRadialGradient(
        -orangeR * 0.3, -orangeR * 0.3, 0,
        0, 0, orangeR
    );
    bodyGrad.addColorStop(0, "rgba(255,240,180,1)");
    bodyGrad.addColorStop(0.2, "rgba(255,200,120,0.98)");
    bodyGrad.addColorStop(0.5, "rgba(255,160,60,0.95)");
    bodyGrad.addColorStop(0.75, "rgba(220,120,40,0.9)");
    bodyGrad.addColorStop(1, "rgba(160,80,20,0.8)");
    
    ctx.fillStyle = bodyGrad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(255,160,60,1)";
    ctx.beginPath();
    ctx.arc(0, 0, orangeR, 0, Math.PI * 2);
    ctx.fill();

    // Внутреннее свечение (оранжевый ореол)
    const innerGlow = ctx.createRadialGradient(0, 0, orangeR * 0.6, 0, 0, orangeR);
    innerGlow.addColorStop(0, "rgba(255,180,80,0)");
    innerGlow.addColorStop(0.7, "rgba(255,140,60,0.2)");
    innerGlow.addColorStop(1, "rgba(255,120,40,0.4)");
    ctx.fillStyle = innerGlow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, orangeR, 0, Math.PI * 2);
    ctx.fill();

    // Нижний тёмный градиент (глубина)
    const bottomDark = ctx.createLinearGradient(0, 0, 0, orangeR);
    bottomDark.addColorStop(0, "rgba(0,0,0,0)");
    bottomDark.addColorStop(0.6, "rgba(80,40,10,0.15)");
    bottomDark.addColorStop(1, "rgba(60,30,5,0.35)");
    ctx.fillStyle = bottomDark;
    ctx.beginPath();
    ctx.arc(0, 0, orangeR, 0, Math.PI * 2);
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 3. SEGMENTS (линии сегментов, как у настоящего апельсина)
    // ═══════════════════════════════════════════════════════════
    const segmentCount = 8;
    for (let i = 0; i < segmentCount; i++) {
        const angle = (i / segmentCount) * Math.PI * 2;
        const x1 = Math.cos(angle) * orangeR * 0.15;
        const y1 = Math.sin(angle) * orangeR * 0.15;
        const x2 = Math.cos(angle) * orangeR * 0.85;
        const y2 = Math.sin(angle) * orangeR * 0.85;

        // Градиент линии (от центра к краю)
        const lineGrad = ctx.createLinearGradient(x1, y1, x2, y2);
        lineGrad.addColorStop(0, "rgba(255,240,200,0.4)");
        lineGrad.addColorStop(0.5, "rgba(255,200,120,0.25)");
        lineGrad.addColorStop(1, "rgba(255,160,80,0.1)");

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 4;
        ctx.shadowColor = "rgba(255,200,120,0.6)";
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    // ═══════════════════════════════════════════════════════════
    // 4. SKIN TEXTURE (мелкие точки — поры кожуры)
    // ═══════════════════════════════════════════════════════════
    for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = orangeR * 0.3 + Math.random() * orangeR * 0.6;
        const x = Math.cos(angle) * dist;
        const y = Math.sin(angle) * dist;
        const dotR = 0.5 + Math.random() * 1;

        ctx.fillStyle = `rgba(255,220,150,${0.2 + Math.random() * 0.3})`;
        ctx.shadowBlur = 2;
        ctx.shadowColor = "rgba(255,200,120,0.5)";
        ctx.beginPath();
        ctx.arc(x, y, dotR, 0, Math.PI * 2);
        ctx.fill();
    }

    // ═══════════════════════════════════════════════════════════
    // 5. HIGHLIGHTS (блики для объёма)
    // ═══════════════════════════════════════════════════════════
    
    // Главный блик (белый, яркий, сверху-слева)
    const highlight1 = ctx.createRadialGradient(
        -orangeR * 0.35, -orangeR * 0.35, 0,
        -orangeR * 0.35, -orangeR * 0.35, orangeR * 0.25
    );
    highlight1.addColorStop(0, "rgba(255,255,255,0.95)");
    highlight1.addColorStop(0.3, "rgba(255,250,230,0.6)");
    highlight1.addColorStop(0.7, "rgba(255,220,180,0.2)");
    highlight1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(-orangeR * 0.35, -orangeR * 0.35, orangeR * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // Второй блик (маленький, слабее)
    const highlight2 = ctx.createRadialGradient(
        orangeR * 0.25, orangeR * 0.15, 0,
        orangeR * 0.25, orangeR * 0.15, orangeR * 0.1
    );
    highlight2.addColorStop(0, "rgba(255,230,200,0.5)");
    highlight2.addColorStop(0.5, "rgba(255,200,150,0.2)");
    highlight2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight2;
    ctx.beginPath();
    ctx.arc(orangeR * 0.25, orangeR * 0.15, orangeR * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // Обводка (тонкая, светящаяся)
    ctx.strokeStyle = "rgba(255,200,120,0.5)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(255,180,100,0.7)";
    ctx.beginPath();
    ctx.arc(0, 0, orangeR, 0, Math.PI * 2);
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 6. STEM AND LEAF (стебель и лист сверху)
    // ═══════════════════════════════════════════════════════════
    
    // Стебель
    const stemGrad = ctx.createLinearGradient(0, -orangeR, 0, -orangeR * 1.3);
    stemGrad.addColorStop(0, "rgba(100,255,200,0.9)");
    stemGrad.addColorStop(0.5, "rgba(80,220,180,0.8)");
    stemGrad.addColorStop(1, "rgba(60,180,150,0.6)");
    
    ctx.strokeStyle = stemGrad;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "rgba(100,255,200,1)";
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, -orangeR);
    ctx.lineTo(0, -orangeR * 1.25);
    ctx.stroke();

    // Внутренняя линия стебля (яркая сердцевина)
    ctx.strokeStyle = "rgba(200,255,230,0.7)";
    ctx.lineWidth = 1.2;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -orangeR);
    ctx.lineTo(0, -orangeR * 1.25);
    ctx.stroke();

    // Лист (каплевидная форма)
    const leafGrad = ctx.createLinearGradient(0, -orangeR * 1.1, orangeR * 0.15, -orangeR * 1.2);
    leafGrad.addColorStop(0, "rgba(80,220,160,0.95)");
    leafGrad.addColorStop(0.5, "rgba(100,240,180,0.9)");
    leafGrad.addColorStop(1, "rgba(120,255,200,0.7)");
    
    ctx.fillStyle = leafGrad;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(100,255,200,0.9)";
    ctx.beginPath();
    ctx.moveTo(0, -orangeR * 1.1);
    ctx.quadraticCurveTo(orangeR * 0.12, -orangeR * 1.25, orangeR * 0.15, -orangeR * 1.15);
    ctx.quadraticCurveTo(orangeR * 0.1, -orangeR * 1.05, 0, -orangeR * 1.1);
    ctx.fill();

    // Жилка листа
    ctx.strokeStyle = "rgba(200,255,230,0.8)";
    ctx.lineWidth = 0.8;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(0, -orangeR * 1.1);
    ctx.lineTo(orangeR * 0.1, -orangeR * 1.18);
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 7. ENERGY SPARKLES (космические искры вокруг)
    // ═══════════════════════════════════════════════════════════
    const sparkles = [
        { x: size * 0.28, y: -size * 0.05, r: 2 },
        { x: -size * 0.27, y: -size * 0.08, r: 1.5 },
        { x: size * 0.25, y: size * 0.15, r: 1.8 },
        { x: -size * 0.26, y: size * 0.12, r: 1.5 },
        { x: size * 0.05, y: size * 0.28, r: 1.8 },
        { x: -size * 0.08, y: -size * 0.27, r: 1.5 }
    ];

    for (const s of sparkles) {
        // Свечение
        const sparkleGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
        sparkleGlow.addColorStop(0, "rgba(255,220,150,0.8)");
        sparkleGlow.addColorStop(0.5, "rgba(255,180,100,0.3)");
        sparkleGlow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = sparkleGlow;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fill();

        // Ядро
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.shadowBlur = 6;
        ctx.shadowColor = "rgba(255,220,150,1)";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    return Texture.from(canvas);
}

// ═══════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════
async function setup() {
    const app = new Application();
    await app.init({
        width: 400, height: 400,
        backgroundColor: 0x06080e,
        antialias: true,
    });
    document.getElementById('pixi-container').appendChild(app.canvas);

    const container = new Container();
    container.x = 200; container.y = 200;
    app.stage.addChild(container);

    const tex = createCosmicOrange();

    // Основной спрайт
    const sprite = new Sprite(tex);
    sprite.anchor.set(0.5);
    sprite.width = 240; sprite.height = 240;
    container.addChild(sprite);

    // Bloom слой 1 (мягкое свечение)
    const bloom1 = new Sprite(tex);
    bloom1.anchor.set(0.5);
    bloom1.width = 280; bloom1.height = 280;
    bloom1.alpha = 0.4;
    bloom1.blendMode = "add";
    bloom1.filters = [new BlurFilter({ strength: 12, quality: 3 })];
    container.addChild(bloom1);

    // Bloom слой 2 (широкое свечение)
    const bloom2 = new Sprite(tex);
    bloom2.anchor.set(0.5);
    bloom2.width = 340; bloom2.height = 340;
    bloom2.alpha = 0.2;
    bloom2.blendMode = "add";
    bloom2.filters = [new BlurFilter({ strength: 25, quality: 3 })];
    container.addChild(bloom2);

    let time = 0;
    app.ticker.add(() => {
        const dt = 0.016;
        time += dt;

        // Слабая пульсация (дыхание)
        const pulse = 1 + Math.sin(time * 1.5) * 0.03;
        container.scale.set(pulse);

        // Лёгкое покачивание
        container.rotation = Math.sin(time * 0.8) * 0.04;

        // Медленное мерцание bloom
        bloom1.alpha = 0.4 + Math.sin(time * 2) * 0.05;
        bloom2.alpha = 0.2 + Math.sin(time * 1.5) * 0.03;
    });
}

setup();
</script>
</body>
</html>
