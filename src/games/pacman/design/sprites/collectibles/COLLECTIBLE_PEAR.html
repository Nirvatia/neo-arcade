<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Pear — Stylized</title>
<style>
    body { 
        margin: 0; 
        background: #06080e; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 30px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">COSMIC PEAR · STYLIZED</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, BlurFilter } = PIXI;

function createCosmicPear() {
    const size = 256;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // ═══════════════════════════════════════════════════════════
    // 1. AMBIENT GLOW
    // ═══════════════════════════════════════════════════════════
    const glowLayers = [
        { r: size * 0.48, stops: [[0, "rgba(180,255,100,0.35)"], [0.5, "rgba(140,200,60,0.15)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.35, stops: [[0, "rgba(200,255,120,0.3)"], [0.5, "rgba(160,220,80,0.12)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.25, stops: [[0, "rgba(220,255,150,0.25)"], [0.5, "rgba(180,240,100,0.1)"], [1, "rgba(0,0,0,0)"]] }
    ];

    for (const layer of glowLayers) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
        for (const [offset, color] of layer.stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }

    ctx.save();
    ctx.translate(cx, cy);

    // ═══════════════════════════════════════════════════════════
    // 2. STEM (стебель)
    // ═══════════════════════════════════════════════════════════
    const stemGrad = ctx.createLinearGradient(0, -70, 0, -95);
    stemGrad.addColorStop(0, "rgba(100,255,200,0.9)");
    stemGrad.addColorStop(1, "rgba(60,180,150,0.6)");
    
    ctx.strokeStyle = stemGrad;
    ctx.lineWidth = 4;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "rgba(100,255,200,1)";
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.quadraticCurveTo(3, -82, 0, -95);
    ctx.stroke();

    ctx.strokeStyle = "rgba(200,255,230,0.7)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(0, -70);
    ctx.quadraticCurveTo(3, -82, 0, -95);
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 3. LEAF (лист)
    // ═══════════════════════════════════════════════════════════
    const leafGrad = ctx.createLinearGradient(0, -78, 20, -85);
    leafGrad.addColorStop(0, "rgba(80,220,160,0.95)");
    leafGrad.addColorStop(1, "rgba(120,255,200,0.7)");
    
    ctx.fillStyle = leafGrad;
    ctx.shadowBlur = 8;
    ctx.shadowColor = "rgba(100,255,200,0.9)";
    ctx.beginPath();
    ctx.moveTo(0, -78);
    ctx.quadraticCurveTo(16, -92, 20, -82);
    ctx.quadraticCurveTo(12, -74, 0, -78);
    ctx.fill();

    ctx.strokeStyle = "rgba(200,255,230,0.8)";
    ctx.lineWidth = 1;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(0, -78);
    ctx.lineTo(12, -84);
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 4. PEAR BODY (стилизованная форма)
    // ═══════════════════════════════════════════════════════════
    
    // Тень под грушей
    const shadow = ctx.createRadialGradient(0, 70, 0, 0, 70, 60);
    shadow.addColorStop(0, "rgba(80,100,20,0.4)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(0, 70, 60, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // Простая стилизованная форма через bezier
    function drawPearShape() {
        ctx.beginPath();
        ctx.moveTo(0, -70);
        
        // Правая сторона: узкий верх → широкое дно
        ctx.bezierCurveTo(
            25, -70,    // контрольная 1
            35, -40,    // контрольная 2
            55, 0       // конец (самая широкая точка)
        );
        
        ctx.bezierCurveTo(
            65, 30,     // контрольная 1
            50, 70,     // контрольная 2
            0, 75       // конец (дно)
        );
        
        // Левая сторона (зеркально)
        ctx.bezierCurveTo(
            -50, 70,
            -65, 30,
            -55, 0
        );
        
        ctx.bezierCurveTo(
            -35, -40,
            -25, -70,
            0, -70
        );
        
        ctx.closePath();
    }

    // Основное тело
    const bodyGrad = ctx.createRadialGradient(-15, -20, 0, 0, 20, 80);
    bodyGrad.addColorStop(0, "rgba(240,255,180,1)");
    bodyGrad.addColorStop(0.3, "rgba(200,240,120,0.98)");
    bodyGrad.addColorStop(0.6, "rgba(160,210,80,0.95)");
    bodyGrad.addColorStop(1, "rgba(100,160,50,0.9)");
    
    ctx.fillStyle = bodyGrad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(180,255,100,1)";
    drawPearShape();
    ctx.fill();

    // Внутреннее свечение
    ctx.shadowBlur = 0;
    const innerGlow = ctx.createRadialGradient(0, 0, 20, 0, 20, 75);
    innerGlow.addColorStop(0, "rgba(220,255,150,0)");
    innerGlow.addColorStop(0.7, "rgba(180,230,100,0.2)");
    innerGlow.addColorStop(1, "rgba(150,200,70,0.4)");
    ctx.fillStyle = innerGlow;
    drawPearShape();
    ctx.fill();

    // Румянец
    const blush = ctx.createRadialGradient(20, 30, 0, 20, 30, 35);
    blush.addColorStop(0, "rgba(255,250,180,0.4)");
    blush.addColorStop(0.5, "rgba(255,230,120,0.2)");
    blush.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = blush;
    drawPearShape();
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 5. HIGHLIGHTS
    // ═══════════════════════════════════════════════════════════
    
    // Большой блик
    const highlight1 = ctx.createRadialGradient(-25, -30, 0, -25, -30, 30);
    highlight1.addColorStop(0, "rgba(255,255,255,0.9)");
    highlight1.addColorStop(0.4, "rgba(255,255,230,0.5)");
    highlight1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(-25, -30, 25, 15, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Маленький блик
    const highlight2 = ctx.createRadialGradient(30, 20, 0, 30, 20, 15);
    highlight2.addColorStop(0, "rgba(255,255,240,0.6)");
    highlight2.addColorStop(0.5, "rgba(255,250,200,0.3)");
    highlight2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight2;
    ctx.beginPath();
    ctx.arc(30, 20, 15, 0, Math.PI * 2);
    ctx.fill();

    // Обводка
    ctx.strokeStyle = "rgba(220,255,150,0.6)";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(200,255,120,0.8)";
    drawPearShape();
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 6. ENERGY SPARKLES
    // ═══════════════════════════════════════════════════════════
    const sparkles = [
        { x: 70, y: -25, r: 2 },
        { x: -68, y: -30, r: 1.8 },
        { x: 62, y: 38, r: 2 },
        { x: -65, y: 45, r: 1.8 },
        { x: 12, y: 75, r: 2 },
        { x: -20, y: -70, r: 1.8 }
    ];

    for (const s of sparkles) {
        const sparkleGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
        sparkleGlow.addColorStop(0, "rgba(220,255,180,0.8)");
        sparkleGlow.addColorStop(0.5, "rgba(180,230,120,0.3)");
        sparkleGlow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = sparkleGlow;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.shadowBlur = 6;
        ctx.shadowColor = "rgba(220,255,180,1)";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    return Texture.from(canvas);
}

async function setup() {
    const app = new Application();
    await app.init({
        width: 400, height: 400,
        backgroundColor: 0x06080e,
        antialias: true,
    });
    document.getElementById('pixi-container').appendChild(app.canvas);

    const container = new Container();
    container.x = 200; container.y = 200;
    app.stage.addChild(container);

    const tex = createCosmicPear();

    const sprite = new Sprite(tex);
    sprite.anchor.set(0.5);
    sprite.width = 260; sprite.height = 260;
    container.addChild(sprite);

    const bloom1 = new Sprite(tex);
    bloom1.anchor.set(0.5);
    bloom1.width = 300; bloom1.height = 300;
    bloom1.alpha = 0.4;
    bloom1.blendMode = "add";
    bloom1.filters = [new BlurFilter({ strength: 12, quality: 3 })];
    container.addChild(bloom1);

    const bloom2 = new Sprite(tex);
    bloom2.anchor.set(0.5);
    bloom2.width = 360; bloom2.height = 360;
    bloom2.alpha = 0.2;
    bloom2.blendMode = "add";
    bloom2.filters = [new BlurFilter({ strength: 25, quality: 3 })];
    container.addChild(bloom2);

    let time = 0;
    app.ticker.add(() => {
        const dt = 0.016;
        time += dt;

        const pulse = 1 + Math.sin(time * 1.5) * 0.03;
        container.scale.set(pulse);

        container.rotation = Math.sin(time * 0.8) * 0.04;

        bloom1.alpha = 0.4 + Math.sin(time * 2) * 0.05;
        bloom2.alpha = 0.2 + Math.sin(time * 1.5) * 0.03;
    });
}

setup();
</script>
</body>
</html>
