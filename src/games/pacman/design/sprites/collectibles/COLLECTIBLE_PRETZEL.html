<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Pretzel — High Quality Sprite</title>
<style>
    body { 
        margin: 0; 
        background: #0a0e1a; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 20px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">COSMIC PRETZEL · HIGH QUALITY SPRITE</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, BlurFilter } = PIXI;

function createCosmicPretzel() {
    const size = 512;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;
    
    // Космический фон
    const bgGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.45);
    bgGlow.addColorStop(0, "rgba(230, 110, 25, 0.23)");
    bgGlow.addColorStop(0.5, "rgba(140, 30, 110, 0.07)");
    bgGlow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, size, size);
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(size / 400, size / 400);
    ctx.translate(-200, -200);
    
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    
    // Функция послойного плетения честного X-узла
    function drawPretzelKnot(ctx) {
        // ШАГ 1: Нижняя лента (Идет из левой ножки, сквозь центр, закручивается в правое ушко и уходит в нижний мостик)
        ctx.beginPath();
        ctx.moveTo(130, 300);
        ctx.lineTo(220, 120); // Честное пересечение центра по диагонали вверх-вправо
        ctx.bezierCurveTo(250, 60, 340, 110, 295, 215); // Правое ушко
        ctx.bezierCurveTo(268, 278, 132, 278, 105, 215); // Нижний мостик
        ctx.stroke();

        // ШАГ 2: Верхняя лента (Рисуется ПОВЕРХ первой, создавая перекрытие в центре как на референсе)
        ctx.beginPath();
        ctx.moveTo(105, 215); // Стартует плавно из мостика
        ctx.bezierCurveTo(60, 110, 150, 60, 180, 120);   // Левое ушко
        ctx.lineTo(270, 300);                            // Честное пересечение центра по диагонали вниз-вправо
        ctx.stroke();
    }
    
    // 1. Внешний темный контур с размытием неонового тепла
    ctx.shadowBlur = 22;
    ctx.shadowColor = "rgba(245, 85, 20, 0.6)";
    ctx.strokeStyle = "#190801";
    ctx.lineWidth = 64;
    drawPretzelKnot(ctx);
    ctx.shadowBlur = 0; // Отключаем shadowBlur для четких внутренних слоев
    
    // 2. Глубокое запеченное тесто
    ctx.strokeStyle = "#4a1600";
    ctx.lineWidth = 54;
    drawPretzelKnot(ctx);
    
    // 3. Градиентная основа корочки
    const bodyGrad = ctx.createRadialGradient(200, 200, 10, 200, 200, 160);
    bodyGrad.addColorStop(0, "#e67e22");
    bodyGrad.addColorStop(0.6, "#d35400");
    bodyGrad.addColorStop(1, "#782800");
    ctx.strokeStyle = bodyGrad;
    ctx.lineWidth = 38;
    drawPretzelKnot(ctx);
    
    // 4. Яркое неоновое свечение внутри
    ctx.strokeStyle = "#ff9f43";
    ctx.lineWidth = 18;
    drawPretzelKnot(ctx);
    
    // 5. Тонкий центральный блик (световод)
    ctx.strokeStyle = "#fff6ee";
    ctx.lineWidth = 5;
    drawPretzelKnot(ctx);

    // Кристаллы соли на своих местах
    const saltPositions = [
        {x: 82, y: 155}, {x: 112, y: 112}, {x: 155, y: 96},
        {x: 245, y: 96}, {x: 288, y: 112}, {x: 318, y: 155},
        {x: 172, y: 195}, {x: 152, y: 248}, {x: 138, y: 282}, 
        {x: 228, y: 195}, {x: 248, y: 248}, {x: 262, y: 282}, 
        {x: 200, y: 265}
    ];

    for (const salt of saltPositions) {
        ctx.save();
        ctx.translate(salt.x, salt.y);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "rgba(25, 8, 1, 0.4)";
        ctx.fillRect(-7, -5, 16, 16);
        ctx.fillStyle = "rgba(60, 255, 245, 0.85)";
        ctx.fillRect(-8, -8, 16, 16);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-4, -4, 8, 8);
        ctx.restore();
    }

    // Искры вокруг
    const sparkles = [
        {x: 200, y: 40, r: 4}, {x: 55, y: 140, r: 3},
        {x: 345, y: 140, r: 3}, {x: 95, y: 285, r: 3},
        {x: 305, y: 285, r: 5}
    ];

    for (const s of sparkles) {
        const glow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
        glow.addColorStop(0, "rgba(255, 150, 50, 0.8)");
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
    return Texture.from(canvas);
}

async function setup() {
    const app = new Application();
    await app.init({
        width: 500, 
        height: 500,
        backgroundColor: 0x0a0e1a,
        antialias: true,
    });
    document.getElementById('pixi-container').appendChild(app.canvas);

    const container = new Container();
    container.x = 250; container.y = 250;
    app.stage.addChild(container);

    const pretzelTexture = createCosmicPretzel();

    const sprite = new Sprite(pretzelTexture);
    sprite.anchor.set(0.5);
    sprite.width = 380; sprite.height = 380;
    container.addChild(sprite);

    const bloom1 = new Sprite(pretzelTexture);
    bloom1.anchor.set(0.5);
    bloom1.width = 410; bloom1.height = 410;
    bloom1.alpha = 0.5;
    bloom1.blendMode = "add";
    bloom1.filters = [new BlurFilter({ strength: 10, quality: 3 })];
    container.addChild(bloom1);

    const bloom2 = new Sprite(pretzelTexture);
    bloom2.anchor.set(0.5);
    bloom2.width = 460; bloom2.height = 460;
    bloom2.alpha = 0.25;
    bloom2.blendMode = "add";
    bloom2.filters = [new BlurFilter({ strength: 24, quality: 3 })];
    container.addChild(bloom2);

    let time = 0;
    app.ticker.add(() => {
        const dt = 0.016;
        time += dt;
        const pulse = 1 + Math.sin(time * 1.8) * 0.025;
        container.scale.set(pulse);
        container.rotation = Math.sin(time * 0.6) * 0.03;
        bloom1.alpha = 0.45 + Math.sin(time * 2.5) * 0.05;
        bloom2.alpha = 0.25 + Math.sin(time * 1.2) * 0.03;
    });
}

setup();
</script>
</body>
</html>
