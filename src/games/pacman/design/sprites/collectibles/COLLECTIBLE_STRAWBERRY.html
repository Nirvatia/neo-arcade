<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Strawberry — High Quality</title>
<style>
    body { 
        margin: 0; 
        background: #06080e; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 30px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">COSMIC STRAWBERRY · HIGH QUALITY</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, BlurFilter } = PIXI;

function createCosmicStrawberry() {
    const size = 256;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // ═══════════════════════════════════════════════════════════
    // 1. AMBIENT GLOW (3 слоя, красно-розовый)
    // ═══════════════════════════════════════════════════════════
    const glowLayers = [
        { r: size * 0.48, stops: [[0, "rgba(255,80,120,0.35)"], [0.5, "rgba(200,50,90,0.15)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.35, stops: [[0, "rgba(255,120,160,0.3)"], [0.5, "rgba(220,70,110,0.12)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.25, stops: [[0, "rgba(255,160,180,0.25)"], [0.5, "rgba(240,90,130,0.1)"], [1, "rgba(0,0,0,0)"]] }
    ];

    for (const layer of glowLayers) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
        for (const [offset, color] of layer.stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }

    ctx.save();
    ctx.translate(cx, cy);

    // ═══════════════════════════════════════════════════════════
    // 2. BERRY BODY (сердцевидная форма, многослойный градиент)
    // ═══════════════════════════════════════════════════════════
    
    // Тень под ягодой
    const shadow = ctx.createRadialGradient(0, size * 0.2, 0, 0, size * 0.2, size * 0.25);
    shadow.addColorStop(0, "rgba(80,10,30,0.4)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, size * 0.2, size * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // Основная форма ягоды (сердце/капля)
    function drawBerryShape() {
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.18);
        // Правая сторона
        ctx.bezierCurveTo(
            size * 0.22, -size * 0.22,
            size * 0.28, -size * 0.05,
            size * 0.22, size * 0.08
        );
        ctx.bezierCurveTo(
            size * 0.18, size * 0.18,
            size * 0.08, size * 0.25,
            0, size * 0.28
        );
        // Левая сторона
        ctx.bezierCurveTo(
            -size * 0.08, size * 0.25,
            -size * 0.18, size * 0.18,
            -size * 0.22, size * 0.08
        );
        ctx.bezierCurveTo(
            -size * 0.28, -size * 0.05,
            -size * 0.22, -size * 0.22,
            0, -size * 0.18
        );
        ctx.closePath();
    }

    // Основное тело (многослойный градиент)
    const bodyGrad = ctx.createRadialGradient(
        -size * 0.08, -size * 0.08, 0,
        0, size * 0.05, size * 0.3
    );
    bodyGrad.addColorStop(0, "rgba(255,160,180,1)");
    bodyGrad.addColorStop(0.25, "rgba(255,100,140,0.98)");
    bodyGrad.addColorStop(0.5, "rgba(230,50,90,0.95)");
    bodyGrad.addColorStop(0.75, "rgba(180,30,60,0.9)");
    bodyGrad.addColorStop(1, "rgba(120,15,40,0.8)");
    
    ctx.fillStyle = bodyGrad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(255,80,120,1)";
    drawBerryShape();
    ctx.fill();

    // Внутреннее свечение (красный ореол по краям)
    const innerGlow = ctx.createRadialGradient(0, 0, size * 0.1, 0, size * 0.05, size * 0.3);
    innerGlow.addColorStop(0, "rgba(255,120,160,0)");
    innerGlow.addColorStop(0.7, "rgba(255,80,120,0.25)");
    innerGlow.addColorStop(1, "rgba(255,60,100,0.45)");
    ctx.fillStyle = innerGlow;
    ctx.shadowBlur = 0;
    drawBerryShape();
    ctx.fill();

    // Нижний тёмный градиент (глубина)
    const bottomDark = ctx.createLinearGradient(0, 0, 0, size * 0.28);
    bottomDark.addColorStop(0, "rgba(0,0,0,0)");
    bottomDark.addColorStop(0.6, "rgba(60,10,30,0.15)");
    bottomDark.addColorStop(1, "rgba(40,5,20,0.4)");
    ctx.fillStyle = bottomDark;
    drawBerryShape();
    ctx.fill();

    // Главный блик (белый, яркий, сверху-слева)
    const highlight1 = ctx.createRadialGradient(
        -size * 0.1, -size * 0.1, 0,
        -size * 0.1, -size * 0.1, size * 0.12
    );
    highlight1.addColorStop(0, "rgba(255,255,255,0.95)");
    highlight1.addColorStop(0.3, "rgba(255,230,240,0.6)");
    highlight1.addColorStop(0.7, "rgba(255,180,200,0.2)");
    highlight1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight1;
    ctx.beginPath();
    ctx.arc(-size * 0.1, -size * 0.1, size * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // Второй блик (маленький, слабее)
    const highlight2 = ctx.createRadialGradient(
        size * 0.12, size * 0.1, 0,
        size * 0.12, size * 0.1, size * 0.05
    );
    highlight2.addColorStop(0, "rgba(255,200,220,0.5)");
    highlight2.addColorStop(0.5, "rgba(255,150,180,0.2)");
    highlight2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight2;
    ctx.beginPath();
    ctx.arc(size * 0.12, size * 0.1, size * 0.05, 0, Math.PI * 2);
    ctx.fill();

    // Обводка (тонкая, светящаяся)
    ctx.strokeStyle = "rgba(255,160,180,0.6)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(255,120,150,0.8)";
    drawBerryShape();
    ctx.stroke();

    // ═══════════════════════════════════════════════════════════
    // 3. SEEDS (энергетические точки, жёлто-золотые)
    // ═══════════════════════════════════════════════════════════
    const seeds = [
        { x: -size * 0.12, y: -size * 0.02, r: 2.2 },
        { x: size * 0.12, y: -size * 0.02, r: 2.2 },
        { x: -size * 0.15, y: size * 0.1, r: 2 },
        { x: size * 0.15, y: size * 0.1, r: 2 },
        { x: -size * 0.08, y: size * 0.18, r: 1.8 },
        { x: size * 0.08, y: size * 0.18, r: 1.8 },
        { x: 0, y: size * 0.08, r: 2.2 },
        { x: 0, y: size * 0.22, r: 1.5 }
    ];

    for (const seed of seeds) {
        // Внешнее свечение семени
        const seedGlow = ctx.createRadialGradient(seed.x, seed.y, 0, seed.x, seed.y, seed.r * 2.5);
        seedGlow.addColorStop(0, "rgba(255,220,100,0.6)");
        seedGlow.addColorStop(0.5, "rgba(255,180,60,0.25)");
        seedGlow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = seedGlow;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(seed.x, seed.y, seed.r * 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Ядро семени (овальное, как настоящее семя)
        const seedGrad = ctx.createRadialGradient(seed.x, seed.y - seed.r * 0.3, 0, seed.x, seed.y, seed.r);
        seedGrad.addColorStop(0, "rgba(255,255,200,1)");
        seedGrad.addColorStop(0.5, "rgba(255,200,80,0.95)");
        seedGrad.addColorStop(1, "rgba(220,150,40,0.8)");
        ctx.fillStyle = seedGrad;
        ctx.shadowBlur = 4;
        ctx.shadowColor = "rgba(255,200,80,0.9)";
        ctx.beginPath();
        ctx.ellipse(seed.x, seed.y, seed.r * 0.7, seed.r, 0, 0, Math.PI * 2);
        ctx.fill();

        // Яркая точка в центре
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(seed.x, seed.y - seed.r * 0.3, seed.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    // ═══════════════════════════════════════════════════════════
    // 4. CALYX (чашелистики сверху, бирюзово-зелёные)
    // ═══════════════════════════════════════════════════════════
    const leafCount = 5;
    const leafAngles = [
        -Math.PI / 2 - 0.6,
        -Math.PI / 2 - 0.3,
        -Math.PI / 2,
        -Math.PI / 2 + 0.3,
        -Math.PI / 2 + 0.6
    ];

    for (let i = 0; i < leafCount; i++) {
        const angle = leafAngles[i];
        const leafLength = size * 0.12 + (i % 2 === 0 ? size * 0.02 : 0);
        const leafWidth = size * 0.04;

        ctx.save();
        ctx.translate(0, -size * 0.18);
        ctx.rotate(angle + Math.PI / 2);

        // Градиент листа
        const leafGrad = ctx.createLinearGradient(0, 0, 0, -leafLength);
        leafGrad.addColorStop(0, "rgba(80,220,160,0.95)");
        leafGrad.addColorStop(0.5, "rgba(100,240,180,0.9)");
        leafGrad.addColorStop(1, "rgba(120,255,200,0.7)");

        ctx.fillStyle = leafGrad;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(100,255,200,0.9)";
        
        // Форма листа (капля)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-leafWidth, -leafLength * 0.5, 0, -leafLength);
        ctx.quadraticCurveTo(leafWidth, -leafLength * 0.5, 0, 0);
        ctx.closePath();
        ctx.fill();

        // Жилка листа (яркая)
        ctx.strokeStyle = "rgba(200,255,230,0.7)";
        ctx.lineWidth = 0.8;
        ctx.shadowBlur = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -leafLength * 0.9);
        ctx.stroke();

        ctx.restore();
    }

    // Центральный узел чашелистиков
    const nodeGrad = ctx.createRadialGradient(0, -size * 0.18, 0, 0, -size * 0.18, size * 0.04);
    nodeGrad.addColorStop(0, "rgba(200,255,230,0.9)");
    nodeGrad.addColorStop(0.5, "rgba(120,240,180,0.7)");
    nodeGrad.addColorStop(1, "rgba(80,200,150,0.4)");
    ctx.fillStyle = nodeGrad;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(100,255,200,0.8)";
    ctx.beginPath();
    ctx.arc(0, -size * 0.18, size * 0.04, 0, Math.PI * 2);
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 5. ENERGY SPARKLES (космические искры вокруг)
    // ═══════════════════════════════════════════════════════════
    const sparkles = [
        { x: size * 0.25, y: -size * 0.1, r: 2 },
        { x: -size * 0.26, y: -size * 0.05, r: 1.5 },
        { x: size * 0.22, y: size * 0.18, r: 1.8 },
        { x: -size * 0.24, y: size * 0.2, r: 1.5 },
        { x: size * 0.1, y: size * 0.32, r: 1.8 },
        { x: -size * 0.1, y: -size * 0.28, r: 1.5 }
    ];

    for (const s of sparkles) {
        // Свечение
        const sparkleGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
        sparkleGlow.addColorStop(0, "rgba(255,180,200,0.8)");
        sparkleGlow.addColorStop(0.5, "rgba(255,120,160,0.3)");
        sparkleGlow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = sparkleGlow;
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fill();

        // Ядро
        ctx.fillStyle = "rgba(255,255,255,0.95)";
        ctx.shadowBlur = 6;
        ctx.shadowColor = "rgba(255,180,200,1)";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
    return Texture.from(canvas);
}

// ═══════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════
async function setup() {
    const app = new Application();
    await app.init({
        width: 400, height: 400,
        backgroundColor: 0x06080e,
        antialias: true,
    });
    document.getElementById('pixi-container').appendChild(app.canvas);

    const container = new Container();
    container.x = 200; container.y = 200;
    app.stage.addChild(container);

    const tex = createCosmicStrawberry();

    // Основной спрайт
    const sprite = new Sprite(tex);
    sprite.anchor.set(0.5);
    sprite.width = 240; sprite.height = 240;
    container.addChild(sprite);

    // Bloom слой 1 (мягкое свечение)
    const bloom1 = new Sprite(tex);
    bloom1.anchor.set(0.5);
    bloom1.width = 280; bloom1.height = 280;
    bloom1.alpha = 0.4;
    bloom1.blendMode = "add";
    bloom1.filters = [new BlurFilter({ strength: 12, quality: 3 })];
    container.addChild(bloom1);

    // Bloom слой 2 (широкое свечение)
    const bloom2 = new Sprite(tex);
    bloom2.anchor.set(0.5);
    bloom2.width = 340; bloom2.height = 340;
    bloom2.alpha = 0.2;
    bloom2.blendMode = "add";
    bloom2.filters = [new BlurFilter({ strength: 25, quality: 3 })];
    container.addChild(bloom2);

    let time = 0;
    app.ticker.add(() => {
        const dt = 0.016;
        time += dt;

        // Слабая пульсация (дыхание)
        const pulse = 1 + Math.sin(time * 1.5) * 0.03;
        container.scale.set(pulse);

        // Лёгкое покачивание
        container.rotation = Math.sin(time * 0.8) * 0.04;

        // Медленное мерцание bloom
        bloom1.alpha = 0.4 + Math.sin(time * 2) * 0.05;
        bloom2.alpha = 0.2 + Math.sin(time * 1.5) * 0.03;
    });
}

setup();
</script>
</body>
</html>
