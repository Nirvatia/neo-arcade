<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VOID RIFT — Ultra Ghost</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #0a0a0f;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: absolute;
        top: 15px;
        left: 15px;
        color: #ff6666;
        font-size: 13px;
        background: rgba(20, 5, 10, 0.92);
        padding: 16px 20px;
        border-radius: 8px;
        border: 1px solid rgba(255, 80, 80, 0.3);
        backdrop-filter: blur(8px);
        line-height: 1.6;
        min-width: 300px;
      }
      #ui h3 {
        margin: 0 0 12px 0;
        color: #ff4444;
        font-size: 15px;
        border-bottom: 1px solid rgba(255, 80, 80, 0.2);
        padding-bottom: 8px;
        letter-spacing: 2px;
      }
      #ui label {
        display: block;
        margin: 8px 0 2px 0;
        color: #cc6666;
        font-size: 11px;
        letter-spacing: 1px;
      }
      #ui input[type="range"] {
        width: 100%;
        margin: 2px 0;
      }
      #ui .value-display {
        color: #ff8888;
        font-weight: 600;
        float: right;
        font-size: 11px;
      }
      #ui .section {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 80, 80, 0.15);
      }
      #ui .section-title {
        color: #ff6666;
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 6px;
        text-transform: uppercase;
      }
      #stats {
        position: absolute;
        bottom: 15px;
        left: 15px;
        color: #884444;
        font-size: 11px;
        font-family: monospace;
        background: rgba(20, 5, 10, 0.7);
        padding: 8px 12px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h3>🕳️ VOID RIFT</h3>

      <div class="section-title">Animation</div>
      <label>
        Chaos Speed
        <span class="value-display" id="chaosSpeedValue">2.5x</span>
      </label>
      <input
        type="range"
        id="chaosSpeed"
        min="0.2"
        max="3"
        step="0.1"
        value="2.5"
      />

      <label>
        Chaos Intensity
        <span class="value-display" id="chaosIntValue">1.2</span>
      </label>
      <input
        type="range"
        id="chaosInt"
        min="0.2"
        max="2"
        step="0.1"
        value="1.2"
      />

      <div class="section">
        <div class="section-title">Core</div>
        <label>
          Void Size
          <span class="value-display" id="voidSizeValue">50</span>
        </label>
        <input
          type="range"
          id="voidSize"
          min="30"
          max="120"
          step="2"
          value="50"
        />
      </div>

      <div class="section">
        <div class="section-title">Rift Layers</div>
        <label>
          Layer Count
          <span class="value-display" id="layerCountValue">1</span>
        </label>
        <input
          type="range"
          id="layerCount"
          min="1"
          max="6"
          step="1"
          value="1"
        />

        <label>
          Vertices per Layer
          <span class="value-display" id="vertCountValue">40</span>
        </label>
        <input
          type="range"
          id="vertCount"
          min="8"
          max="40"
          step="2"
          value="40"
        />

        <label>
          Rift Expansion
          <span class="value-display" id="riftExpValue">120</span>
        </label>
        <input
          type="range"
          id="riftExp"
          min="20"
          max="200"
          step="5"
          value="120"
        />

        <label>
          Deformation Amplitude
          <span class="value-display" id="deformAmpValue">45</span>
        </label>
        <input
          type="range"
          id="deformAmp"
          min="5"
          max="60"
          step="1"
          value="45"
        />

        <label>
          Glow Intensity
          <span class="value-display" id="glowIntValue">1.0</span>
        </label>
        <input
          type="range"
          id="glowInt"
          min="0"
          max="2"
          step="0.1"
          value="1.0"
        />
      </div>
    </div>
    <div id="stats">FPS: <span id="fps">0</span></div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
    <script type="module">
      const { Application, Container, Graphics, BlurFilter } = PIXI;

      const app = new Application();
      await app.init({
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: 0x0a0a0f,
        antialias: true,
      });
      document.body.appendChild(app.canvas);

      const CX = window.innerWidth / 2;
      const CY = window.innerHeight / 2;

      // ═══════════════════════════════════════════════════════════
      // CONFIG
      // ═══════════════════════════════════════════════════════════
      const CFG = {
        chaosSpeed: 2.5,
        chaosIntensity: 1.2,
        voidSize: 50,
        layerCount: 1,
        vertCount: 40,
        riftExpansion: 120,
        deformAmplitude: 45,
        glowIntensity: 1.0,
      };

      // ═══════════════════════════════════════════════════════════
      // VOID RIFT RENDERER
      // ═══════════════════════════════════════════════════════════
      class VoidRiftRenderer {
        constructor() {
          this.container = new Container();

          // Слои
          this.auraGfx = new Graphics();
          this.voidGfx = new Graphics();
          this.riftGlowGfx = new Graphics();
          this.riftGfx = new Graphics();
          this.riftCoreGfx = new Graphics();

          // Blend modes
          this.auraGfx.blendMode = "add";
          this.riftGlowGfx.blendMode = "add";
          this.riftCoreGfx.blendMode = "add";

          // Bloom фильтр для свечения
          const bloomFilter = new BlurFilter({ strength: 15, quality: 3 });
          this.riftGlowGfx.filters = [bloomFilter];

          // Порядок слоёв
          this.container.addChild(this.auraGfx);
          this.container.addChild(this.riftGlowGfx);
          this.container.addChild(this.riftGfx);
          this.container.addChild(this.riftCoreGfx);
          this.container.addChild(this.voidGfx);

          this.time = 0;

          // Для каждой вершины каждого слоя — свои фазы и частоты
          this.vertexPhases = [];
          this.vertexFreqs = [];
          for (let layer = 0; layer < 6; layer++) {
            const phases = [];
            const freqs = [];
            for (let v = 0; v < 40; v++) {
              phases.push(Math.random() * Math.PI * 2);
              freqs.push(0.5 + Math.random() * 2);
            }
            this.vertexPhases.push(phases);
            this.vertexFreqs.push(freqs);
          }
        }

        update(dt) {
          this.time += dt * CFG.chaosSpeed;
        }

        draw() {
          this.auraGfx.clear();
          this.voidGfx.clear();
          this.riftGlowGfx.clear();
          this.riftGfx.clear();
          this.riftCoreGfx.clear();

          const t = this.time;

          this.drawAura(t);
          this.drawRift(t);
          this.drawVoid(t);
        }

        // ═══════════════════════════════════════════════════════════
        // AURA — тёмное свечение вокруг разлома
        // ═══════════════════════════════════════════════════════════
        drawAura(t) {
          const maxR = CFG.voidSize + CFG.riftExpansion * CFG.layerCount * 0.5;

          const layers = [
            { r: maxR * 1.5, color: 0x110005, alpha: 0.15 },
            { r: maxR * 1.2, color: 0x220011, alpha: 0.2 },
            { r: maxR * 1.0, color: 0x330011, alpha: 0.15 },
          ];

          for (const layer of layers) {
            this.auraGfx
              .circle(0, 0, layer.r)
              .fill({ color: layer.color, alpha: layer.alpha });
          }
        }

        // ═══════════════════════════════════════════════════════════
        // VOID — чёрная пустота, подстраивается под многоугольник
        // ═══════════════════════════════════════════════════════════
        drawVoid(t) {
          const vertCount = CFG.vertCount;
          const points = [];

          for (let i = 0; i < vertCount; i++) {
            const baseAngle = (i / vertCount) * Math.PI * 2;

            const phase = this.vertexPhases[0][i];
            const freq = this.vertexFreqs[0][i];

            const noise =
              Math.sin(t * freq * 2 + phase) * 0.5 +
              Math.sin(t * freq * 3.7 + phase * 2.3) * 0.3 +
              Math.sin(t * freq * 1.3 + phase * 0.7) * 0.2;

            const deform =
              noise * CFG.deformAmplitude * 0.5 * CFG.chaosIntensity;
            const r = CFG.voidSize + deform;

            points.push({
              x: Math.cos(baseAngle) * r,
              y: Math.sin(baseAngle) * r,
            });
          }

          this.voidGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.voidGfx.lineTo(points[i].x, points[i].y);
          }
          this.voidGfx.closePath();
          this.voidGfx.fill({ color: 0x000000, alpha: 1.0 });
        }

        // ═══════════════════════════════════════════════════════════
        // RIFT — рваные слои вокруг пустоты
        // ═══════════════════════════════════════════════════════════
        drawRift(t) {
          for (let layer = 0; layer < CFG.layerCount; layer++) {
            const layerT = layer / CFG.layerCount;
            const baseR = CFG.voidSize + CFG.riftExpansion * (layerT + 0.2);

            const colors = [
              {
                fill: 0x440011,
                stroke: 0x880022,
                core: 0xaa1133,
                glow: 0x660022,
              },
              {
                fill: 0x550015,
                stroke: 0xaa1133,
                core: 0xcc2244,
                glow: 0x880033,
              },
              {
                fill: 0x660018,
                stroke: 0xcc2244,
                core: 0xee3355,
                glow: 0xaa0044,
              },
              {
                fill: 0x77001c,
                stroke: 0xee3355,
                core: 0xff4466,
                glow: 0xcc0055,
              },
              {
                fill: 0x880020,
                stroke: 0xff4466,
                core: 0xff6688,
                glow: 0xee0066,
              },
              {
                fill: 0x990024,
                stroke: 0xff6688,
                core: 0xff88aa,
                glow: 0xff0077,
              },
            ];
            const color = colors[layer % colors.length];

            const deformScale = 0.5 + layerT * 0.8;

            this.drawRiftLayer(layer, baseR, deformScale, t, color);
          }
        }

        drawRiftLayer(layerIdx, baseR, deformScale, t, color) {
          const vertCount = CFG.vertCount;
          const points = [];

          for (let i = 0; i < vertCount; i++) {
            const baseAngle = (i / vertCount) * Math.PI * 2;

            const phase = this.vertexPhases[layerIdx][i];
            const freq = this.vertexFreqs[layerIdx][i];

            const noise =
              Math.sin(t * freq * 2 + phase) * 0.5 +
              Math.sin(t * freq * 3.7 + phase * 2.3) * 0.3 +
              Math.sin(t * freq * 1.3 + phase * 0.7) * 0.2;

            const deform =
              noise * CFG.deformAmplitude * deformScale * CFG.chaosIntensity;
            const r = baseR + deform;

            points.push({
              x: Math.cos(baseAngle) * r,
              y: Math.sin(baseAngle) * r,
            });
          }

          // === BLOOM СВЕЧЕНИЕ (размытое, широкое) ===
          this.riftGlowGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.riftGlowGfx.lineTo(points[i].x, points[i].y);
          }
          this.riftGlowGfx.closePath();
          this.riftGlowGfx.stroke({
            color: color.glow,
            width: 20,
            alpha: 0.4 * CFG.glowIntensity,
            join: "miter",
          });

          // === ВТОРОЙ СЛОЙ СВЕЧЕНИЯ (средний) ===
          this.riftGlowGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.riftGlowGfx.lineTo(points[i].x, points[i].y);
          }
          this.riftGlowGfx.closePath();
          this.riftGlowGfx.stroke({
            color: color.stroke,
            width: 12,
            alpha: 0.5 * CFG.glowIntensity,
            join: "miter",
          });

          // === ВНЕШНЕЕ СВЕЧЕНИЕ (кроваво-алое) ===
          this.riftGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.riftGfx.lineTo(points[i].x, points[i].y);
          }
          this.riftGfx.closePath();
          this.riftGfx.stroke({
            color: color.stroke,
            width: 6,
            alpha: 0.3,
            join: "miter",
          });

          // === ОСНОВНАЯ ГРАНИЦА ===
          this.riftGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.riftGfx.lineTo(points[i].x, points[i].y);
          }
          this.riftGfx.closePath();
          this.riftGfx.stroke({
            color: color.stroke,
            width: 3,
            alpha: 0.9,
            join: "miter",
          });

          // === ЯРКАЯ СЕРДЕВИНА ГРАНИЦЫ ===
          this.riftCoreGfx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            this.riftCoreGfx.lineTo(points[i].x, points[i].y);
          }
          this.riftCoreGfx.closePath();
          this.riftCoreGfx.stroke({
            color: color.core,
            width: 1.5,
            alpha: 0.95,
            join: "miter",
          });
        }

        destroy() {
          this.container.destroy({ children: true });
        }
      }

      // ═══════════════════════════════════════════════════════════
      // SCENE SETUP
      // ═══════════════════════════════════════════════════════════
      const ultraGhost = new VoidRiftRenderer();
      ultraGhost.container.x = CX;
      ultraGhost.container.y = CY;
      app.stage.addChild(ultraGhost.container);

      // ═══════════════════════════════════════════════════════════
      // UI BINDINGS
      // ═══════════════════════════════════════════════════════════
      function bind(id, cfgKey, displayId, formatter = (v) => v) {
        const el = document.getElementById(id);
        const display = document.getElementById(displayId);
        el.addEventListener("input", (e) => {
          const val = parseFloat(e.target.value);
          CFG[cfgKey] = val;
          display.textContent = formatter(val);
        });
        display.textContent = formatter(parseFloat(el.value));
      }

      bind(
        "chaosSpeed",
        "chaosSpeed",
        "chaosSpeedValue",
        (v) => v.toFixed(1) + "x",
      );
      bind("chaosInt", "chaosIntensity", "chaosIntValue", (v) => v.toFixed(1));
      bind("voidSize", "voidSize", "voidSizeValue", (v) => v);
      bind("layerCount", "layerCount", "layerCountValue", (v) => v);
      bind("vertCount", "vertCount", "vertCountValue", (v) => v);
      bind("riftExp", "riftExpansion", "riftExpValue", (v) => v);
      bind("deformAmp", "deformAmplitude", "deformAmpValue", (v) => v);
      bind("glowInt", "glowIntensity", "glowIntValue", (v) => v.toFixed(1));

      // ═══════════════════════════════════════════════════════════
      // MAIN LOOP
      // ═══════════════════════════════════════════════════════════
      let lastTime = performance.now();
      let frameCount = 0;
      let fpsTime = 0;

      app.ticker.add((ticker) => {
        const now = performance.now();
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;

        frameCount++;
        fpsTime += dt;
        if (fpsTime >= 1) {
          document.getElementById("fps").textContent = frameCount;
          frameCount = 0;
          fpsTime = 0;
        }

        ultraGhost.update(dt);
        ultraGhost.draw();
      });

      window.addEventListener("resize", () => {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        ultraGhost.container.x = window.innerWidth / 2;
        ultraGhost.container.y = window.innerHeight / 2;
      });
    </script>
  </body>
</html>
