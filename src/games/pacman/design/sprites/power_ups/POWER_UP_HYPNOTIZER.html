<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hypnotic Pills — Full Versions (Animated)</title>
<style>
    body { 
        margin: 0; 
        background: #06080e; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 30px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    .comparison {
        display: flex;
        gap: 80px;
        padding: 20px;
    }
    .pill-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }
    .pill-label {
        font-size: 12px;
        letter-spacing: 3px;
        opacity: 0.7;
        text-align: center;
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">HYPNOTIC PILLS · FULL VERSIONS (ANIMATED)</div>
<div class="comparison" id="comparison"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Graphics, Texture, BlurFilter } = PIXI;

// ═══════════════════════════════════════════════════════════
// 1. CLASSIC HYPNO — ТЕЛО КАПСУЛЫ (статичная текстура)
// ═══════════════════════════════════════════════════════════
function createCapsuleBody() {
    const size = 256;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // Ambient glow
    const glowLayers = [
        { r: size * 0.48, stops: [[0, "rgba(255,255,255,0.35)"], [0.5, "rgba(220,220,255,0.15)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.35, stops: [[0, "rgba(255,255,255,0.3)"], [0.5, "rgba(200,200,240,0.12)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.25, stops: [[0, "rgba(255,255,255,0.25)"], [0.5, "rgba(180,180,220,0.1)"], [1, "rgba(0,0,0,0)"]] }
    ];

    for (const layer of glowLayers) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
        for (const [offset, color] of layer.stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }

    ctx.save();
    ctx.translate(cx, cy);

    const capsuleW = size * 0.28;
    const capsuleH = size * 0.4;
    const radius = capsuleW / 2;

    // Тень
    const shadow = ctx.createRadialGradient(0, capsuleH * 0.3, 0, 0, capsuleH * 0.3, capsuleW * 1.5);
    shadow.addColorStop(0, "rgba(100,100,150,0.3)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.ellipse(0, capsuleH * 0.3, capsuleW * 1.5, capsuleH * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    function drawCapsuleShape() {
        ctx.beginPath();
        ctx.moveTo(-capsuleW/2 + radius, -capsuleH/2);
        ctx.lineTo(capsuleW/2 - radius, -capsuleH/2);
        ctx.arc(capsuleW/2 - radius, -capsuleH/2 + radius, radius, -Math.PI/2, 0);
        ctx.lineTo(capsuleW/2, capsuleH/2 - radius);
        ctx.arc(capsuleW/2 - radius, capsuleH/2 - radius, radius, 0, Math.PI/2);
        ctx.lineTo(-capsuleW/2 + radius, capsuleH/2);
        ctx.arc(-capsuleW/2 + radius, capsuleH/2 - radius, radius, Math.PI/2, Math.PI);
        ctx.lineTo(-capsuleW/2, -capsuleH/2 + radius);
        ctx.arc(-capsuleW/2 + radius, -capsuleH/2 + radius, radius, Math.PI, Math.PI * 1.5);
        ctx.closePath();
    }

    // Тело капсулы
    const capsuleGrad = ctx.createRadialGradient(
        -capsuleW * 0.2, -capsuleH * 0.2, 0,
        0, 0, capsuleW * 1.2
    );
    capsuleGrad.addColorStop(0, "rgba(255,255,255,1)");
    capsuleGrad.addColorStop(0.3, "rgba(240,240,255,0.98)");
    capsuleGrad.addColorStop(0.6, "rgba(220,220,240,0.95)");
    capsuleGrad.addColorStop(0.85, "rgba(200,200,220,0.9)");
    capsuleGrad.addColorStop(1, "rgba(180,180,200,0.8)");
    
    ctx.fillStyle = capsuleGrad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    drawCapsuleShape();
    ctx.fill();

    // Внутреннее свечение
    const innerGlow = ctx.createRadialGradient(0, 0, capsuleW * 0.3, 0, 0, capsuleW * 1.1);
    innerGlow.addColorStop(0, "rgba(255,255,255,0)");
    innerGlow.addColorStop(0.7, "rgba(240,240,255,0.15)");
    innerGlow.addColorStop(1, "rgba(220,220,240,0.3)");
    ctx.fillStyle = innerGlow;
    ctx.shadowBlur = 0;
    drawCapsuleShape();
    ctx.fill();

    // Обводка
    ctx.strokeStyle = "rgba(200,200,220,0.6)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(255,255,255,0.8)";
    drawCapsuleShape();
    ctx.stroke();

    // Блики
    const highlight1 = ctx.createRadialGradient(
        -capsuleW * 0.25, -capsuleH * 0.3, 0,
        -capsuleW * 0.25, -capsuleH * 0.3, capsuleW * 0.3
    );
    highlight1.addColorStop(0, "rgba(255,255,255,0.95)");
    highlight1.addColorStop(0.3, "rgba(255,255,255,0.5)");
    highlight1.addColorStop(0.7, "rgba(240,240,255,0.2)");
    highlight1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(-capsuleW * 0.25, -capsuleH * 0.3, capsuleW * 0.3, 0, Math.PI * 2);
    ctx.fill();

    const highlight2 = ctx.createRadialGradient(
        capsuleW * 0.2, capsuleH * 0.25, 0,
        capsuleW * 0.2, capsuleH * 0.25, capsuleW * 0.1
    );
    highlight2.addColorStop(0, "rgba(255,255,255,0.6)");
    highlight2.addColorStop(0.5, "rgba(255,255,255,0.2)");
    highlight2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight2;
    ctx.beginPath();
    ctx.arc(capsuleW * 0.2, capsuleH * 0.25, capsuleW * 0.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return Texture.from(canvas);
}

// ═══════════════════════════════════════════════════════════
// 1. CLASSIC HYPNO — СПИРАЛЬ (анимируемая)
// ═══════════════════════════════════════════════════════════
function drawClassicSpiral(g, time, isBloom = false) {
    g.clear();
    
    const size = 256;
    const capsuleW = size * 0.28;
    const spiralR = capsuleW * 0.35;
    const turns = 3.5;
    const steps = 120;

    g.moveTo(0, 0);
    for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const angle = t * turns * Math.PI * 2 + time * 0.8;
        const r = t * spiralR;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        g.lineTo(x, y);
    }

    g.stroke({ 
        color: 0x14141e, 
        width: isBloom ? 5 : 2.5, 
        alpha: isBloom ? 0.6 : 0.95,
        cap: "round"
    });

    // Центральная точка
    g.circle(0, 0, isBloom ? 4 : 2.5);
    g.fill({ color: 0x14141e, alpha: isBloom ? 0.7 : 1 });
}

// ═══════════════════════════════════════════════════════════
// 2. CONCENTRIC — ТЕЛО ТАБЛЕТКИ (статичная текстура)
// ═══════════════════════════════════════════════════════════
function createConcentricBody() {
    const size = 256;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // Ambient glow
    const glowLayers = [
        { r: size * 0.48, stops: [[0, "rgba(255,100,200,0.35)"], [0.5, "rgba(200,60,160,0.15)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.35, stops: [[0, "rgba(255,130,220,0.3)"], [0.5, "rgba(220,80,180,0.12)"], [1, "rgba(0,0,0,0)"]] },
        { r: size * 0.25, stops: [[0, "rgba(255,160,240,0.25)"], [0.5, "rgba(240,100,200,0.1)"], [1, "rgba(0,0,0,0)"]] }
    ];

    for (const layer of glowLayers) {
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, layer.r);
        for (const [offset, color] of layer.stops) g.addColorStop(offset, color);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
    }

    ctx.save();
    ctx.translate(cx, cy);

    const pillR = size * 0.22;

    // Тень
    const shadow = ctx.createRadialGradient(0, pillR * 0.3, 0, 0, pillR * 0.3, pillR * 1.3);
    shadow.addColorStop(0, "rgba(100,20,80,0.4)");
    shadow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = shadow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, pillR * 0.3, pillR * 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Тело таблетки
    const pillGrad = ctx.createRadialGradient(
        -pillR * 0.3, -pillR * 0.3, 0,
        0, 0, pillR
    );
    pillGrad.addColorStop(0, "rgba(255,180,230,1)");
    pillGrad.addColorStop(0.2, "rgba(255,120,200,0.98)");
    pillGrad.addColorStop(0.5, "rgba(240,80,170,0.95)");
    pillGrad.addColorStop(0.75, "rgba(200,50,140,0.9)");
    pillGrad.addColorStop(1, "rgba(150,30,100,0.8)");
    
    ctx.fillStyle = pillGrad;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "rgba(255,100,200,1)";
    ctx.beginPath();
    ctx.arc(0, 0, pillR, 0, Math.PI * 2);
    ctx.fill();

    // Внутреннее свечение
    const innerGlow = ctx.createRadialGradient(0, 0, pillR * 0.6, 0, 0, pillR);
    innerGlow.addColorStop(0, "rgba(255,150,220,0)");
    innerGlow.addColorStop(0.7, "rgba(255,100,180,0.2)");
    innerGlow.addColorStop(1, "rgba(255,80,160,0.4)");
    ctx.fillStyle = innerGlow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, pillR, 0, Math.PI * 2);
    ctx.fill();

    // Обводка
    ctx.strokeStyle = "rgba(255,180,220,0.6)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.shadowColor = "rgba(255,150,200,0.8)";
    ctx.beginPath();
    ctx.arc(0, 0, pillR, 0, Math.PI * 2);
    ctx.stroke();

    // Блики
    const highlight1 = ctx.createRadialGradient(
        -pillR * 0.35, -pillR * 0.35, 0,
        -pillR * 0.35, -pillR * 0.35, pillR * 0.3
    );
    highlight1.addColorStop(0, "rgba(255,255,255,0.95)");
    highlight1.addColorStop(0.3, "rgba(255,230,245,0.6)");
    highlight1.addColorStop(0.7, "rgba(255,200,230,0.2)");
    highlight1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight1;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(-pillR * 0.35, -pillR * 0.35, pillR * 0.3, 0, Math.PI * 2);
    ctx.fill();

    const highlight2 = ctx.createRadialGradient(
        pillR * 0.3, pillR * 0.2, 0,
        pillR * 0.3, pillR * 0.2, pillR * 0.12
    );
    highlight2.addColorStop(0, "rgba(255,230,245,0.5)");
    highlight2.addColorStop(0.5, "rgba(255,200,230,0.2)");
    highlight2.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlight2;
    ctx.beginPath();
    ctx.arc(pillR * 0.3, pillR * 0.2, pillR * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return Texture.from(canvas);
}

// ═══════════════════════════════════════════════════════════
// 2. CONCENTRIC — КОЛЬЦА (анимируемые)
// ═══════════════════════════════════════════════════════════
function drawConcentricRings(g, time, isBloom = false) {
    g.clear();

    const size = 256;
    const pillR = size * 0.22;
    const rings = 5;

    for (let i = 1; i <= rings; i++) {
        const r = (i / rings) * pillR * 0.85;
        
        // Чередование направления вращения
        const speed = (i % 2 === 0 ? 0.5 : -0.5);
        const startAngle = time * speed + (i % 2 === 0 ? 0 : Math.PI * 0.5);
        const arcLength = Math.PI * 1.5;
        const endAngle = startAngle + arcLength;
        
        const steps = 40;
        g.moveTo(Math.cos(startAngle) * r, Math.sin(startAngle) * r);
        for (let j = 1; j <= steps; j++) {
            const t = j / steps;
            const angle = startAngle + t * arcLength;
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r;
            g.lineTo(x, y);
        }

        g.stroke({ 
            color: 0xffffff, 
            width: isBloom ? 3.5 : 2, 
            alpha: isBloom ? 0.55 : 0.9,
            cap: "round"
        });
    }

    // Центральная точка
    g.circle(0, 0, isBloom ? 5 : 3);
    g.fill({ color: 0xffffff, alpha: isBloom ? 0.8 : 1 });
}

// ═══════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════
const comparison = document.getElementById('comparison');

const configs = [
    { 
        name: 'CLASSIC HYPNO', 
        createBody: createCapsuleBody,
        drawInner: drawClassicSpiral
    },
    { 
        name: 'CONCENTRIC', 
        createBody: createConcentricBody,
        drawInner: drawConcentricRings
    }
];

for (const config of configs) {
    const container = document.createElement('div');
    container.className = 'pill-container';
    
    const appDiv = document.createElement('div');
    container.appendChild(appDiv);
    
    const label = document.createElement('div');
    label.className = 'pill-label';
    label.textContent = config.name;
    container.appendChild(label);
    
    comparison.appendChild(container);
    
    const app = new Application();
    await app.init({
        width: 400, height: 400,
        backgroundColor: 0x06080e,
        antialias: true,
    });
    appDiv.appendChild(app.canvas);

    // Главный контейнер (покачивается)
    const pillContainer = new Container();
    pillContainer.x = 200; pillContainer.y = 200;
    app.stage.addChild(pillContainer);

    // Статичное тело пилюли
    const bodyTex = config.createBody();
    const bodySprite = new Sprite(bodyTex);
    bodySprite.anchor.set(0.5);
    bodySprite.width = 240; bodySprite.height = 240;
    pillContainer.addChild(bodySprite);

    // Bloom от тела
    const bodyBloom = new Sprite(bodyTex);
    bodyBloom.anchor.set(0.5);
    bodyBloom.width = 280; bodyBloom.height = 280;
    bodyBloom.alpha = 0.4;
    bodyBloom.blendMode = "add";
    bodyBloom.filters = [new BlurFilter({ strength: 12, quality: 3 })];
    pillContainer.addChild(bodyBloom);

    // АНИМИРУЕМЫЙ внутренний элемент (спираль/кольца)
    const innerContainer = new Container();
    innerContainer.width = 240; innerContainer.height = 240;
    pillContainer.addChild(innerContainer);

    const innerGfx = new Graphics();
    innerGfx.x = 0; innerGfx.y = 0;
    innerContainer.addChild(innerGfx);

    // Bloom от внутреннего элемента
    const innerBloomContainer = new Container();
    innerBloomContainer.filters = [new BlurFilter({ strength: 15, quality: 3 })];
    innerBloomContainer.alpha = 0.5;
    innerBloomContainer.blendMode = "add";
    pillContainer.addChild(innerBloomContainer);

    const innerBloomGfx = new Graphics();
    innerBloomContainer.addChild(innerBloomGfx);

    let time = 0;
    app.ticker.add(() => {
        const dt = 0.016;
        time += dt;

        // Покачивание всей пилюли
        const pulse = 1 + Math.sin(time * 1.5) * 0.03;
        pillContainer.scale.set(pulse);
        pillContainer.rotation = Math.sin(time * 0.8) * 0.04;

        // Мерцание bloom тела
        bodyBloom.alpha = 0.4 + Math.sin(time * 2) * 0.05;

        // Рисуем анимируемый внутренний элемент
        config.drawInner(innerGfx, time, false);
        config.drawInner(innerBloomGfx, time, true);
    });
}
</script>
</body>
</html>
