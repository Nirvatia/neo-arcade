<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golden Cosmic Egg — Artifact</title>
<style>
    body { margin: 0; background: #06080e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Courier New', monospace; color: #c8d4e0; }
    canvas { display: block; border: 1px solid #1a2430; border-radius: 4px; }
    .title { margin-bottom: 20px; font-size: 14px; letter-spacing: 4px; opacity: 0.6; }
</style>
</head>
<body>
<div class="title">GOLDEN COSMIC EGG · ARTIFACT</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, Graphics, BlurFilter } = PIXI;

function createEggTexture() {
    const size = 128;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // Многослойное золотое свечение
    const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.5);
    g1.addColorStop(0, "rgba(255,240,150,0.5)");
    g1.addColorStop(0.3, "rgba(255,200,80,0.3)");
    g1.addColorStop(0.6, "rgba(220,160,40,0.15)");
    g1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, size, size);

    const eggWidth = size * 0.28;
    const eggHeight = size * 0.38;
    
    ctx.save();
    ctx.translate(cx, cy);
    
    // Внешний контур (яркий, с тенями)
    ctx.strokeStyle = "rgba(255,230,140,0.95)";
    ctx.lineWidth = 3;
    ctx.shadowBlur = 12;
    ctx.shadowColor = "rgba(255,210,100,1)";
    ctx.beginPath();
    ctx.ellipse(0, 0, eggWidth, eggHeight, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // Второй контур (внутренний)
    ctx.strokeStyle = "rgba(255,250,200,0.6)";
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.ellipse(0, 0, eggWidth * 0.75, eggHeight * 0.75, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // Третий контур (самый внутренний)
    ctx.strokeStyle = "rgba(255,255,230,0.4)";
    ctx.lineWidth = 1;
    ctx.shadowBlur = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, eggWidth * 0.5, eggHeight * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    
    // Градиент "жидкого золота" внутри
    ctx.shadowBlur = 0;
    const eggGrad = ctx.createRadialGradient(0, -eggHeight * 0.25, 0, 0, 0, eggHeight * 0.9);
    eggGrad.addColorStop(0, "rgba(255,250,200,0.7)");
    eggGrad.addColorStop(0.2, "rgba(255,220,120,0.5)");
    eggGrad.addColorStop(0.5, "rgba(240,180,70,0.35)");
    eggGrad.addColorStop(0.8, "rgba(200,140,40,0.2)");
    eggGrad.addColorStop(1, "rgba(160,100,20,0.1)");
    ctx.fillStyle = eggGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, eggWidth * 0.75, eggHeight * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Пульсирующее ядро внутри
    const coreGrad = ctx.createRadialGradient(0, -eggHeight * 0.1, 0, 0, 0, eggHeight * 0.3);
    coreGrad.addColorStop(0, "rgba(255,255,240,1)");
    coreGrad.addColorStop(0.2, "rgba(255,250,200,0.85)");
    coreGrad.addColorStop(0.5, "rgba(255,230,150,0.5)");
    coreGrad.addColorStop(0.8, "rgba(255,200,100,0.2)");
    coreGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = coreGrad;
    ctx.fillRect(-eggHeight * 0.3, -eggHeight * 0.4, eggHeight * 0.6, eggHeight * 0.6);
    
    // Блик (отражение света)
    const highlightGrad = ctx.createRadialGradient(-eggWidth * 0.35, -eggHeight * 0.45, 0, 0, 0, eggWidth * 0.5);
    highlightGrad.addColorStop(0, "rgba(255,255,255,0.7)");
    highlightGrad.addColorStop(0.3, "rgba(255,250,220,0.4)");
    highlightGrad.addColorStop(0.6, "rgba(255,240,180,0.15)");
    highlightGrad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = highlightGrad;
    ctx.fillRect(-eggWidth, -eggHeight, eggWidth * 1.5, eggHeight * 0.9);
    
    // Декоративные линии (как прожилки на яйце)
    ctx.strokeStyle = "rgba(255,240,180,0.3)";
    ctx.lineWidth = 0.8;
    ctx.shadowBlur = 2;
    ctx.shadowColor = "rgba(255,220,120,0.5)";
    
    for (let i = 0; i < 3; i++) {
        const yOffset = -eggHeight * 0.3 + i * eggHeight * 0.3;
        ctx.beginPath();
        ctx.ellipse(0, yOffset, eggWidth * 0.6, eggHeight * 0.15, 0, 0, Math.PI * 2);
        ctx.stroke();
    }
    
    ctx.restore();

    return Texture.from(canvas);
}

function createRuneTexture() {
    const size = 128;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    // Золотые руны вокруг яйца
    ctx.save();
    ctx.translate(cx, cy);
    
    const runeRadius = size * 0.42;
    const runeCount = 8;
    
    for (let i = 0; i < runeCount; i++) {
        const angle = (i / runeCount) * Math.PI * 2;
        const x = Math.cos(angle) * runeRadius;
        const y = Math.sin(angle) * runeRadius;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle + Math.PI / 2);
        
        // Руна (простой символ)
        ctx.strokeStyle = "rgba(255,220,120,0.8)";
        ctx.lineWidth = 1.5;
        ctx.shadowBlur = 4;
        ctx.shadowColor = "rgba(255,200,80,0.9)";
        
        // Разные символы для каждой руны
        if (i % 4 === 0) {
            // Крест
            ctx.beginPath();
            ctx.moveTo(0, -4); ctx.lineTo(0, 4);
            ctx.moveTo(-3, 0); ctx.lineTo(3, 0);
            ctx.stroke();
        } else if (i % 4 === 1) {
            // Круг
            ctx.beginPath();
            ctx.arc(0, 0, 3, 0, Math.PI * 2);
            ctx.stroke();
        } else if (i % 4 === 2) {
            // Треугольник
            ctx.beginPath();
            ctx.moveTo(0, -4);
            ctx.lineTo(-3, 3);
            ctx.lineTo(3, 3);
            ctx.closePath();
            ctx.stroke();
        } else {
            // Звезда
            ctx.beginPath();
            for (let j = 0; j < 5; j++) {
                const a = (j / 5) * Math.PI * 2 - Math.PI / 2;
                const r = j % 2 === 0 ? 4 : 2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (j === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
        }
        
        ctx.restore();
    }
    
    ctx.restore();

    return Texture.from(canvas);
}

const EGG_TEX = createEggTexture();
const RUNE_TEX = createRuneTexture();

const app = new Application();
await app.init({
    width: 400, height: 400,
    backgroundColor: 0x06080e,
    antialias: true,
});
document.getElementById('pixi-container').appendChild(app.canvas);

const container = new Container();
container.x = 200; container.y = 200;
app.stage.addChild(container);

// Руны (вращаются)
const runes = new Sprite(RUNE_TEX);
runes.anchor.set(0.5);
runes.width = 120; runes.height = 120;
container.addChild(runes);

// Яйцо
const egg = new Sprite(EGG_TEX);
egg.anchor.set(0.5);
egg.width = 100; egg.height = 100;
container.addChild(egg);

// Bloom для яйца
const eggBloom = new Sprite(EGG_TEX);
eggBloom.anchor.set(0.5);
eggBloom.width = 140; eggBloom.height = 140;
eggBloom.alpha = 0.6;
eggBloom.blendMode = "add";
eggBloom.filters = [new BlurFilter({ strength: 12, quality: 3 })];
container.addChild(eggBloom);

// Bloom для рун
const runeBloom = new Sprite(RUNE_TEX);
runeBloom.anchor.set(0.5);
runeBloom.width = 150; runeBloom.height = 150;
runeBloom.alpha = 0.4;
runeBloom.blendMode = "add";
runeBloom.filters = [new BlurFilter({ strength: 8, quality: 3 })];
container.addChild(runeBloom);

// Орбитальные частицы
const particles = [];
for (let i = 0; i < 12; i++) {
    const particle = new Sprite(Texture.WHITE);
    particle.anchor.set(0.5);
    particle.width = 3; particle.height = 3;
    particle.tint = 0xffdd88;
    particle.blendMode = "add";
    container.addChild(particle);
    particles.push({
        sprite: particle,
        angle: (i / 12) * Math.PI * 2,
        radius: 55 + Math.random() * 10,
        speed: 0.8 + Math.random() * 0.4
    });
}

let time = 0;
app.ticker.add((ticker) => {
    const dt = ticker.deltaMS / 1000;
    time += dt;
    
    // Вращение рун
    runes.rotation = time * 0.5;
    runeBloom.rotation = time * 0.5;
    
    // Пульсация яйца
    const breathe = 1 + Math.sin(time * 2.5) * 0.08;
    egg.scale.set(breathe);
    eggBloom.scale.set(breathe);
    
    // Мерцание
    const flicker = 0.85 + Math.sin(time * 10) * 0.08 + Math.sin(time * 18) * 0.04;
    egg.alpha = flicker;
    eggBloom.alpha = 0.5 + Math.sin(time * 7) * 0.12;
    runes.alpha = 0.7 + Math.sin(time * 6) * 0.15;
    runeBloom.alpha = 0.35 + Math.sin(time * 5) * 0.1;
    
    // Лёгкое покачивание
    container.rotation = Math.sin(time * 0.5) * 0.05;
    
    // Анимация частиц
    for (const p of particles) {
        p.angle += p.speed * dt;
        p.sprite.x = Math.cos(p.angle) * p.radius;
        p.sprite.y = Math.sin(p.angle) * p.radius * 0.6; // Эллиптическая орбита
        p.sprite.alpha = 0.6 + Math.sin(time * 8 + p.angle) * 0.3;
        p.sprite.scale.set(0.8 + Math.sin(time * 6 + p.angle * 2) * 0.3);
    }
});
</script>
</body>
</html>
