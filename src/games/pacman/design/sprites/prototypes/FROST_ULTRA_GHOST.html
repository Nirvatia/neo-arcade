<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>FROST RIFT — Snow Void Ghost</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: "Segoe UI", system-ui, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #aaccee; font-size: 13px; background: rgba(5,10,20,0.92); padding: 16px 20px; border-radius: 8px; border: 1px solid rgba(100,180,255,0.3); backdrop-filter: blur(8px); line-height: 1.6; min-width: 300px; }
        #ui h3 { margin: 0 0 12px 0; color: #88bbff; font-size: 15px; border-bottom: 1px solid rgba(100,180,255,0.2); padding-bottom: 8px; letter-spacing: 2px; }
        #ui label { display: block; margin: 8px 0 2px 0; color: #7799cc; font-size: 11px; letter-spacing: 1px; }
        #ui input[type="range"] { width: 100%; margin: 2px 0; }
        #ui .value-display { color: #99ccff; font-weight: 600; float: right; font-size: 11px; }
        #ui .section { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(100,180,255,0.15); }
        #ui .section-title { color: #88bbff; font-size: 11px; letter-spacing: 2px; margin-bottom: 6px; text-transform: uppercase; }
        #stats { position: absolute; bottom: 15px; left: 15px; color: #557799; font-size: 11px; font-family: monospace; background: rgba(5,10,20,0.7); padding: 8px 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>❄ FROST RIFT</h3>
        <div class="section-title">Animation</div>
        <label>Chaos Speed <span class="value-display" id="chaosSpeedValue">2.5x</span></label>
        <input type="range" id="chaosSpeed" min="0.2" max="3" step="0.1" value="2.5" />
        <label>Chaos Intensity <span class="value-display" id="chaosIntValue">1.2</span></label>
        <input type="range" id="chaosInt" min="0.2" max="2" step="0.1" value="1.2" />
        <div class="section"><div class="section-title">Core</div>
        <label>Void Size <span class="value-display" id="voidSizeValue">50</span></label>
        <input type="range" id="voidSize" min="30" max="120" step="2" value="50" /></div>
        <div class="section"><div class="section-title">Rift Layers</div>
        <label>Layer Count <span class="value-display" id="layerCountValue">1</span></label>
        <input type="range" id="layerCount" min="1" max="6" step="1" value="1" />
        <label>Vertices per Layer <span class="value-display" id="vertCountValue">40</span></label>
        <input type="range" id="vertCount" min="8" max="40" step="2" value="40" />
        <label>Rift Expansion <span class="value-display" id="riftExpValue">120</span></label>
        <input type="range" id="riftExp" min="20" max="200" step="5" value="120" />
        <label>Deformation Amplitude <span class="value-display" id="deformAmpValue">45</span></label>
        <input type="range" id="deformAmp" min="5" max="60" step="1" value="45" />
        <label>Glow Intensity <span class="value-display" id="glowIntValue">1.0</span></label>
        <input type="range" id="glowInt" min="0" max="2" step="0.1" value="1.0" /></div>
    </div>
    <div id="stats">FPS: <span id="fps">0</span></div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
    <script type="module">
        const { Application, Container, Graphics, BlurFilter } = PIXI;

        const app = new Application();
        await app.init({ width: window.innerWidth, height: window.innerHeight, backgroundColor: 0x080c18, antialias: true });
        document.body.appendChild(app.canvas);

        const CX = window.innerWidth / 2, CY = window.innerHeight / 2;

        const CFG = {
            chaosSpeed: 2.5, chaosIntensity: 1.2,
            voidSize: 50, layerCount: 1, vertCount: 40,
            riftExpansion: 120, deformAmplitude: 45, glowIntensity: 1.0,
        };

        // ── SNOW PALETTE ────────────────────────────
        const snowPalette = [
            { fill: 0x112244, stroke: 0x3366aa, core: 0x5599dd, glow: 0x224488 },
            { fill: 0x153355, stroke: 0x4488cc, core: 0x77bbee, glow: 0x3366aa },
            { fill: 0x184466, stroke: 0x5599dd, core: 0x99ccff, glow: 0x4488cc },
            { fill: 0x1c5577, stroke: 0x66aaee, core: 0xaaddff, glow: 0x5599dd },
            { fill: 0x206688, stroke: 0x77bbff, core: 0xbbddff, glow: 0x66aaee },
            { fill: 0x247799, stroke: 0x88ccff, core: 0xcceeff, glow: 0x77bbff },
        ];

        class FrostRiftRenderer {
            constructor() {
                this.container = new Container();
                this.auraGfx = new Graphics();
                this.voidGfx = new Graphics();
                this.riftGlowGfx = new Graphics();
                this.riftGfx = new Graphics();
                this.riftCoreGfx = new Graphics();
                this.snowGfx = new Graphics(); // falling snow into void

                this.auraGfx.blendMode = "add";
                this.riftGlowGfx.blendMode = "add";
                this.riftCoreGfx.blendMode = "add";
                this.snowGfx.blendMode = "add";

                this.riftGlowGfx.filters = [new BlurFilter({ strength: 15, quality: 3 })];

                this.container.addChild(this.auraGfx, this.riftGlowGfx, this.riftGfx, this.riftCoreGfx, this.voidGfx, this.snowGfx);
                this.time = 0;

                this.vertexPhases = []; this.vertexFreqs = [];
                for (let layer = 0; layer < 6; layer++) {
                    const phases = [], freqs = [];
                    for (let v = 0; v < 40; v++) { phases.push(Math.random() * Math.PI * 2); freqs.push(0.5 + Math.random() * 2); }
                    this.vertexPhases.push(phases); this.vertexFreqs.push(freqs);
                }

                // Snowflakes falling INTO the void
                this.snowflakes = [];
                for (let i = 0; i < 60; i++) {
                    this.snowflakes.push({
                        angle: Math.random() * Math.PI * 2,
                        dist: Math.random(),
                        size: 0.3 + Math.random() * 1.5,
                        speed: 0.3 + Math.random() * 0.8,
                        phase: Math.random() * Math.PI * 2,
                    });
                }
            }

            update(dt) { this.time += dt * CFG.chaosSpeed; }

            draw() {
                this.auraGfx.clear(); this.voidGfx.clear(); this.riftGlowGfx.clear();
                this.riftGfx.clear(); this.riftCoreGfx.clear(); this.snowGfx.clear();
                const t = this.time;
                this.drawAura(t); this.drawRift(t); this.drawVoid(t); this.drawSnow(t);
            }

            drawAura(t) {
                const maxR = CFG.voidSize + CFG.riftExpansion * CFG.layerCount * 0.5;
                const layers = [
                    { r: maxR * 2.0, color: 0x0a1525, alpha: 0.12 },
                    { r: maxR * 1.5, color: 0x102040, alpha: 0.18 },
                    { r: maxR * 1.0, color: 0x1a3366, alpha: 0.15 },
                ];
                for (const l of layers) this.auraGfx.circle(0, 0, l.r).fill({ color: l.color, alpha: l.alpha });
            }

            drawVoid(t) {
                const vertCount = CFG.vertCount;
                const points = [];
                for (let i = 0; i < vertCount; i++) {
                    const baseAngle = (i / vertCount) * Math.PI * 2;
                    const phase = this.vertexPhases[0][i], freq = this.vertexFreqs[0][i];
                    const noise = Math.sin(t * freq * 2 + phase) * 0.5 + Math.sin(t * freq * 3.7 + phase * 2.3) * 0.3 + Math.sin(t * freq * 1.3 + phase * 0.7) * 0.2;
                    const deform = noise * CFG.deformAmplitude * 0.5 * CFG.chaosIntensity;
                    points.push({ x: Math.cos(baseAngle) * (CFG.voidSize + deform), y: Math.sin(baseAngle) * (CFG.voidSize + deform) });
                }
                this.voidGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.voidGfx.lineTo(points[i].x, points[i].y);
                this.voidGfx.closePath();
                this.voidGfx.fill({ color: 0x040a18, alpha: 1.0 });
            }

            drawRift(t) {
                for (let layer = 0; layer < CFG.layerCount; layer++) {
                    const layerT = layer / CFG.layerCount;
                    const baseR = CFG.voidSize + CFG.riftExpansion * (layerT + 0.2);
                    const color = snowPalette[layer % snowPalette.length];
                    const deformScale = 0.5 + layerT * 0.8;
                    this.drawRiftLayer(layer, baseR, deformScale, t, color);
                }
            }

            drawRiftLayer(layerIdx, baseR, deformScale, t, color) {
                const vertCount = CFG.vertCount;
                const points = [];
                for (let i = 0; i < vertCount; i++) {
                    const baseAngle = (i / vertCount) * Math.PI * 2;
                    const phase = this.vertexPhases[layerIdx][i], freq = this.vertexFreqs[layerIdx][i];
                    const noise = Math.sin(t * freq * 2 + phase) * 0.5 + Math.sin(t * freq * 3.7 + phase * 2.3) * 0.3 + Math.sin(t * freq * 1.3 + phase * 0.7) * 0.2;
                    const deform = noise * CFG.deformAmplitude * deformScale * CFG.chaosIntensity;
                    points.push({ x: Math.cos(baseAngle) * (baseR + deform), y: Math.sin(baseAngle) * (baseR + deform) });
                }

                // Glow bloom
                this.riftGlowGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.riftGlowGfx.lineTo(points[i].x, points[i].y);
                this.riftGlowGfx.closePath();
                this.riftGlowGfx.stroke({ color: color.glow, width: 20, alpha: 0.4 * CFG.glowIntensity, join: "miter" });

                // Mid glow
                this.riftGlowGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.riftGlowGfx.lineTo(points[i].x, points[i].y);
                this.riftGlowGfx.closePath();
                this.riftGlowGfx.stroke({ color: color.stroke, width: 12, alpha: 0.5 * CFG.glowIntensity, join: "miter" });

                // Outer ring
                this.riftGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.riftGfx.lineTo(points[i].x, points[i].y);
                this.riftGfx.closePath();
                this.riftGfx.stroke({ color: color.stroke, width: 6, alpha: 0.3, join: "miter" });

                // Main border
                this.riftGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.riftGfx.lineTo(points[i].x, points[i].y);
                this.riftGfx.closePath();
                this.riftGfx.stroke({ color: color.stroke, width: 3, alpha: 0.9, join: "miter" });

                // Bright core
                this.riftCoreGfx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) this.riftCoreGfx.lineTo(points[i].x, points[i].y);
                this.riftCoreGfx.closePath();
                this.riftCoreGfx.stroke({ color: color.core, width: 1.5, alpha: 0.95, join: "miter" });
            }

            drawSnow(t) {
                const voidR = CFG.voidSize;
                for (const sf of this.snowflakes) {
                    sf.dist += sf.speed * 0.008;
                    if (sf.dist > 1.2) { sf.dist = 0; sf.angle = Math.random() * Math.PI * 2; }
                    const spiralAngle = sf.angle + sf.dist * 3 + t * 0.5;
                    const r = voidR * (0.1 + sf.dist * 1.1);
                    const x = Math.cos(spiralAngle) * r;
                    const y = Math.sin(spiralAngle) * r;
                    const alpha = sf.dist < 0.3 ? sf.dist / 0.3 : (1 - (sf.dist - 0.3) / 0.9);
                    this.snowGfx.circle(x, y, sf.size * alpha).fill({ color: 0xaaddff, alpha: alpha * 0.8 });
                }
            }

            destroy() { this.container.destroy({ children: true }); }
        }

        const frostRift = new FrostRiftRenderer();
        frostRift.container.x = CX; frostRift.container.y = CY;
        app.stage.addChild(frostRift.container);

        function bind(id, cfgKey, displayId, formatter = (v) => v) {
            const el = document.getElementById(id), display = document.getElementById(displayId);
            el.addEventListener("input", (e) => { const val = parseFloat(e.target.value); CFG[cfgKey] = val; display.textContent = formatter(val); });
            display.textContent = formatter(parseFloat(el.value));
        }
        bind("chaosSpeed", "chaosSpeed", "chaosSpeedValue", (v) => v.toFixed(1) + "x");
        bind("chaosInt", "chaosIntensity", "chaosIntValue", (v) => v.toFixed(1));
        bind("voidSize", "voidSize", "voidSizeValue", (v) => v);
        bind("layerCount", "layerCount", "layerCountValue", (v) => v);
        bind("vertCount", "vertCount", "vertCountValue", (v) => v);
        bind("riftExp", "riftExpansion", "riftExpValue", (v) => v);
        bind("deformAmp", "deformAmplitude", "deformAmpValue", (v) => v);
        bind("glowInt", "glowIntensity", "glowIntValue", (v) => v.toFixed(1));

        let lastTime = performance.now(), frameCount = 0, fpsTime = 0;
        app.ticker.add((ticker) => {
            const now = performance.now(), dt = Math.min(0.1, (now - lastTime) / 1000); lastTime = now;
            frameCount++; fpsTime += dt;
            if (fpsTime >= 1) { document.getElementById("fps").textContent = frameCount; frameCount = 0; fpsTime = 0; }
            frostRift.update(dt); frostRift.draw();
        });
        window.addEventListener("resize", () => { app.renderer.resize(window.innerWidth, window.innerHeight); frostRift.container.x = window.innerWidth / 2; frostRift.container.y = window.innerHeight / 2; });
    </script>
</body>
</html>
