<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supernova — Particles Version</title>
<style>
    body { 
        margin: 0; 
        background: #06080e; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        font-family: 'Courier New', monospace; 
        color: #c8d4e0; 
        gap: 30px;
    }
    .title { 
        font-size: 16px; 
        letter-spacing: 5px; 
        opacity: 0.7; 
    }
    canvas { 
        display: block; 
        border: 1px solid #1a2430; 
        border-radius: 4px; 
    }
</style>
</head>
<body>
<div class="title">SUPERNOVA · PARTICLES VERSION</div>
<div id="pixi-container"></div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script type="module">
const { Application, Container, Sprite, Texture, BlurFilter } = PIXI;

function createSupernova(time) {
    const size = 512;
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");
    const cx = size / 2, cy = size / 2;

    ctx.save();
    ctx.translate(cx, cy);

    const coreR = size * 0.09;

    // ═══════════════════════════════════════════════════════════
    // 1. ФОНОВОЕ ОБЛАКО (мягкое)
    // ═══════════════════════════════════════════════════════════
    const bgPulse = 1 + Math.sin(time * 1.2) * 0.08;
    
    const bg1 = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.45 * bgPulse);
    bg1.addColorStop(0, "rgba(255,230,180,0.3)");
    bg1.addColorStop(0.4, "rgba(255,180,100,0.12)");
    bg1.addColorStop(0.7, "rgba(255,130,60,0.05)");
    bg1.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bg1;
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.45 * bgPulse, 0, Math.PI * 2);
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 2. РАСХОДЯЩИЕСЯ ВОЛНЫ (3 штуки)
    // ═══════════════════════════════════════════════════════════
    const waveConfigs = [
        { speed: 1.1, offset: 0, width: 4, color: [255, 240, 200] },
        { speed: 0.9, offset: 1.2, width: 3.5, color: [255, 220, 160] },
        { speed: 0.75, offset: 2.4, width: 3, color: [255, 200, 120] }
    ];
    
    for (const wave of waveConfigs) {
        const wavePhase = (time * wave.speed + wave.offset) % 3.5;
        const waveR = coreR * 1.5 + wavePhase * size * 0.12;
        const waveAlpha = Math.max(0, 1 - wavePhase / 3.5);
        
        if (waveAlpha > 0.05) {
            // Свечение волны
            ctx.strokeStyle = `rgba(${wave.color[0]},${wave.color[1]},${wave.color[2]},${waveAlpha * 0.35})`;
            ctx.lineWidth = wave.width * 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgba(${wave.color[0]},${wave.color[1]},${wave.color[2]},${waveAlpha * 0.6})`;
            ctx.beginPath();
            ctx.arc(0, 0, waveR, 0, Math.PI * 2);
            ctx.stroke();
            
            // Яркая сердцевина волны
            ctx.strokeStyle = `rgba(255,255,240,${waveAlpha * 0.75})`;
            ctx.lineWidth = wave.width;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, 0, waveR, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // ═══════════════════════════════════════════════════════════
    // 3. ЭНЕРГЕТИЧЕСКИЕ ЧАСТИЦЫ (15 искр, без хвостов)
    // ═══════════════════════════════════════════════════════════
    const particleCount = 15;
    for (let i = 0; i < particleCount; i++) {
        // Детерминированные "случайные" значения
        const seed1 = Math.sin(i * 12.9898) * 43758.5453;
        const seed2 = Math.sin(i * 78.233) * 43758.5453;
        const seed3 = Math.sin(i * 45.164) * 43758.5453;
        
        const baseAngle = (seed1 - Math.floor(seed1)) * Math.PI * 2;
        const speed = 0.3 + (seed2 - Math.floor(seed2)) * 0.5;
        const phase = (seed3 - Math.floor(seed3)) * Math.PI * 2;
        
        const particlePhase = (time * speed + phase) % 2.5;
        const particleR = coreR * 1.3 + particlePhase * size * 0.18;
        const particleAlpha = Math.max(0, 1 - particlePhase / 2.5);
        
        if (particleAlpha > 0.05) {
            const angle = baseAngle + time * 0.15;
            const x = Math.cos(angle) * particleR;
            const y = Math.sin(angle) * particleR;
            const pSize = (1.5 + (seed1 - Math.floor(seed1)) * 2) * particleAlpha;
            
            // Свечение частицы
            ctx.fillStyle = `rgba(255,240,200,${particleAlpha * 0.4})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(255,220,150,${particleAlpha})`;
            ctx.beginPath();
            ctx.arc(x, y, pSize * 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Ядро частицы
            ctx.fillStyle = `rgba(255,255,240,${particleAlpha})`;
            ctx.shadowBlur = 6;
            ctx.shadowColor = `rgba(255,240,200,1)`;
            ctx.beginPath();
            ctx.arc(x, y, pSize, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ═══════════════════════════════════════════════════════════
    // 4. ЯДРО — ВНЕШНЕЕ СВЕЧЕНИЕ
    // ═══════════════════════════════════════════════════════════
    const corePulse = 1 + Math.sin(time * 3) * 0.12;
    
    // Мягкое внешнее свечение
    const outerGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 3.5 * corePulse);
    outerGlow.addColorStop(0, "rgba(255,250,220,0.5)");
    outerGlow.addColorStop(0.3, "rgba(255,220,150,0.25)");
    outerGlow.addColorStop(0.6, "rgba(255,180,100,0.08)");
    outerGlow.addColorStop(1, "rgba(255,150,60,0)");
    ctx.fillStyle = outerGlow;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 3.5 * corePulse, 0, Math.PI * 2);
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 5. ЯДРО — ОСНОВНОЙ ШАР
    // ═══════════════════════════════════════════════════════════
    ctx.shadowBlur = 40;
    ctx.shadowColor = "rgba(255,250,220,1)";
    
    const mainCore = ctx.createRadialGradient(-coreR * 0.2, -coreR * 0.2, 0, 0, 0, coreR * 1.2 * corePulse);
    mainCore.addColorStop(0, "rgba(255,255,255,1)");
    mainCore.addColorStop(0.2, "rgba(255,255,240,1)");
    mainCore.addColorStop(0.5, "rgba(255,240,200,0.95)");
    mainCore.addColorStop(0.8, "rgba(255,220,150,0.85)");
    mainCore.addColorStop(1, "rgba(255,180,100,0.6)");
    
    ctx.fillStyle = mainCore;
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 1.2 * corePulse, 0, Math.PI * 2);
    ctx.fill();

    // ═══════════════════════════════════════════════════════════
    // 6. ЯДРО — ЯРКИЙ ЦЕНТР
    // ═══════════════════════════════════════════════════════════
    const brightCenter = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 0.5 * corePulse);
    brightCenter.addColorStop(0, "rgba(255,255,255,1)");
    brightCenter.addColorStop(0.5, "rgba(255,255,250,0.95)");
    brightCenter.addColorStop(1, "rgba(255,250,230,0)");
    
    ctx.fillStyle = brightCenter;
    ctx.shadowBlur = 20;
    ctx.shadowColor = "rgba(255,255,255,1)";
    ctx.beginPath();
    ctx.arc(0, 0, coreR * 0.5 * corePulse, 0, Math.PI * 2);
    ctx.fill();

    // Маленький яркий блик
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "rgba(255,255,255,1)";
    ctx.beginPath();
    ctx.arc(-coreR * 0.25, -coreR * 0.25, coreR * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
    return Texture.from(canvas);
}

// ═══════════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════════
async function setup() {
    const app = new Application();
    await app.init({
        width: 500, height: 500,
        backgroundColor: 0x06080e,
        antialias: true,
    });
    document.getElementById('pixi-container').appendChild(app.canvas);

    const container = new Container();
    container.x = 250; container.y = 250;
    app.stage.addChild(container);

    let time = 0;
    
    app.ticker.add(() => {
        time += 0.016;
        
        const tex = createSupernova(time);
        
        while (container.children.length > 0) {
            container.removeChildAt(0);
        }
        
        // Основной спрайт
        const sprite = new Sprite(tex);
        sprite.anchor.set(0.5);
        sprite.width = 380; sprite.height = 380;
        container.addChild(sprite);

        // Bloom слой 1 (близкий)
        const bloom1 = new Sprite(tex);
        bloom1.anchor.set(0.5);
        bloom1.width = 420; bloom1.height = 420;
        bloom1.alpha = 0.45;
        bloom1.blendMode = "add";
        bloom1.filters = [new BlurFilter({ strength: 15, quality: 3 })];
        container.addChild(bloom1);

        // Bloom слой 2 (средний)
        const bloom2 = new Sprite(tex);
        bloom2.anchor.set(0.5);
        bloom2.width = 480; bloom2.height = 480;
        bloom2.alpha = 0.25;
        bloom2.blendMode = "add";
        bloom2.filters = [new BlurFilter({ strength: 30, quality: 3 })];
        container.addChild(bloom2);

        // Bloom слой 3 (далёкий)
        const bloom3 = new Sprite(tex);
        bloom3.anchor.set(0.5);
        bloom3.width = 560; bloom3.height = 560;
        bloom3.alpha = 0.15;
        bloom3.blendMode = "add";
        bloom3.filters = [new BlurFilter({ strength: 50, quality: 3 })];
        container.addChild(bloom3);

        // Дыхание
        const breathe = 1 + Math.sin(time * 1.5) * 0.03;
        container.scale.set(breathe);
    });
}

setup();
</script>
</body>
</html>
