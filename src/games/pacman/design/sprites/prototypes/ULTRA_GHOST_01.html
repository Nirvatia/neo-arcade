<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>cosmic singularity • absolute limit renderer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a14;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', monospace;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    canvas {
      display: block;
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(0,180,255,0.25), 0 0 0 1px rgba(120,180,255,0.3);
      background: radial-gradient(circle at center, #14142b 0%, #04040c 100%);
      width: min(90vmin, 800px);
      height: auto;
      aspect-ratio: 1/1;
    }
    .legend {
      color: #b8c7ff;
      display: flex;
      gap: 32px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      background: rgba(10,15,35,0.8);
      backdrop-filter: blur(12px);
      padding: 10px 28px;
      border-radius: 60px;
      border: 1px solid rgba(160,200,255,0.25);
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 15px currentColor;
    }
  </style>
</head>
<body>
<div class="container">
  <canvas id="cosmicCanvas" width="800" height="800"></canvas>
  <div class="legend">
    <span><span class="dot" style="background:#ff44b0; box-shadow:0 0 20px #ff44b0;"></span> FRIGHTENED vortex</span>
    <span><span class="dot" style="background:#00e0ff; box-shadow:0 0 20px #00e0ff;"></span> EATEN remnant</span>
    <span><span class="dot" style="background:#ffaa00; box-shadow:0 0 20px #ffaa00;"></span> NORMAL strands</span>
  </div>
</div>
<script>
  (function() {
    // ------------------------------------ EXTREME COMPLEXITY CORE ------------------------------------
    // We push every mathematical concept: hyperbolic spirals, cycloid perturbations,
    // fractional brownian motion layers, dynamic lorenz-like attractor particles,
    // quaternion-inspired vortex precession, and spectral caustics.

    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');

    // ---- Ghost simulation (abstract, not pacman) ----
    const ghost = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      direction: { dx: 0.7, dy: -0.4 },
      color: '#ff9f3c',       // amber core
      defaultColor: '#ff9f3c',
      state: 'NORMAL',        // cycles: NORMAL -> FRIGHTENED -> EATEN -> NORMAL
      isFlashing: false,
      flashSpeed: 180,
    };

    // State cycle for demonstration
    let stateTimer = 0;
    const stateSequence = ['NORMAL', 'FRIGHTENED', 'EATEN'];
    let stateIndex = 0;

    // Advanced particle system (cosmic dust, jets, spark filaments)
    let particles = [];
    let vortexRotation = 0;
    let globalTime = 0;

    // ----- Complex noise / math helpers -----
    const fract = (x) => x - Math.floor(x);
    const lerp = (a, b, t) => a + (b - a) * t;
    const hash = (x, y) => {
      let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return fract(h);
    };

    // Pseudo-FBM (fractional Brownian motion) for organic movement
    function fbm(x, y, t) {
      let value = 0;
      let amp = 0.6;
      let freq = 1.8;
      let max = 0;
      for (let i = 0; i < 5; i++) {
        const nx = x * freq + i * 0.7 + t * 0.2;
        const ny = y * freq + i * 1.1 - t * 0.15;
        value += amp * (hash(Math.floor(nx * 1000) / 1000, Math.floor(ny * 1000) / 1000) * 2 - 1);
        max += amp;
        freq *= 2.1;
        amp *= 0.55;
      }
      return value / max;
    }

    // Lorenz attractor derivative (simplified) for particle chaos
    function lorenzStep(x, y, z, dt = 0.008) {
      const sigma = 10.2;
      const rho = 28.5;
      const beta = 2.667;
      const dx = sigma * (y - x);
      const dy = x * (rho - z) - y;
      const dz = x * y - beta * z;
      return {
        x: x + dx * dt,
        y: y + dy * dt,
        z: z + dz * dt,
      };
    }

    // ---- Particle types (extended) ----
    class CosmicParticle {
      constructor(x, y, vx, vy, color, type, life, size) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.type = type; // 'SPARK', 'JET', 'FILAMENT', 'CAUSTIC'
        this.life = life;
        this.maxLife = life;
        this.size = size;
        this.alpha = 0.9;
        // Lorenz state for chaotic particles
        this.lx = Math.random() * 2 - 1;
        this.ly = Math.random() * 2 - 1;
        this.lz = Math.random() * 2 - 1;
      }
    }

    // ---- Emit propulsion with multi-layered complexity ----
    function emitPropulsionJets(ghostRef, r, color, isFrightened) {
      const dirX = ghostRef.direction.dx || 0.7;
      const dirY = ghostRef.direction.dy || -0.4;
      const spawnCount = isFrightened ? 4 : 2;

      for (let i = 0; i < spawnCount; i++) {
        const baseAngle = Math.atan2(dirY, dirX) + Math.PI; // opposite direction
        const spread = isFrightened ? 0.9 : 0.45;
        const angle = baseAngle + (Math.random() - 0.5) * spread;

        const offsetX = ghostRef.x - dirX * (r * 0.55);
        const offsetY = ghostRef.y - dirY * (r * 0.55);
        const startX = offsetX + (Math.random() - 0.5) * r * 0.7;
        const startY = offsetY + (Math.random() - 0.5) * r * 0.7;

        const jetPower = isFrightened ? 110 : 130;
        const vx = Math.cos(angle) * jetPower + (Math.random() - 0.5) * 50;
        const vy = Math.sin(angle) * jetPower + (Math.random() - 0.5) * 50;

        const types = ['SPARK', 'JET', 'FILAMENT', 'CAUSTIC'];
        const typeWeights = isFrightened ? [0.3, 0.3, 0.25, 0.15] : [0.25, 0.35, 0.25, 0.15];
        let rand = Math.random();
        let type = 'JET';
        let cumulative = 0;
        for (let t = 0; t < types.length; t++) {
          cumulative += typeWeights[t];
          if (rand <= cumulative) {
            type = types[t];
            break;
          }
        }

        const lifeBase = isFrightened ? 0.25 : 0.45;
        const life = lifeBase * (0.7 + Math.random() * 0.6);
        const size = Math.random() * (isFrightened ? 2.2 : 3.8) + 1.2;

        particles.push(new CosmicParticle(
          startX, startY, vx, vy, color, type, life, size
        ));
      }
    }

    // ---- Update particles with lorenz chaos & FBM drift ----
    function updateParticles(dt, timestamp) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        // Chaotic perturbation via lorenz attractor
        if (p.type === 'FILAMENT' || p.type === 'CAUSTIC') {
          const lState = lorenzStep(p.lx, p.ly, p.lz, dt * 0.9);
          p.lx = lState.x;
          p.ly = lState.y;
          p.lz = lState.z;
          // map lorenz to velocity influence
          p.vx += (p.lx * 0.7) * dt * 28;
          p.vy += (p.ly * 0.7) * dt * 28;
        }

        // FBM drift for organic feel
        const noiseX = fbm(p.x * 0.04, p.y * 0.04, timestamp * 0.002) * 35;
        const noiseY = fbm(p.x * 0.04 + 5.3, p.y * 0.04 - 2.1, timestamp * 0.002) * 35;
        p.vx += noiseX * dt * 0.9;
        p.vy += noiseY * dt * 0.9;

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.923;
        p.vy *= 0.923;
      }
    }

    // ---- Draw particles with spectral caustics & filaments ----
    function drawParticles(ctxRef) {
      ctxRef.save();
      for (const p of particles) {
        const lifeRatio = p.life / p.maxLife;
        const alpha = p.alpha * lifeRatio;
        if (alpha < 0.02) continue;

        ctxRef.save();
        ctxRef.globalAlpha = alpha;

        if (p.type === 'FILAMENT') {
          ctxRef.shadowBlur = 14;
          ctxRef.shadowColor = p.color;
          ctxRef.strokeStyle = p.color;
          ctxRef.lineWidth = p.size * lifeRatio * 0.9;
          ctxRef.beginPath();
          const len = p.size * 1.8;
          const angle = Math.atan2(p.vy, p.vx) + Math.sin(globalTime * 0.03 + p.x) * 0.5;
          ctxRef.moveTo(p.x, p.y);
          ctxRef.lineTo(p.x + Math.cos(angle) * len, p.y + Math.sin(angle) * len);
          ctxRef.stroke();
        } else if (p.type === 'CAUSTIC') {
          ctxRef.shadowBlur = 22;
          ctxRef.shadowColor = '#ffffff';
          const grad = ctxRef.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 1.6);
          grad.addColorStop(0, 'white');
          grad.addColorStop(0.5, p.color);
          grad.addColorStop(1, 'rgba(0,0,0,0)');
          ctxRef.fillStyle = grad;
          ctxRef.beginPath();
          ctxRef.arc(p.x, p.y, p.size * lifeRatio * 1.5, 0, Math.PI * 2);
          ctxRef.fill();
        } else if (p.type === 'JET') {
          ctxRef.shadowBlur = 12;
          ctxRef.shadowColor = p.color;
          ctxRef.fillStyle = p.color;
          ctxRef.beginPath();
          ctxRef.arc(p.x, p.y, p.size * lifeRatio, 0, Math.PI * 2);
          ctxRef.fill();
        } else { // SPARK
          ctxRef.shadowBlur = 6;
          ctxRef.shadowColor = p.color;
          ctxRef.fillStyle = p.color;
          const sz = p.size * lifeRatio;
          ctxRef.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
        }
        ctxRef.restore();
      }
      ctxRef.restore();
    }

    // ---- GRAVITATIONAL VORTEX (hyper-complex mathematical strands) ----
    function drawGravitationalVortex(ctxRef, r, themeColor, isFrightened, timestamp) {
      ctxRef.save();
      ctxRef.translate(ghost.x, ghost.y);
      ctxRef.rotate(vortexRotation);

      if (isFrightened) {
        // FRIGHTENED: hyperbolic rose + epicycloid interference
        const arms = 7;
        const maxRadius = r * 1.45;
        ctxRef.shadowBlur = 20;
        ctxRef.shadowColor = themeColor;

        for (let j = 0; j < arms; j++) {
          ctxRef.save();
          const baseAngle = (j * Math.PI * 2) / arms;
          ctxRef.rotate(baseAngle);

          // Outer epicycloid wave
          ctxRef.beginPath();
          ctxRef.strokeStyle = themeColor;
          ctxRef.lineWidth = 2.8;
          ctxRef.globalAlpha = 0.8;
          for (let k = 0; k <= 80; k++) {
            const t = k / 80;
            const radius = maxRadius * (0.5 + 0.5 * Math.sin(t * Math.PI));
            const spiralTwist = t * Math.PI * 2.3;
            const x = Math.cos(spiralTwist) * radius;
            const y = Math.sin(spiralTwist) * radius * 0.9; // elliptical
            if (k === 0) ctxRef.moveTo(x, y);
            else ctxRef.lineTo(x, y);
          }
          ctxRef.stroke();

          // inner filament (white hot)
          ctxRef.strokeStyle = 'rgba(255,255,255,0.95)';
          ctxRef.lineWidth = 1.4;
          ctxRef.beginPath();
          for (let k = 0; k <= 60; k++) {
            const t = k / 60;
            const radius = maxRadius * 0.7 * (1 - t * 0.6);
            const angle = t * Math.PI * 1.9;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (k === 0) ctxRef.moveTo(x, y);
            else ctxRef.lineTo(x, y);
          }
          ctxRef.stroke();
          ctxRef.restore();
        }
      } else {
        // NORMAL: multi-layered logarithmic spirals with FBM distortion
        const totalStrands = 28;
        const pointsPerStrand = 25;
        const maxRadius = r * 1.5;

        for (let i = 0; i < totalStrands; i++) {
          ctxRef.save();
          const strandAngle = (i * Math.PI * 2) / 6.5;
          ctxRef.rotate(strandAngle);

          const strandType = i % 5;
          ctxRef.beginPath();
          ctxRef.lineWidth = strandType === 0 ? 1.9 : (strandType === 2 ? 1.2 : 0.7);
          const whiteAlpha = strandType === 0 ? 0.9 : 0.35;
          ctxRef.strokeStyle = strandType === 0 ? `rgba(255,255,255,${whiteAlpha})` : themeColor;
          ctxRef.globalAlpha = strandType === 0 ? 0.55 : 0.28;
          ctxRef.shadowBlur = strandType === 0 ? 10 : 5;
          ctxRef.shadowColor = themeColor;

          for (let j = 0; j < pointsPerStrand; j++) {
            const ratio = j / pointsPerStrand;
            const baseRadius = maxRadius * (1.0 - ratio * 0.85);
            // logarithmic spiral with FBM perturbation
            const spiralAngle = ratio * Math.PI * 1.7 + 
                                fbm(i * 0.7, ratio * 4.2, timestamp * 0.003) * 0.4;
            const radiusJitter = fbm(ratio * 6.1, i * 0.3, timestamp * 0.002) * 2.2;
            const currentRadius = baseRadius + radiusJitter;
            const x = Math.cos(spiralAngle) * currentRadius;
            const y = Math.sin(spiralAngle) * currentRadius;
            if (j === 0) ctxRef.moveTo(x, y);
            else ctxRef.lineTo(x, y);
          }
          ctxRef.stroke();
          ctxRef.restore();
        }
      }
      ctxRef.restore();

      // --- EVENT HORIZON LENS (with caustic rings) ---
      ctxRef.save();
      ctxRef.translate(ghost.x, ghost.y);
      const pulse = Math.sin(timestamp * 0.015) * 0.05 + 0.88;
      const pulseRadius = r * pulse;
      const lensGrad = ctxRef.createRadialGradient(0, 0, r * 0.15, 0, 0, pulseRadius * 1.45);
      
      if (isFrightened) {
        lensGrad.addColorStop(0, '#140033');
        lensGrad.addColorStop(0.35, 'rgba(180, 0, 255, 0.7)');
        lensGrad.addColorStop(0.7, 'rgba(255, 80, 180, 0.25)');
      } else {
        lensGrad.addColorStop(0, 'rgba(0,0,0,1)');
        lensGrad.addColorStop(0.4, themeColor);
        lensGrad.addColorStop(0.75, `${themeColor}30`);
      }
      lensGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctxRef.fillStyle = lensGrad;
      ctxRef.beginPath();
      ctxRef.arc(0, 0, pulseRadius * 1.45, 0, Math.PI*2);
      ctxRef.fill();

      // Additional thin caustic rings
      ctxRef.strokeStyle = isFrightened ? '#ff99ee' : '#ffcc88';
      ctxRef.lineWidth = 1.7;
      ctxRef.shadowBlur = 18;
      ctxRef.shadowColor = themeColor;
      ctxRef.beginPath();
      ctxRef.arc(0, 0, pulseRadius * 0.95, 0, Math.PI*2);
      ctxRef.stroke();
      ctxRef.restore();

      // --- 3D SINGULARITY CORE (with relativistic distortion) ---
      ctxRef.save();
      ctxRef.translate(ghost.x, ghost.y);
      const singSize = isFrightened ? r * 0.42 : r * 0.48;
      const coreGrad = ctxRef.createRadialGradient(0, 0, singSize * 0.35, 0, 0, singSize);
      coreGrad.addColorStop(0, '#000000');
      coreGrad.addColorStop(0.65, 'rgba(10, 8, 20, 1)');
      coreGrad.addColorStop(0.88, `${themeColor}70`);
      coreGrad.addColorStop(1, '#000000');
      ctxRef.fillStyle = coreGrad;
      ctxRef.beginPath();
      ctxRef.arc(0, 0, singSize, 0, 2*Math.PI);
      ctxRef.fill();
      
      ctxRef.strokeStyle = isFrightened ? '#ffffff' : `${themeColor}DD`;
      ctxRef.lineWidth = 1.8;
      ctxRef.shadowBlur = 15;
      ctxRef.beginPath();
      ctxRef.arc(0, 0, singSize, 0, 2*Math.PI);
      ctxRef.stroke();
      ctxRef.restore();
    }

    // ---- EATEN / SINGULARITY REMNANT (hyper-speed quantum stream) ----
    function drawSingularityRemnant(ctxRef, r, themeColor, timestamp) {
      ctxRef.save();
      ctxRef.translate(ghost.x, ghost.y);
      ctxRef.shadowBlur = 22;
      ctxRef.shadowColor = themeColor;

      const beamLength = r * 2.7;
      const beamGrad = ctxRef.createLinearGradient(-beamLength/2, 0, beamLength/2, 0);
      beamGrad.addColorStop(0, 'rgba(0,240,255,0)');
      beamGrad.addColorStop(0.4, '#ffffff');
      beamGrad.addColorStop(0.6, '#a0f0ff');
      beamGrad.addColorStop(1, 'rgba(0,200,255,0)');
      ctxRef.fillStyle = beamGrad;
      ctxRef.fillRect(-beamLength/2, -4.5, beamLength, 9);

      // complex scanner brackets with lissajous modulation
      const lx = Math.sin(timestamp * 0.025) * 3.2;
      const ly = Math.cos(timestamp * 0.031) * 2.8;
      ctxRef.strokeStyle = 'rgba(180,240,255,0.9)';
      ctxRef.lineWidth = 1.5;
      ctxRef.beginPath();
      ctxRef.moveTo(-r*0.65, -6 + lx);
      ctxRef.lineTo(-r*0.82, ly*0.5);
      ctxRef.lineTo(-r*0.65, 6 - lx);
      ctxRef.moveTo(r*0.65, -6 - ly);
      ctxRef.lineTo(r*0.82, -lx*0.5);
      ctxRef.lineTo(r*0.65, 6 + ly);
      ctxRef.stroke();

      // quantum dot core
      ctxRef.fillStyle = '#ffffff';
      ctxRef.shadowBlur = 18;
      ctxRef.beginPath();
      ctxRef.arc(0, 0, 3.2, 0, 2*Math.PI);
      ctxRef.fill();
      ctxRef.restore();
    }

    // ---- Main render orchestrator ----
    function render(timestamp) {
      globalTime = timestamp;
      // Cycle ghost state every 7 seconds for demonstration
      stateTimer += 16;
      if (stateTimer > 7000) {
        stateTimer = 0;
        stateIndex = (stateIndex + 1) % stateSequence.length;
        ghost.state = stateSequence[stateIndex];
        if (ghost.state === 'FRIGHTENED') {
          ghost.isFlashing = true;
          ghost.flashSpeed = 170;
        } else {
          ghost.isFlashing = false;
        }
      }

      // subtle ghost movement (orbital drift)
      const moveAngle = timestamp * 0.0004;
      ghost.x = canvas.width/2 + Math.cos(moveAngle) * 45;
      ghost.y = canvas.height/2 + Math.sin(moveAngle * 1.3) * 35;
      ghost.direction.dx = Math.cos(moveAngle + 0.8);
      ghost.direction.dy = Math.sin(moveAngle + 0.8);

      const tileSize = 72; // reference
      const r = tileSize * 0.38;
      let themeColor = ghost.color || ghost.defaultColor;
      let isFrightened = ghost.state === 'FRIGHTENED';
      let isEaten = ghost.state === 'EATEN';

      if (isFrightened) {
        if (ghost.isFlashing) {
          const isWhite = Math.floor(timestamp / ghost.flashSpeed) % 2 === 0;
          themeColor = isWhite ? '#ffffff' : '#ff44b0';
        } else {
          themeColor = '#7a30ff';
        }
      } else if (isEaten) {
        themeColor = 'rgba(0, 230, 255, 0.9)';
      }

      vortexRotation += isFrightened ? 0.14 : 0.055;

      // Clear with deep space gradient
      const bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 50, canvas.width/2, canvas.height/2, 600);
      bgGrad.addColorStop(0, '#16163a');
      bgGrad.addColorStop(0.7, '#030314');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Update particles
      const dt = Math.min(0.033, 16/1000);
      updateParticles(dt, timestamp);

      // Emit jets if not eaten and moving
      if (!isEaten && (ghost.direction.dx !== 0 || ghost.direction.dy !== 0)) {
        emitPropulsionJets(ghost, r, themeColor, isFrightened);
      }

      // Draw all particles first (background layer)
      drawParticles(ctx);

      // Draw core ghost assembly
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      if (!isEaten) {
        drawGravitationalVortex(ctx, r, themeColor, isFrightened, timestamp);
      } else {
        drawSingularityRemnant(ctx, r, themeColor, timestamp);
      }
      ctx.restore();

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  })();
</script>
</body>
</html>
